<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thorax &amp; GI Lab Pictures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one study column; sticky control bar; region sections split into picture-type parts.
   Occlusion boxes look like strips of amber lab tape laid over the labels. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5b6875;
  --line: #d3d9df;
  --accent: #1d5b86;
  --accent-ink: #ffffff;
  --tape: #f0a637;
  --tape-2: #e4952a;
  --tape-edge: #b86e0e;
  --chip: #e2e7ec;
  --note: #fff6e6;
  --note-line: #efd3a2;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151a; --surface: #172029; --ink: #e5eaee; --muted: #94a2ae; --line: #2a3541;
    --accent: #6eaedb; --accent-ink: #0d1217; --tape: #dc9a33; --tape-2: #cc8b27; --tape-edge: #f2b55a;
    --chip: #202b36; --note: #2a2316; --note-line: #5a4626; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151a; --surface: #172029; --ink: #e5eaee; --muted: #94a2ae; --line: #2a3541;
  --accent: #6eaedb; --accent-ink: #0d1217; --tape: #dc9a33; --tape-2: #cc8b27; --tape-edge: #f2b55a;
  --chip: #202b36; --note: #2a2316; --note-line: #5a4626; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { font: 700 1.3rem/1.1 var(--f-display); letter-spacing: .01em; margin-right: auto; }
.brand small { display: block; font: 500 .8rem/1.3 var(--f-body); color: var(--muted); letter-spacing: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hy { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.hy select, .hy input { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 6px; }
.hy input { width: 5.2em; font-variant-numeric: tabular-nums; }
.types { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.types .lbl { font-weight: 600; margin-right: 4px; }
.types button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .85rem; font-weight: 600; }
.types button:hover { border-color: var(--accent); }
.types button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.types button .c { font-weight: 500; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
.toc { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.toc a { flex: none; text-decoration: none; color: var(--ink); background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: .85rem; white-space: nowrap; }
.toc a:hover { background: var(--accent); color: var(--accent-ink); }
.toc a .c { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.toc a:hover .c { color: inherit; }
.toc a.empty { opacity: .45; }

main { max-width: 1180px; margin: 0 auto; padding-block: 18px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 34px; }
section.region { display: grid; gap: 18px; scroll-margin-top: 176px; }
h2 { font: 700 1.75rem/1.15 var(--f-display); margin: 0; text-wrap: balance; border-bottom: 3px solid var(--ink); padding-bottom: 6px; display: flex; align-items: baseline; gap: 10px; }
h2 .c, h3 .c { font: 500 .9rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.part { display: grid; gap: 14px; }
h3 { font: 600 1.05rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 0; color: var(--accent); display: flex; align-items: baseline; gap: 8px; }

figure.pic { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cap { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; font-size: .9rem; border-bottom: 1px solid var(--line); }
.cap .src { font-weight: 600; min-width: 0; }
.cap .rank { font: 600 .78rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cap .shown { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stage { position: relative; width: 100%; max-width: 100%; margin: 0 auto; background: var(--surface); }
.stage img { display: block; width: 100%; height: auto; }
.occ { position: absolute; padding: 0; border: 1px solid var(--tape-edge); border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--tape) 0 9px, var(--tape-2) 9px 18px);
  box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: background-color .12s, opacity .12s; }
.occ:hover { filter: brightness(1.07); }
.occ.open { background: transparent; box-shadow: none; border: 2px dashed var(--tape); }
.occ.open:hover { background: rgba(240,166,55,.12); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.actions .btn { padding: 5px 12px; }
.note { margin: 0; padding: 8px 12px; background: var(--note); border-top: 1px solid var(--note-line); font-size: .88rem; max-width: none; }
.note b { font-weight: 600; }
.where { border-top: 1px solid var(--line); }
.where > summary { padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 8px; }
.where > summary::-webkit-details-marker { display: none; }
.where > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
.where[open] > summary::before { transform: rotate(45deg); }
.where > summary .c { color: var(--muted); font-weight: 500; font-size: .85rem; }
.where ul { list-style: none; margin: 0; padding: 2px 12px 14px; display: grid; gap: 14px; }
.where li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 16px; align-items: start; padding-top: 12px; border-top: 1px dashed var(--line); }
.where li:first-child { border-top: 0; padding-top: 4px; }
.where li.noimg { grid-template-columns: minmax(0, 1fr); }
.where .nm { font: 600 1rem/1.3 var(--f-display); margin: 0 0 3px; }
.where .nm .k { color: var(--muted); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
.where .tx { margin: 0; max-width: 62ch; }
.where .tb { margin: 0; }
.where .tb a { display: block; position: relative; background: #fff; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; overflow: hidden; }
.where .tb img { display: block; width: 100%; height: auto; }
.where .tb .hl { position: absolute; border: 3px solid #e0262f; border-radius: 4px; background: rgba(255, 230, 0, .28); box-shadow: 0 0 0 2px rgba(255,255,255,.8); pointer-events: none; }
.where .tb figcaption { font-size: .72rem; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.where .tb figcaption a { color: inherit; display: inline; background: none; border: 0; padding: 0; cursor: pointer; }
.where .same { font-size: .8rem; color: var(--muted); font-style: italic; }
@media (max-width: 640px) { .where li { grid-template-columns: minmax(0, 1fr); } }
.hidden-count { color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .occ { transition: none; } }
@media (max-width: 560px) { .brand { font-size: 1.1rem; } h2 { font-size: 1.4rem; } }
</style>
</head>
<body>


<header class="bar">
  <div class="bar-in">
    <div class="row1">
      <div class="brand">Thorax &amp; GI lab pictures<small id="summary"></small></div>
      <button class="btn primary" id="revealAll" type="button">Reveal all</button>
      <button class="btn" id="hideAll" type="button">Hide all</button>
      <label class="hy" for="topN">Show
        <select id="topN">
          <option value="all">all pictures</option>
          <option value="10">top 10 high-yield</option>
          <option value="25">top 25 high-yield</option>
          <option value="50">top 50 high-yield</option>
          <option value="75">top 75 high-yield</option>
          <option value="100">top 100 high-yield</option>
          <option value="custom">top N high-yield…</option>
        </select>
        <input id="topCustom" type="number" min="1" step="1" inputmode="numeric" aria-label="Number of high-yield pictures" hidden>
      </label>
    </div>
    <div class="types" id="types" role="group" aria-label="Picture types"><span class="lbl">Type</span></div>
    <nav class="toc" id="toc" aria-label="Regions"></nav>
  </div>
</header>
<main id="main"></main>

V",21,null],["RA",24,null],["IVC",2,null],["Azygos vein",17,null]]},{"id":"na_CSATH13_2","r":"lungs","m":"xsec","t":"NetAnatomy Thorax cross-section, level 13: Respiratory","f":"img/na_CSATH13_2.jpg","w":1400,"h":796,"k":231,"o":130,"n":[],"b":[[0.2465,0.0102,0.4558,0.047],[0.5878,0.0143,0.7808,0.0511],[0.0564,0.2249,0.1843,0.2607],[0.8273,0.2658,0.9552,0.3016],[0.0872,0.3016,0.1762,0.3374],[0.839,0.3384,0.9285,0.3742],[0.125,0.953,0.3599,0.9898],[0.7157,0.9509,0.939,0.9877]],"d":[["Middle Lobe of Right Lung",123,null],["Upper Lobe of Left Lung",25,null],["Oblique Fissure",98,null],["Diaphragm",37,null],["Lower Lobe of the Left Lung",36,null]]},{"id":"na_CSATH13_3","r":"mediast","m":"xsec","t":"NetAnatomy Thorax cross-section, level 13: Other","f":"img/na_CSATH13_3.jpg","w":1400,"h":762,"k":186,"o":130,"n":[],"b":[[0.4709,0.0107,0.5628,0.0481],[0.0558,0.2276,0.1994,0.266],[0.8233,0.2436,0.9419,0.2746],[0.6535,0.5962,0.6936,0.64]],"d":[["Esophagus",14,null],["Liver (Right Lobe)",3,null],["Abdominal Fat",468,null],["Thoracic duct",81,null]]}],"S":[{"w":"The stomach is the J-shaped sac in the left upper abdomen, running from the esophagus at the cardia to the duodenum at the pylorus, in front of the pancreas.","i":"img/tb/v3_moore_267_1632.jpg","iw":1000,"ih":1052,"hl":[0.8863,0.0603,0.9784,0.0858],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.42","c":"Lymphatic drainage and innervation of stomach and small intestine"},{"w":"The heart sits in the pericardium in the middle mediastinum between the lungs, its base facing back toward the esophagus and its apex pointing forward, down and left.","i":"img/tb/v3_moore_158_1438.jpg","iw":1000,"ih":303,"hl":[0.8997,0.5722,0.9375,0.6312],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.43","c":"Pericardium and heart"},{"w":"The inferior vena cava rises just right of the aorta, passes behind the duodenum, pancreatic head and liver, and pierces the diaphragm at T8 into the right atrium.","i":"img/tb/v3_moore_324_1755.jpg","iw":1000,"ih":825,"hl":[0.0149,0.0201,0.1658,0.0466],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.83","c":"Blood vessels of suprarenal glands, kidneys, and superior parts of ureters"},{"w":"The liver is the large solid organ under the right dome of the diaphragm, reaching across the midline to the left and wrapping around the inferior vena cava.","i":"img/tb/v3_moore_302_1710.jpg","iw":1000,"ih":601,"hl":[0.4152,0.8853,0.4463,0.9169],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.67","c":"Hepatic segmentation"},{"w":"The left lower lobe lies behind and below the oblique fissure, forming most of the lung's back and base, which rests on the left dome of the diaphragm.","i":"img/tb/v3_gray_264_258.jpg","iw":1000,"ih":601,"hl":[0.0878,0.5674,0.186,0.5972],"a":"Gray's Anatomy for Students, Fig. 3.103","c":"Views of the chest wall showing the surface projections of the lobes and the fissures of the lungs"},{"w":"The abdominal aorta descends on the lumbar vertebral bodies just left of midline, with the inferior vena cava on its right, from T12 to its L4 bifurcation.","i":"img/tb/v3_moore_343_1789.jpg","iw":900,"ih":834,"hl":[0.758,0.3452,0.9359,0.433],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.98","c":"Arteries of posterior abdominal wall\u2014branches of the aorta"},{"w":"The caudate lobe is the small lobe on the back of the liver, just in front of the inferior vena cava, beside the fissure for the ligamentum venosum.","i":"img/tb/v3_moore_298_1703.jpg","iw":672,"ih":872,"hl":[0.1358,0.3826,0.3294,0.4661],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.64","c":"Peritoneal and visceral relationships of liver"},{"w":"The spleen sits in the left upper abdomen against the diaphragm at ribs 9\u201311, behind and left of the stomach, lateral to the left kidney and above the left colic flexure.","i":"img/tb/v3_moore_272_1644.jpg","iw":1000,"ih":976,"hl":[0.9149,0.2317,0.9835,0.2577],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.46","c":"Lymphatic drainage and innervation of duodenum, pancreas, and spleen"},{"w":"The pulmonary trunk leaves the right ventricle in front of and left of the ascending aorta and divides under the aortic arch into the two pulmonary arteries.","i":"img/tb/v3_moore_169_1459.jpg","iw":1000,"ih":637,"hl":[0.016,0.095,0.1469,0.1278],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.54","c":"Interior of right ventricle of heart"},{"w":"The ascending aorta rises up and right from the aortic valve inside the pericardium, between the pulmonary trunk on its left and superior vena cava on its right.","i":"img/tb/v3_moore_123_1356.jpg","iw":1000,"ih":1066,"hl":[0.0227,0.2878,0.2279,0.3188],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.19","c":"Arteries of thoracic wall"},{"w":"The superior vena cava forms behind the right first costal cartilage from the two brachiocephalic veins and runs down right of the ascending aorta into the right atrium, receiving the azygos vein.","i":"img/tb/v3_moore_195_1508.jpg","iw":1000,"ih":781,"hl":[0.8015,0.5111,0.9391,0.5347],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"Lateral exposures of mediastinum"},{"w":"The right pulmonary artery runs horizontally right from the pulmonary trunk, under the aortic arch and behind the ascending aorta and superior vena cava, in front of the right main bronchus.","i":"img/tb/v3_moore_145_1414.jpg","iw":1000,"ih":648,"hl":[0.0131,0.1296,0.1407,0.1913],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.37","c":"Pulmonary circulation"},{"w":"The left main bronchus is longer, narrower and more horizontal than the right, passing under the aortic arch and in front of the esophagus to the left hilum.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.0151,0.6734,0.0916,0.6998],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"The right main bronchus is the short, wide, steep branch going right from the carina, passing under the azygos arch and behind the right pulmonary artery into the hilum.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.0151,0.5851,0.0916,0.6112],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"The esophagus runs behind the trachea, then behind the left atrium, first right of and then in front of the descending aorta, to pierce the diaphragm at T10.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.7054,0.0865,0.7984,0.1129],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"The descending thoracic aorta continues the arch at T4, running down the left side of the vertebral bodies behind the left lung root to the aortic hiatus at T12.","i":"img/tb/v3_moore_199_1513.jpg","iw":1000,"ih":935,"hl":[0.0159,0.7116,0.1478,0.7592],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.73","c":"Thoracic duct and bronchomediastinal trunks"},{"w":"The right ventricle forms most of the heart's front surface and inferior border, behind the sternum, between the right atrium and the pulmonary trunk rising from its top.","i":"img/tb/v3_moore_166_1454.jpg","iw":1000,"ih":897,"hl":[0.0197,0.8847,0.1708,0.9153],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.52","c":"Shape, orientation, surfaces, and borders of heart"},{"w":"The azygos vein climbs the right side of the vertebral bodies behind the esophagus, then arches over the right main bronchus at T4 into the superior vena cava.","i":"img/tb/v3_moore_199_1513.jpg","iw":1000,"ih":935,"hl":[0.0152,0.398,0.1208,0.4223],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.73","c":"Thoracic duct and bronchomediastinal trunks"},{"w":"The left pulmonary artery is the shorter branch of the pulmonary trunk, arching over the left main bronchus as the highest structure in the left lung root.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.0607,0.6005,0.2106,0.6245],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"On a frontal chest film the left lung is the dark field left of the heart, smaller than the right because of the cardiac notch.","i":"img/tb/v3_moore_138_1395.jpg","iw":1000,"ih":742,"hl":[0.7685,0.3099,0.9186,0.3392],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.31","c":"Relationship of thoracic contents and linings of thoracic cage"},{"w":"The right and left main bronchi leave the tracheal bifurcation at T4\u2013T5; the right is shorter, wider and more vertical, and the left passes under the aortic arch in front of the esophagus.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.0151,0.5596,0.1042,0.6112],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"The left ventricle forms the apex and lower left heart border, behind and left of the right ventricle, with a wall two to three times thicker.","i":"img/tb/v3_moore_171_1463.jpg","iw":1000,"ih":816,"hl":[0.7524,0.5344,0.8696,0.5639],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.56","c":"Interior of left atrium and ventricle of heart"},{"w":"The interventricular septum is the thick muscular wall between the right and left ventricles, lying deep to the interventricular grooves and bulging into the right ventricle.","i":"img/tb/v3_moore_176_1476.jpg","iw":805,"ih":354,"hl":[0.7911,0.068,0.9702,0.2755],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.60","c":"Variations in distribution of coronary arteries"},{"w":"The right coronary artery leaves the right aortic sinus, passes between the right auricle and pulmonary trunk, and runs in the right coronary groove around to the diaphragmatic surface.","i":"img/tb/v3_moore_175_1470.jpg","iw":1000,"ih":818,"hl":[0.7608,0.5869,0.8536,0.6205],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.59","c":"Coronary arteries"},{"w":"On a frontal chest film the right atrium forms the right heart border, receiving the superior vena cava above, the inferior vena cava below and the coronary sinus.","i":"img/tb/v3_moore_169_1459.jpg","iw":1000,"ih":637,"hl":[0.0148,0.389,0.1118,0.4215],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.54","c":"Interior of right ventricle of heart"},{"w":"In axial sections the left upper lobe is the lung in front of the oblique fissure, forming the apex and front of the left lung, including the lingula beside the heart.","i":"img/tb/v3_moore_140_1400.jpg","iw":1000,"ih":675,"hl":[0.7941,0.3619,0.9714,0.3901],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"On a frontal chest film the right lung is the dark field right of the heart, above the higher right dome, with three lobes split by two fissures.","i":"img/tb/v3_moore_141_1403.jpg","iw":742,"ih":793,"hl":[0.0324,0.0747,0.2272,0.1217],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.34","c":"Mediastinal surfaces and hila of lungs"},{"w":"The anterior interventricular (left anterior descending) artery branches from the left coronary artery and runs down the anterior interventricular groove to the apex beside the great cardiac vein.","i":"img/tb/v3_moore_176_1474.jpg","iw":631,"ih":491,"hl":[0.0381,0.729,0.3708,0.8776],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.60","c":"Variations in distribution of coronary arteries"},{"w":"The coronary sinus is the wide vein in the posterior coronary groove between left atrium and left ventricle, opening into the right atrium beside the inferior vena cava.","i":"img/tb/v3_moore_177_1477.jpg","iw":1000,"ih":425,"hl":[0.0124,0.457,0.0794,0.5449],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.61","c":"Cardiac veins"},{"w":"The left atrium forms most of the back of the heart, receiving the four pulmonary veins and lying directly in front of the esophagus.","i":"img/tb/v3_moore_171_1463.jpg","iw":1000,"ih":816,"hl":[0.7501,0.2699,0.8479,0.2991],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.56","c":"Interior of left atrium and ventricle of heart"},{"w":"The aortic arch curves back and left from the sternal angle over the left lung root, beside the trachea, and forms the aortic knob on chest films.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.7981,0.4215,0.8889,0.4454],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"The trachea splits into the main bronchi at T4\u2013T5, behind the sternal angle; the carina is the keel-shaped ridge inside the split, below the aortic arch and in front of the esophagus.","i":"img/tb/v3_gray_199_160.jpg","iw":1000,"ih":695,"hl":[0.7738,0.03,0.8366,0.0802],"a":"Gray's Anatomy for Students","c":""},{"w":"The portal vein forms behind the pancreatic neck from the superior mesenteric and splenic veins, then rises in the hepatoduodenal ligament behind the bile duct and hepatic artery.","i":"img/tb/v3_moore_266_1630.jpg","iw":1000,"ih":576,"hl":[0.136,0.3888,0.2234,0.4241],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.41","c":"Veins of stomach, duodenum, and spleen"},{"w":"The left brachiocephalic vein crosses down and right behind the manubrium, in front of the aortic arch branches, to join the right one and form the superior vena cava.","i":"img/tb/v3_moore_160_1444.jpg","iw":1000,"ih":1021,"hl":[0.7717,0.0947,0.9496,0.1637],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.47","c":"Arterial supply and venous drainage of pericardium"},{"w":"The right brachiocephalic vein descends vertically from behind the right sternoclavicular joint, right of the brachiocephalic trunk, to join the left brachiocephalic vein forming the superior vena cava.","i":"img/tb/v3_gray_246_237.jpg","iw":1000,"ih":938,"hl":[0.7142,0.1808,0.9371,0.2038],"a":"Gray's Anatomy for Students, Fig. 3.87","c":"Right vagus nerve passing through the superior mediastinum"},{"w":"The trachea runs down the midline in front of the esophagus to the sternal angle, where it splits into the main bronchi, with the aortic arch curving along its left side.","i":"img/tb/v3_moore_193_1505.jpg","iw":1000,"ih":416,"hl":[0.2131,0.0392,0.2758,0.0867],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.68","c":"Great vessels and nerves"},{"w":"In axial sections the left lower lobe is the lung behind the oblique fissure, forming the back and base of the left lung beside the descending aorta.","i":"img/tb/v3_moore_140_1400.jpg","iw":1000,"ih":675,"hl":[0.8213,0.7624,0.9877,0.7905],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"The diaphragm is the dome-shaped muscle sheet between chest and abdomen, under the lung bases and over the liver and stomach, its right dome higher than its left.","i":"img/tb/v3_moore_258_1617.jpg","iw":1000,"ih":1139,"hl":[0.0187,0.5821,0.1395,0.6073],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.33","c":"The esophagus and its relationships"},{"w":"The aorta leaves the left ventricle, arches over the left main bronchus, then descends on the left front of the spine to the aortic hiatus at T12.","i":"img/tb/v3_moore_139_1397.jpg","iw":1000,"ih":589,"hl":[0.0147,0.5921,0.0539,0.6244],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.32","c":"Diaphragm, base of pulmonary cavities and mediastinum, and costodiaphragmatic recesses"},{"w":"The central tendon is the pale three-lobed tendon at the top of the diaphragm, fused above to the pericardium, holding the inferior vena cava opening at T8.","i":"img/tb/v3_gray_396_432.jpg","iw":1000,"ih":663,"hl":[0.6658,0.0926,0.7852,0.1192],"a":"Gray's Anatomy for Students, Fig. 4.132","c":"Diaphragm"},{"w":"On this slab the vertebral foramen is the hole behind the vertebral body enclosed by the pedicles and laminae; stacked together, these holes form the vertebral canal.","i":"img/tb/v3_moore_106_1332.jpg","iw":1000,"ih":730,"hl":[0.186,0.0755,0.2731,0.1386],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.4","c":"Thoracic vertebrae"},{"w":"The intervertebral disc is the fibrocartilage pad between two vertebral bodies, seen as the gap between them on X-ray and as concentric rings on a slab.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1345,0.2477,0.285,0.2801],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"On these slabs the small intestine is the mass of coiled jejunum and ileum loops filling the central and lower abdomen, framed by the colon and hung from the mesentery.","i":"img/tb/v3_moore_268_1637.jpg","iw":1000,"ih":816,"hl":[0.0363,0.2692,0.2021,0.3061],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.43","c":"Small and large intestines"},{"w":"The transverse colon hangs on the transverse mesocolon between the right and left colic flexures, below the stomach, with the greater omentum attached along its front.","i":"img/tb/v3_moore_250_1604.jpg","iw":1000,"ih":764,"hl":[0.8455,0.5688,0.9753,0.5942],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.26","c":"Parts of greater and lesser omenta"},{"w":"The mesentery is the fan-shaped fatty fold that hangs the jejunum and ileum, its root running from the duodenojejunal flexure to the right sacroiliac joint.","i":"img/tb/v3_moore_249_1600.jpg","iw":684,"ih":698,"hl":[0.0351,0.4091,0.2539,0.4624],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.25","c":"Principal formations of peritoneum"},{"w":"Psoas major is the thick round muscle hugging the sides of the lumbar vertebral bodies, with the kidney in front and lateral and quadratus lumborum behind and lateral.","i":"img/tb/v3_moore_341_1787.jpg","iw":1000,"ih":692,"hl":[0.783,0.4589,0.895,0.4925],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.97","c":"Muscles and nerves of posterior abdominal wall"},{"w":"The duodenum is the C-shaped first part of the small intestine, curving around the pancreatic head from the pylorus at L1 to the duodenojejunal flexure at L2.","i":"img/tb/v3_moore_266_1630.jpg","iw":1000,"ih":576,"hl":[0.0815,0.7208,0.1651,0.7553],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.41","c":"Veins of stomach, duodenum, and spleen"},{"w":"Each common iliac artery runs from the L4 aortic bifurcation to the sacroiliac joint, splitting into external and internal iliacs; the right overlies the inferior vena cava's origin.","i":"img/tb/v3_moore_383_1878.jpg","iw":1000,"ih":517,"hl":[0.0149,0.1106,0.191,0.1546],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.17","c":"Arteries of pelvis"},{"w":"The common iliac veins form at the sacroiliac joints and unite at L5, behind the right common iliac artery, into the inferior vena cava; the left is longer.","i":"img/tb/v3_moore_344_1790.jpg","iw":1000,"ih":1040,"hl":[0.6517,0.7423,0.9125,0.8104],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.99","c":"Inferior vena cava and its tributaries"},{"w":"The pancreas lies behind the peritoneum and stomach across L1 to L2, from the duodenal C-loop on the right to the splenic hilum, with the splenic vein behind it.","i":"img/tb/v3_gray_373_408.jpg","iw":1000,"ih":797,"hl":[0.7595,0.7117,0.835,0.737],"a":"Gray's Anatomy for Students, Fig. 4.113","c":"Arterial supply to the pancreas"},{"w":"The pylorus is the thickened sphincter end of the stomach, joining the superior part of the duodenum at the transpyloric plane (L1) just right of the midline.","i":"img/tb/v3_moore_269_1640.jpg","iw":1000,"ih":618,"hl":[0.0135,0.3274,0.1637,0.3606],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.44","c":"Duodenum, pancreas, and spleen"},{"w":"The gallbladder is the pear-shaped sac on the liver's underside between the right and quadrate lobes, resting on the transverse colon and first part of the duodenum.","i":"img/tb/v3_moore_300_1709.jpg","iw":1000,"ih":605,"hl":[0.0127,0.5554,0.0913,0.5849],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.66","c":"Relationships of liver to other abdominal viscera, lesser omentum, and portal triad"},{"w":"The right kidney lies retroperitoneally on psoas major and quadratus lumborum, slightly lower than the left, behind the liver, descending duodenum and right colic flexure.","i":"img/tb/v3_moore_255_1609.jpg","iw":1000,"ih":684,"hl":[0.6869,0.402,0.7886,0.4334],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.30","c":"Overview of thoracic and abdominal viscera"},{"w":"The common hepatic artery runs right from the celiac trunk along the pancreas's upper border, splitting near the duodenum's first part into gastroduodenal and proper hepatic arteries.","i":"img/tb/v3_gray_374_409.jpg","iw":1000,"ih":880,"hl":[0.6975,0.3061,0.9118,0.3331],"a":"Gray's Anatomy for Students, Fig. 4.114","c":"Distribution of the common hepatic artery"},{"w":"The superior mesenteric artery leaves the front of the aorta at L1, runs down behind the pancreatic neck, then crosses over the left renal vein and third part of the duodenum.","i":"img/tb/v3_gray_376_411.jpg","iw":1000,"ih":1065,"hl":[0.533,0.1227,0.8591,0.148],"a":"Gray's Anatomy for Students, Fig. 4.116","c":"Superior mesenteric artery"},{"w":"The sacrum is the triangle of five fused vertebrae below L5 forming the back of the pelvis, set between the two iliac wings at the sacroiliac joints.","i":"img/tb/v3_moore_369_1852.jpg","iw":1000,"ih":683,"hl":[0.7214,0.8356,0.7952,0.8719],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.9","c":"Floor and walls of pelvis"},{"w":"The iliacus lines the iliac fossa lateral to psoas major, with the femoral nerve in the groove between them, and joins psoas to insert on the lesser trochanter.","i":"img/tb/v3_moore_231_1574.jpg","iw":1000,"ih":454,"hl":[0.1467,0.3654,0.1932,0.4074],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.14","c":"Formations of inguinal region"},{"w":"The internal iliac artery branches from the common iliac in front of the sacroiliac joint and descends into the pelvis, with the ureter crossing in front of it.","i":"img/tb/v3_moore_413_1923.jpg","iw":1000,"ih":681,"hl":[0.8336,0.5449,0.9207,0.5727],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.41","c":"Blood supply and venous drainage of uterus, vagina, and ovaries"},{"w":"The internal iliac vein rises out of the pelvis behind and medial to its artery and joins the external iliac vein to form the common iliac vein.","i":"img/tb/v3_moore_385_1880.jpg","iw":1000,"ih":1176,"hl":[0.0198,0.772,0.1594,0.8227],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.19","c":"Pelvic veins"},{"w":"The external iliac artery follows the pelvic brim along the medial edge of psoas, its vein medial to it, and becomes the femoral artery under the inguinal ligament.","i":"img/tb/v3_moore_319_1746.jpg","iw":1000,"ih":856,"hl":[0.0971,0.9011,0.3129,0.9242],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.76","c":"Posterior abdominal wall showing great vessels, kidneys, and suprarenal glands"},{"w":"The femoral nerve leaves psoas major's lateral border, runs in the groove between psoas and iliacus, and passes under the inguinal ligament lateral to the femoral artery.","i":"img/tb/v3_gray_427_473.jpg","iw":1000,"ih":943,"hl":[0.156,0.517,0.3191,0.5353],"a":"Gray's Anatomy for Students","c":""},{"w":"The external iliac artery and vein run along the medial edge of psoas major from the common iliac fork to the inguinal ligament, becoming the femoral vessels; the vein lies medial.","i":"img/tb/v3_moore_319_1746.jpg","iw":1000,"ih":856,"hl":[0.0971,0.9011,0.3129,0.9242],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.76","c":"Posterior abdominal wall showing great vessels, kidneys, and suprarenal glands"},{"w":"The internal iliac artery and vein drop from the common iliac fork at the pelvic brim, in front of the sacroiliac joint, into the lesser pelvis, with the vein behind the artery.","i":"img/tb/v3_moore_413_1923.jpg","iw":1000,"ih":681,"hl":[0.8336,0.5449,0.9207,0.5996],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.41","c":"Blood supply and venous drainage of uterus, vagina, and ovaries"},{"w":"The superior mesenteric vein climbs just right of the superior mesenteric artery and joins the splenic vein behind the pancreatic neck to form the portal vein.","i":"img/tb/v3_moore_266_1630.jpg","iw":1000,"ih":576,"hl":[0.127,0.8905,0.3314,0.9261],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.41","c":"Veins of stomach, duodenum, and spleen"},{"w":"The proper hepatic artery continues the common hepatic beyond the gastroduodenal branch, rising in the hepatoduodenal ligament left of the bile duct and in front of the portal vein.","i":"img/tb/v3_gray_374_409.jpg","iw":1000,"ih":880,"hl":[0.6986,0.1666,0.893,0.1935],"a":"Gray's Anatomy for Students, Fig. 4.114","c":"Distribution of the common hepatic artery"},{"w":"The falciform ligament is the peritoneal fold tying the front of the liver to the abdominal wall above the umbilicus, carrying the round ligament in its free edge.","i":"img/tb/v3_moore_256_1611.jpg","iw":1000,"ih":1124,"hl":[0.0237,0.1635,0.1535,0.2274],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.31","c":"Abdominal contents in situ and in relation to alimentary system"},{"w":"The left common carotid artery is the middle of the three aortic arch branches, rising along the left side of the trachea in front of the left subclavian artery.","i":"img/tb/v3_moore_192_1503.jpg","iw":872,"ih":945,"hl":[0.5356,0.1977,0.9724,0.2367],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.67","c":"Common pattern of branches of arch of aorta"},{"w":"On a coronary angiogram the posterior interventricular artery runs down the posterior interventricular groove toward the apex, arising from the right coronary artery in right-dominant hearts.","i":"img/tb/v3_gray_214_186.jpg","iw":1000,"ih":810,"hl":[0.5099,0.9573,0.7591,0.9826],"a":"Gray's Anatomy for Students, Fig. 3.59","c":"Diaphragmatic surface of the heart"},{"w":"The right colic (hepatic) flexure is where the ascending colon turns left into the transverse colon, under the right lobe of the liver and in front of the right kidney.","i":"img/tb/v3_moore_250_1604.jpg","iw":1000,"ih":764,"hl":[0.0127,0.6086,0.1611,0.659],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.26","c":"Parts of greater and lesser omenta"},{"w":"The major calyces are the two or three main branches of the renal pelvis inside the renal sinus, each formed where several minor calyces join.","i":"img/tb/v3_gray_404_444.jpg","iw":1000,"ih":801,"hl":[0.6941,0.2514,0.7946,0.2793],"a":"Gray's Anatomy for Students, Fig. 4.141","c":"Internal structure of the kidney"},{"w":"The gastroduodenal artery leaves the common hepatic artery and descends behind the first part of the duodenum, splitting into the right gastro-omental and anterior superior pancreaticoduodenal arteries.","i":"img/tb/v3_gray_337_347.jpg","iw":1000,"ih":932,"hl":[0.7759,0.8689,0.9834,0.8946],"a":"Gray's Anatomy for Students, Fig. 4.59","c":"Abdominal esophagus"},{"w":"The internal thoracic artery is a branch of the subclavian artery that runs down behind the costal cartilages about 1 cm lateral to the edge of the sternum.","i":"img/tb/v3_moore_123_1359.jpg","iw":1000,"ih":1089,"hl":[0.0234,0.2794,0.2448,0.3123],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.19","c":"Arteries of thoracic wall"},{"w":"The internal intercostal lies deep to the external intercostal in each rib space, its fibres running down and back, with the intercostal vessels and nerve beneath it.","i":"img/tb/v3_gray_180_138.jpg","iw":1000,"ih":807,"hl":[0.0155,0.7136,0.2613,0.7392],"a":"Gray's Anatomy for Students, Fig. 3.27","c":"Intercostal muscles"},{"w":"The septomarginal trabecula (moderator band) is the muscular band crossing the right ventricle from the lower interventricular septum to the base of the anterior papillary muscle, carrying the right bundle branch.","i":"img/tb/v3_gray_220_192.jpg","iw":1000,"ih":773,"hl":[0.7794,0.7122,0.9859,0.7366],"a":"Gray's Anatomy for Students, Fig. 3.64","c":"Internal view of the right ventricle"},{"w":"The atrioventricular node sits in the lower interatrial septum on the right atrial side, beside the coronary sinus opening, just above the tricuspid valve's septal cusp.","i":"img/tb/v3_moore_178_1478.jpg","iw":1000,"ih":777,"hl":[0.7895,0.1863,0.9807,0.2629],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.62","c":"Conducting system of heart"},{"w":"The internal oblique is the middle flat abdominal muscle, between the external oblique outside and transversus abdominis inside, with fibres running up and toward the midline.","i":"img/tb/v3_moore_218_1560.jpg","iw":1000,"ih":837,"hl":[0.4129,0.0649,0.5754,0.0976],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.6","c":"Structure of anterolateral abdominal wall"},{"w":"The right colic artery leaves the right side of the superior mesenteric artery, between the middle colic and ileocolic arteries, and runs behind the peritoneum to the ascending colon.","i":"img/tb/v3_gray_376_411.jpg","iw":1000,"ih":1065,"hl":[0.6967,0.5171,0.8087,0.5333],"a":"Gray's Anatomy for Students, Fig. 4.116","c":"Superior mesenteric artery"},{"w":"The hepatogastric ligament is the thin left part of the lesser omentum, spanning from the stomach's lesser curvature to the fissure for the ligamentum venosum.","i":"img/tb/v3_moore_300_1709.jpg","iw":1000,"ih":605,"hl":[0.7936,0.2366,0.8883,0.2944],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.66","c":"Relationships of liver to other abdominal viscera, lesser omentum, and portal triad"},{"w":"The cystic duct runs from the gallbladder neck to join the common hepatic duct, forming the bile duct, with the cystic artery just above it.","i":"img/tb/v3_moore_307_1719.jpg","iw":1000,"ih":619,"hl":[0.3507,0.7762,0.4349,0.8086],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.72","c":"Nerves and veins of liver and biliary system"},{"w":"The left gastro-omental artery is a branch of the splenic artery that runs along the greater curvature of the stomach inside the greater omentum.","i":"img/tb/v3_moore_264_1628.jpg","iw":1000,"ih":1247,"hl":[0.8372,0.8673,0.987,0.8835],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.39","c":"Omental bursa and stomach bed"},{"w":"The sympathetic trunk is the ganglion chain running down over the rib heads behind the costal pleura, linked to each intercostal nerve by rami communicantes.","i":"img/tb/v3_moore_276_1652.jpg","iw":1000,"ih":1075,"hl":[0.0238,0.06,0.2121,0.0852],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.51","c":"Innervation of small intestine"},{"w":"The thoracic duct ascends on the vertebral bodies behind the esophagus, between the azygos vein and the descending aorta, crossing left at T4\u2013T6 to the left venous angle.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.7054,0.1907,0.817,0.2168],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"Each phrenic nerve runs down the fibrous pericardium in front of the lung root; the right follows the superior vena cava, the left crosses the aortic arch.","i":"img/tb/v3_moore_140_1400.jpg","iw":1000,"ih":675,"hl":[0.7589,0.2367,0.8597,0.2646],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"Papillary muscles are cone-shaped muscle columns rising from the inner ventricular walls, their tips tied by chordae tendineae to the cusps of the atrioventricular valves.","i":"img/tb/v3_gray_223_199.jpg","iw":1000,"ih":749,"hl":[0.0142,0.5865,0.1619,0.6118],"a":"Gray's Anatomy for Students, Fig. 3.67","c":"Internal view of the left ventricle"},{"w":"The pectinate muscles are the parallel muscular ridges lining the inside of the right atrium's anterior wall and auricle, in front of the crista terminalis.","i":"img/tb/v3_moore_442_1973.jpg","iw":1000,"ih":476,"hl":[0.0372,0.612,0.9742,0.6544],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.59","c":"Transitions occurring at pectinate line"},{"w":"The aortic valve lies between the left ventricle and ascending aorta, behind the sternum at the third intercostal space, behind and right of the pulmonary valve.","i":"img/tb/v3_moore_170_1462.jpg","iw":1000,"ih":827,"hl":[0.805,0.6152,0.8925,0.6375],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.55","c":"Valves of heart and great vessels"},{"w":"The vagus nerve descends in the carotid sheath between the internal jugular vein and carotid artery, then passes behind the lung root to form the esophageal plexus.","i":"img/tb/v3_moore_179_1480.jpg","iw":1000,"ih":730,"hl":[0.8326,0.1466,0.9412,0.1774],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.63","c":"Cardiac nerves and plexus"},{"w":"Found only in the right lung, the horizontal fissure runs forward from the oblique fissure along the fourth rib, separating the superior and middle lobes.","i":"img/tb/v3_moore_141_1401.jpg","iw":1000,"ih":966,"hl":[0.0204,0.5887,0.1408,0.6519],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.34","c":"Mediastinal surfaces and hila of lungs"},{"w":"The ilioinguinal nerve (L1) runs across quadratus lumborum just below the iliohypogastric nerve, then through the inguinal canal beside the spermatic cord, exiting the superficial inguinal ring.","i":"img/tb/v3_gray_426_472.jpg","iw":1000,"ih":882,"hl":[0.0352,0.3316,0.1673,0.3536],"a":"Gray's Anatomy for Students, Fig. 4.161","c":"Lumbar plexus in the posterior abdominal region"},{"w":"The inferior epigastric artery leaves the external iliac above the inguinal ligament, climbs medial to the deep inguinal ring, and enters the rectus sheath at the arcuate line.","i":"img/tb/v3_moore_376_1869.jpg","iw":1000,"ih":589,"hl":[0.7156,0.1687,0.8345,0.1993],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.14","c":"Pelvic fascial ligaments"},{"w":"The jejunum is the first two-fifths of the small intestine, starting at the duodenojejunal flexure left of L2 and coiling mostly in the upper left abdomen.","i":"img/tb/v3_moore_274_1650.jpg","iw":1000,"ih":788,"hl":[0.8367,0.4161,0.911,0.4448],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.49","c":"Arterial supply and mesenteries of intestines"},{"w":"The ileum is the last three-fifths of the small bowel past the duodenum, coiled in the lower right abdomen and pelvis, ending at the cecum's medial side.","i":"img/tb/v3_moore_267_1632.jpg","iw":1000,"ih":1052,"hl":[0.1073,0.8008,0.1646,0.8267],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.42","c":"Lymphatic drainage and innervation of stomach and small intestine"},{"w":"The left renal vein crosses in front of the aorta just below the superior mesenteric artery to reach the inferior vena cava, receiving the left suprarenal and gonadal veins.","i":"img/tb/v3_gray_405_445.jpg","iw":1000,"ih":642,"hl":[0.6856,0.9053,0.7909,0.935],"a":"Gray's Anatomy for Students, Fig. 4.142","c":"Renal vasculature"},{"w":"The left gonadal vein climbs on the left psoas major in front of the ureter and drains at a right angle into the left renal vein.","i":"img/tb/v3_moore_344_1790.jpg","iw":1000,"ih":1040,"hl":[0.7098,0.4547,0.9071,0.5218],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.99","c":"Inferior vena cava and its tributaries"},{"w":"Each ureter runs from the renal pelvis down the front of psoas major behind the peritoneum, crossed anteriorly by the gonadal vessels, and enters the pelvis over the common iliac bifurcation.","i":"img/tb/v3_moore_319_1746.jpg","iw":1000,"ih":856,"hl":[0.817,0.7583,0.8647,0.7814],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.76","c":"Posterior abdominal wall showing great vessels, kidneys, and suprarenal glands"},{"w":"The hemiazygos vein climbs the left side of the lower thoracic vertebrae, then crosses right at T9 behind the aorta, esophagus and thoracic duct to join the azygos.","i":"img/tb/v3_moore_200_1515.jpg","iw":1000,"ih":1068,"hl":[0.6143,0.4613,0.8574,0.4943],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.74","c":"Azygos system of veins"},{"w":"The pulmonary veins, two from each lung, are the lowest and most anterior structures in each lung root, opening into the back of the left atrium.","i":"img/tb/v3_gray_202_165.jpg","iw":1000,"ih":845,"hl":[0.1338,0.6367,0.2708,0.6814],"a":"Gray's Anatomy for Students, Fig. 3.45","c":"Pulmonary vessels"},{"w":"The middle cardiac vein climbs in the posterior interventricular groove beside the posterior interventricular artery and drains into the right end of the coronary sinus.","i":"img/tb/v3_moore_177_1477.jpg","iw":1000,"ih":425,"hl":[0.8925,0.816,0.9794,0.9034],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.61","c":"Cardiac veins"},{"w":"The oblique fissure runs in each lung from about T2 behind to the 6th costal cartilage in front, with the inferior lobe behind and below it.","i":"img/tb/v3_gray_264_259.jpg","iw":1000,"ih":629,"hl":[0.8505,0.3567,0.9853,0.3878],"a":"Gray's Anatomy for Students, Fig. 3.103","c":"Views of the chest wall showing the surface projections of the lobes and the fissures of the lungs"},{"w":"The crista terminalis is the ridge inside the right atrium's lateral wall, running from superior to inferior vena cava, with pectinate muscles in front and smooth wall behind.","i":"img/tb/v3_moore_168_1458.jpg","iw":1000,"ih":635,"hl":[0.0137,0.6023,0.139,0.6338],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.53","c":"Right atrium of heart"},{"w":"Transversus thoracis lies on the inner surface of the front chest wall, fanning from the lower sternum and xiphoid to costal cartilages 2\u20136, behind the internal thoracic vessels.","i":"img/tb/v3_moore_118_1347.jpg","iw":1000,"ih":711,"hl":[0.0174,0.6013,0.1892,0.6313],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.13","c":"Dissection of anterior aspect of anterior thoracic wall"},{"w":"The left gastric artery is the smallest branch of the celiac trunk, climbing to the esophagogastric junction and then running down the lesser curvature inside the lesser omentum.","i":"img/tb/v3_moore_260_1619.jpg","iw":1000,"ih":815,"hl":[0.0916,0.9544,0.2223,0.9794],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.35","c":"Nerves and lymphatics of abdominal esophagus and stomach"},{"w":"The posterior intercostal arteries leave the back of the thoracic aorta at each level and run in the costal groove between the vein above and nerve below.","i":"img/tb/v3_moore_123_1359.jpg","iw":1000,"ih":1089,"hl":[0.0234,0.4205,0.1736,0.4859],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.19","c":"Arteries of thoracic wall"},{"w":"The gonadal arteries leave the aorta just below the renal arteries and run down on psoas over the ureter; the right one also crosses the inferior vena cava.","i":"img/tb/v3_moore_319_1746.jpg","iw":1000,"ih":856,"hl":[0.8486,0.7069,0.9624,0.7528],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.76","c":"Posterior abdominal wall showing great vessels, kidneys, and suprarenal glands"},{"w":"The brachiocephalic trunk rises from the arch behind the left brachiocephalic vein, right of the trachea, splitting behind the right sternoclavicular joint into right subclavian and common carotid.","i":"img/tb/v3_moore_192_1503.jpg","iw":872,"ih":945,"hl":[0.5094,0.1401,0.8608,0.1795],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.67","c":"Common pattern of branches of arch of aorta"},{"w":"The round ligament of the liver, the remnant of the left umbilical vein, runs from the umbilicus in the free lower edge of the falciform ligament to the liver.","i":"img/tb/v3_moore_250_1604.jpg","iw":1000,"ih":764,"hl":[0.0127,0.116,0.1311,0.1414],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.26","c":"Parts of greater and lesser omenta"},{"w":"The bare area is the peritoneum-free back of the right liver lobe, lying on the diaphragm inside the coronary ligament layers, with the inferior vena cava groove medially.","i":"img/tb/v3_moore_298_1702.jpg","iw":660,"ih":816,"hl":[0.223,0.2402,0.3442,0.3309],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.64","c":"Peritoneal and visceral relationships of liver"},{"w":"The coronary ligament is the peritoneal fold from the diaphragm onto the top and back of the liver, its two layers enclosing the bare area.","i":"img/tb/v3_moore_298_1703.jpg","iw":672,"ih":872,"hl":[0.7469,0.0885,0.9428,0.1725],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.64","c":"Peritoneal and visceral relationships of liver"},{"w":"The right lobe is the liver lying right of the falciform ligament and, underneath, right of the gallbladder and inferior vena cava, above the right kidney and colic flexure.","i":"img/tb/v3_moore_298_1699.jpg","iw":791,"ih":664,"hl":[0.0405,0.0905,0.117,0.146],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.64","c":"Peritoneal and visceral relationships of liver"},{"w":"The left lobe of the liver is the thinner part left of the falciform ligament, reaching into the left upper abdomen in front of the stomach.","i":"img/tb/v3_moore_298_1699.jpg","iw":791,"ih":664,"hl":[0.8141,0.3114,0.9696,0.3675],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.64","c":"Peritoneal and visceral relationships of liver"},{"w":"The ligamentum arteriosum is the fibrous cord from the left pulmonary artery to the underside of the aortic arch; the left recurrent laryngeal nerve hooks lateral to it.","i":"img/tb/v3_moore_193_1504.jpg","iw":1000,"ih":615,"hl":[0.6942,0.7664,0.8273,0.8559],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.68","c":"Great vessels and nerves"},{"w":"The chordae tendineae are thin cords in both ventricles running from the tips of the papillary muscles to the edges of the tricuspid and mitral valve cusps.","i":"img/tb/v3_gray_223_199.jpg","iw":1000,"ih":749,"hl":[0.0992,0.4284,0.2602,0.4537],"a":"Gray's Anatomy for Students, Fig. 3.67","c":"Internal view of the left ventricle"},{"w":"The trabeculae carneae are the rough muscular ridges lining the inner walls of both ventricles below the valves, coarse in the right ventricle and finer in the left.","i":"img/tb/v3_gray_220_192.jpg","iw":1000,"ih":773,"hl":[0.4491,0.9578,0.614,0.9818],"a":"Gray's Anatomy for Students, Fig. 3.64","c":"Internal view of the right ventricle"},{"w":"The left recurrent laryngeal nerve leaves the left vagus at the aortic arch, hooks under it lateral to the ligamentum arteriosum, and climbs between trachea and esophagus.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.7054,0.1266,0.9484,0.153],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"The left vagus nerve descends between the left common carotid and left subclavian arteries, crosses the aortic arch behind the left phrenic, and passes behind the left lung root.","i":"img/tb/v3_moore_148_1418.jpg","iw":1000,"ih":1213,"hl":[0.7827,0.0349,0.9236,0.0925],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.40","c":"Nerves of lungs and visceral pleura"},{"w":"The greater splanchnic nerve forms from T5\u2013T9 sympathetic ganglion branches, descends on the sides of the vertebral bodies, and pierces the diaphragmatic crus to reach the celiac ganglion.","i":"img/tb/v3_gray_423_467.jpg","iw":1000,"ih":903,"hl":[0.6741,0.6758,0.8619,0.6973],"a":"Gray's Anatomy for Students, Fig. 4.158","c":"Nerve fibers passing through the abdominal prevertebral plexus and ganglia"},{"w":"The splenic artery is the largest celiac trunk branch, winding left along the upper border of the pancreas behind the stomach to reach the splenic hilum through the splenorenal ligament.","i":"img/tb/v3_moore_296_1694.jpg","iw":829,"ih":750,"hl":[0.4024,0.2784,0.5164,0.3232],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.61","c":"Lymphatic drainage and innervation of pancreas and spleen"},{"w":"Each renal artery leaves the aorta just below the superior mesenteric artery; the right runs behind the inferior vena cava, the left behind the left renal vein.","i":"img/tb/v3_moore_325_1756.jpg","iw":932,"ih":1116,"hl":[0.0258,0.5482,0.1914,0.6138],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.84","c":"Arterial supply of kidneys and ureters"},{"w":"The right vagus nerve runs down the right side of the trachea, medial to the azygos arch, then passes behind the right lung root onto the esophagus.","i":"img/tb/v3_moore_260_1619.jpg","iw":1000,"ih":815,"hl":[0.7268,0.0797,0.8744,0.1047],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.35","c":"Nerves and lymphatics of abdominal esophagus and stomach"},{"w":"The accessory hemiazygos vein runs down the left side of the T5\u2013T8 vertebral bodies, draining upper left intercostal veins, then crosses behind the aorta to the azygos vein.","i":"img/tb/v3_gray_184_141.jpg","iw":1000,"ih":850,"hl":[0.776,0.2227,0.9866,0.2586],"a":"Gray's Anatomy for Students, Fig. 3.30","c":"Veins of the thoracic wall"},{"w":"The right gastro-omental artery is a terminal branch of the gastroduodenal artery that starts below the pylorus and runs left along the greater curvature inside the greater omentum.","i":"img/tb/v3_gray_373_408.jpg","iw":1000,"ih":797,"hl":[0.0528,0.4969,0.2634,0.5222],"a":"Gray's Anatomy for Students, Fig. 4.113","c":"Arterial supply to the pancreas"},{"w":"The third part of the duodenum crosses L3 from right to left, between the superior mesenteric vessels in front and the inferior vena cava and aorta behind.","i":"img/tb/v3_moore_328_1762.jpg","iw":562,"ih":701,"hl":[0.0555,0.6211,0.3246,0.7257],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"The superior rectal artery is the terminal continuation of the inferior mesenteric artery, crossing the left common iliac vessels in the sigmoid mesocolon root to reach the back of the rectum.","i":"img/tb/v3_moore_400_1903.jpg","iw":1000,"ih":842,"hl":[0.0211,0.0264,0.2825,0.0644],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.32","c":"Arteries and veins of rectum and anal canal"},{"w":"The right middle lobe is the small wedge between the horizontal fissure above and the oblique fissure below, lying in front against the right side of the heart.","i":"img/tb/v3_gray_264_258.jpg","iw":1000,"ih":601,"hl":[0.0971,0.4548,0.1914,0.4846],"a":"Gray's Anatomy for Students, Fig. 3.103","c":"Views of the chest wall showing the surface projections of the lobes and the fissures of the lungs"},{"w":"In axial sections the right lower lobe is the lung behind the oblique fissure, forming most of the back and base of the right lung beside the esophagus.","i":"img/tb/v3_moore_140_1400.jpg","iw":1000,"ih":675,"hl":[0.0521,0.7035,0.1384,0.7314],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"The right upper lobe forms the apex and upper front of the right lung, above the horizontal fissure and in front of the upper oblique fissure.","i":"img/tb/v3_moore_140_1400.jpg","iw":1000,"ih":675,"hl":[0.1147,0.2319,0.2121,0.2598],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"The lingula is the tongue-shaped lower front part of the left superior lobe, just below the cardiac notch and over the left side of the heart.","i":"img/tb/v3_moore_138_1395.jpg","iw":1000,"ih":742,"hl":[0.7685,0.686,0.9289,0.7434],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.31","c":"Relationship of thoracic contents and linings of thoracic cage"},{"w":"The posterior interventricular sulcus is the groove on the heart's underside between the ventricles, running from crux to apex with the posterior interventricular artery and middle cardiac vein.","i":"img/tb/v3_gray_214_186.jpg","iw":1000,"ih":810,"hl":[0.5099,0.9573,0.7591,0.9826],"a":"Gray's Anatomy for Students, Fig. 3.59","c":"Diaphragmatic surface of the heart"},{"w":"The cecum is the blind-ended pouch of large bowel in the right iliac fossa, hanging below the ileocecal junction, with the appendix attached to its posteromedial side.","i":"img/tb/v3_gray_347_366.jpg","iw":904,"ih":1036,"hl":[0.0359,0.6712,0.1475,0.7048],"a":"Gray's Anatomy for Students, Fig. 4.77","c":"Cecum and appendix"},{"w":"In axial sections serratus anterior is the muscle lying on the outer surface of the lateral ribs, passing back between ribs and scapula to the scapula's medial border.","i":"img/tb/v3_moore_118_1347.jpg","iw":1000,"ih":711,"hl":[0.8113,0.6218,0.8812,0.6814],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.13","c":"Dissection of anterior aspect of anterior thoracic wall"},{"w":"The external intercostal is the outermost muscle layer in each intercostal space, its fibres running down and forward from one rib to the rib below.","i":"img/tb/v3_moore_121_1354.jpg","iw":1000,"ih":985,"hl":[0.727,0.8477,0.9247,0.8751],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.17","c":"Dissection of posterior aspect of thoracic wall"},{"w":"The superior epigastric artery is the medial terminal branch of the internal thoracic artery, entering the rectus sheath below the 6th intercostal space and running down behind rectus abdominis.","i":"img/tb/v3_gray_182_140.jpg","iw":1000,"ih":918,"hl":[0.7247,0.7774,0.9137,0.8103],"a":"Gray's Anatomy for Students, Fig. 3.29","c":"Arteries of the thoracic wall"},{"w":"The musculophrenic artery is the lateral end branch of the internal thoracic artery, leaving it in the 6th intercostal space to run along the costal margin.","i":"img/tb/v3_moore_160_1444.jpg","iw":1000,"ih":1021,"hl":[0.0327,0.7805,0.2484,0.8152],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.47","c":"Arterial supply and venous drainage of pericardium"},{"w":"The fibrous pericardium is the tough sac around the heart in the middle mediastinum, fused below to the diaphragm's central tendon, with the phrenic nerves on its sides.","i":"img/tb/v3_moore_140_1400.jpg","iw":1000,"ih":675,"hl":[0.8213,0.5547,0.9658,0.5829],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"The cardiac notch is the deep scoop in the anterior border of the left lung's upper lobe where the heart pushes in, just above the lingula.","i":"img/tb/v3_moore_138_1395.jpg","iw":1000,"ih":742,"hl":[0.7685,0.401,0.8842,0.4303],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.31","c":"Relationship of thoracic contents and linings of thoracic cage"},{"w":"The hilum is the pleura-ringed area on the lung's medial surface where the main bronchus, pulmonary artery and pulmonary veins enter, with the pulmonary ligament hanging below it.","i":"img/tb/v3_moore_145_1414.jpg","iw":1000,"ih":648,"hl":[0.3887,0.0202,0.496,0.0513],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.37","c":"Pulmonary circulation"},{"w":"The innermost intercostal is the deepest intercostal layer, lying against the parietal pleura and separated from the internal intercostal by the intercostal vein, artery and nerve.","i":"img/tb/v3_moore_121_1354.jpg","iw":1000,"ih":985,"hl":[0.7278,0.7015,0.9436,0.729],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.17","c":"Dissection of posterior aspect of thoracic wall"},{"w":"Each intercostal nerve is a thoracic spinal nerve's front branch, running in the costal groove below its rib, between internal and innermost intercostals, beneath the vein and artery.","i":"img/tb/v3_gray_178_133.jpg","iw":1000,"ih":1134,"hl":[0.7022,0.8333,0.8339,0.8485],"a":"Gray's Anatomy for Students, Fig. 3.26","c":"Intercostal space"},{"w":"The pericardiacophrenic artery is a thin branch of the internal thoracic artery running with the phrenic nerve between the pericardium and mediastinal pleura, in front of the lung root.","i":"img/tb/v3_gray_209_178.jpg","iw":1000,"ih":801,"hl":[0.3366,0.8133,0.5367,0.8587],"a":"Gray's Anatomy for Students, Fig. 3.54","c":"Phrenic nerves and pericardiacophrenic vessels"},{"w":"The right auricle is the broad triangular pouch off the upper front of the right atrium, overlapping the ascending aorta's root, with the right coronary artery emerging below it.","i":"img/tb/v3_gray_220_192.jpg","iw":1000,"ih":773,"hl":[0.1438,0.347,0.2438,0.3734],"a":"Gray's Anatomy for Students, Fig. 3.64","c":"Internal view of the right ventricle"},{"w":"The left auricle is the small hooked pouch of the left atrium curling around the left side of the pulmonary trunk, with the left coronary artery emerging beneath it.","i":"img/tb/v3_moore_171_1463.jpg","iw":1000,"ih":816,"hl":[0.0166,0.3663,0.118,0.3958],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.56","c":"Interior of left atrium and ventricle of heart"},{"w":"The right recurrent laryngeal nerve leaves the right vagus in front of the right subclavian artery, hooks under that artery and climbs in the groove between trachea and esophagus.","i":"img/tb/v3_gray_1046_1141.jpg","iw":891,"ih":1170,"hl":[0.7403,0.7092,0.973,0.7687],"a":"Gray's Anatomy for Students, Fig. 8.176","c":"Superior and inferior thyroid arteries and left and right recurrent laryngeal nerves: posterior view"},{"w":"The great cardiac vein climbs the anterior interventricular groove beside the anterior interventricular artery, then turns left in the coronary groove to become the coronary sinus.","i":"img/tb/v3_gray_232_215.jpg","iw":1000,"ih":754,"hl":[0.7525,0.6965,0.985,0.7253],"a":"Gray's Anatomy for Students, Fig. 3.75","c":"Major cardiac veins"},{"w":"The small cardiac vein runs with the right marginal artery along the heart's inferior border, then back in the right coronary groove to end in the coronary sinus.","i":"img/tb/v3_moore_177_1477.jpg","iw":1000,"ih":425,"hl":[0.0122,0.691,0.0646,0.8222],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.61","c":"Cardiac veins"},{"w":"The anterior cardiac veins are small veins on the front of the right ventricle that cross the right coronary artery and open directly into the right atrium.","i":"img/tb/v3_moore_177_1477.jpg","iw":1000,"ih":425,"hl":[0.0124,0.284,0.0741,0.4147],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.61","c":"Cardiac veins"},{"w":"The left coronary artery leaves the left aortic sinus and runs between the pulmonary trunk and the left auricle before splitting into the anterior interventricular and circumflex arteries.","i":"img/tb/v3_moore_175_1470.jpg","iw":1000,"ih":818,"hl":[0.0179,0.3139,0.1572,0.3474],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.59","c":"Coronary arteries"},{"w":"The right marginal artery is a branch of the right coronary artery that runs along the inferior (acute) border of the heart toward the apex, with the small cardiac vein.","i":"img/tb/v3_moore_176_1473.jpg","iw":823,"ih":497,"hl":[0.0346,0.8048,0.1835,0.879],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.60","c":"Variations in distribution of coronary arteries"},{"w":"The circumflex artery leaves the left coronary artery and runs left under the left auricle in the coronary groove, beside the great cardiac vein, onto the heart's back.","i":"img/tb/v3_moore_184_1490.jpg","iw":996,"ih":896,"hl":[0.7652,0.4247,0.9168,0.4658],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"The left marginal artery is a branch of the circumflex artery that runs down the left (obtuse) border of the heart over the left ventricle toward the apex.","i":"img/tb/v3_moore_175_1469.jpg","iw":1000,"ih":812,"hl":[0.778,0.6611,0.9226,0.697],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.59","c":"Coronary arteries"},{"w":"The sinoatrial nodal artery leaves the first part of the right coronary artery (the circumflex in about 40%) and climbs the right atrium toward the superior vena cava opening.","i":"img/tb/v3_moore_187_1496.jpg","iw":947,"ih":890,"hl":[0.2635,0.0279,0.4006,0.1097],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"The opening of the coronary sinus lies in the right atrium between the inferior vena cava opening and the tricuspid orifice, guarded by a thin valve fold.","i":"img/tb/v3_moore_168_1458.jpg","iw":1000,"ih":635,"hl":[0.7832,0.4856,0.9869,0.5172],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.53","c":"Right atrium of heart"},{"w":"The tricuspid valve guards the opening from the right atrium into the right ventricle, its three cusps tied by chordae tendineae to papillary muscles, behind the lower sternal body.","i":"img/tb/v3_moore_169_1459.jpg","iw":1000,"ih":637,"hl":[0.0155,0.9096,0.1496,0.9425],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.54","c":"Interior of right ventricle of heart"},{"w":"The mitral valve is the two-cusp valve between the left atrium and left ventricle, tied by chordae tendineae to two papillary muscles, its anterior cusp beside the aortic opening.","i":"img/tb/v3_moore_170_1462.jpg","iw":1000,"ih":827,"hl":[0.7759,0.9476,0.9129,0.9697],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.55","c":"Valves of heart and great vessels"},{"w":"The pulmonary valve is the three-cusp semilunar valve at the top of the right ventricle's outflow tract, in front of, above and left of the aortic valve.","i":"img/tb/v3_moore_170_1462.jpg","iw":1000,"ih":827,"hl":[0.7998,0.5394,0.8796,0.5825],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.55","c":"Valves of heart and great vessels"},{"w":"The thymus lies in the front of the superior mediastinum, behind the manubrium and in front of the left brachiocephalic vein and aortic arch; in adults it is mostly fat.","i":"img/tb/v3_moore_191_1501.jpg","iw":1000,"ih":749,"hl":[0.1094,0.6195,0.1812,0.6492],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.66","c":"Dissections of superior mediastinum"},{"w":"The left subclavian artery is the last, most posterior branch of the aortic arch, rising behind the left common carotid and arching over the left lung apex.","i":"img/tb/v3_moore_1032_2524.jpg","iw":1000,"ih":699,"hl":[0.8685,0.757,0.9708,0.7825],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.19","c":"Subclavian and carotid arteries and their branches"},{"w":"The tracheobronchial lymph nodes cluster around the tracheal bifurcation, in the angles between the trachea and each main bronchus and below the carina.","i":"img/tb/v3_moore_190_1499.jpg","iw":1000,"ih":835,"hl":[0.0171,0.3696,0.1899,0.4305],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.65","c":"Relationships of structures in superior mediastinum"},{"w":"The anterior vagal trunk forms from the esophageal plexus on the front of the esophagus at the esophageal hiatus and branches over the front of the stomach.","i":"img/tb/v3_moore_148_1418.jpg","iw":1000,"ih":1213,"hl":[0.7941,0.6768,0.9011,0.7627],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.40","c":"Nerves of lungs and visceral pleura"},{"w":"The posterior vagal trunk lies on the back of the esophagus at the esophageal hiatus, carrying mostly right vagus fibres to the posterior stomach and celiac plexus.","i":"img/tb/v3_moore_276_1652.jpg","iw":1000,"ih":1075,"hl":[0.464,0.5797,0.5581,0.6544],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.51","c":"Innervation of small intestine"},{"w":"Each posterior intercostal vein runs highest in the costal groove, above its artery and nerve, draining into the azygos vein on the right or hemiazygos veins on the left.","i":"img/tb/v3_moore_125_1361.jpg","iw":1000,"ih":1173,"hl":[0.0273,0.4315,0.205,0.4629],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.20","c":"Veins of thoracic wall"},{"w":"The lesser splanchnic nerve leaves the T10 and T11 sympathetic ganglia, descends lateral to the greater splanchnic nerve, and pierces the diaphragmatic crus to reach the aorticorenal ganglion.","i":"img/tb/v3_gray_396_432.jpg","iw":1000,"ih":663,"hl":[0.8024,0.6316,0.9837,0.6609],"a":"Gray's Anatomy for Students, Fig. 4.132","c":"Diaphragm"},{"w":"The least splanchnic nerve is a small branch of the T12 sympathetic ganglion, below the lesser splanchnic nerve, that ends in the renal plexus.","i":"img/tb/v3_gray_396_432.jpg","iw":1000,"ih":663,"hl":[0.7825,0.7205,0.9536,0.7498],"a":"Gray's Anatomy for Students, Fig. 4.132","c":"Diaphragm"},{"w":"In axial sections the external oblique is the outermost flat muscle of the lateral abdominal wall, superficial to internal oblique and transversus abdominis.","i":"img/tb/v3_moore_220_1563.jpg","iw":1000,"ih":776,"hl":[0.0139,0.1604,0.1466,0.1879],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.8","c":"Inferior abdominal wall and inguinal region of a male"},{"w":"In axial sections transversus abdominis is the innermost of the three flat lateral muscles, deep to internal oblique and just outside the transversalis fascia and peritoneum.","i":"img/tb/v3_gray_312_317.jpg","iw":1000,"ih":761,"hl":[0.0489,0.4738,0.2249,0.4994],"a":"Gray's Anatomy for Students, Fig. 4.31","c":"Transversus abdominis muscle and its aponeurosis"},{"w":"Rectus abdominis is the paired vertical strap muscle on each side of the linea alba, running from the pubis to the xiphoid and lower costal cartilages.","i":"img/tb/v3_moore_219_1561.jpg","iw":1000,"ih":813,"hl":[0.7759,0.3054,0.9023,0.3281],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.7","c":"Anterolateral abdominal wall"},{"w":"Pyramidalis is a small triangular muscle in front of the lowest part of rectus abdominis inside the rectus sheath, running from the pubis up to the linea alba.","i":"img/tb/v3_moore_219_1561.jpg","iw":1000,"ih":813,"hl":[0.7759,0.3054,0.9023,0.3281],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.7","c":"Anterolateral abdominal wall"},{"w":"The inguinal ligament is the rolled lower edge of the external oblique aponeurosis, running from the anterior superior iliac spine to the pubic tubercle over the femoral vessels.","i":"img/tb/v3_moore_231_1574.jpg","iw":1000,"ih":454,"hl":[0.0571,0.2977,0.1809,0.3397],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.14","c":"Formations of inguinal region"},{"w":"The tendinous intersections are three horizontal fibrous bands across rectus abdominis, at the umbilicus, near the xiphoid and midway between, fused to the anterior rectus sheath.","i":"img/tb/v3_moore_219_1561.jpg","iw":1000,"ih":813,"hl":[0.7745,0.4872,0.9344,0.5097],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.7","c":"Anterolateral abdominal wall"},{"w":"The arcuate line is the curved lower edge of the posterior rectus sheath, a third of the way from umbilicus to pubic crest, where inferior epigastric vessels enter.","i":"img/tb/v3_moore_221_1564.jpg","iw":1000,"ih":1010,"hl":[0.684,0.7094,0.796,0.7335],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.9","c":"Formation of rectus sheath and neurovascular structures of anterolateral abdominal wall"},{"w":"The linea alba is the midline fibrous seam between the two rectus abdominis muscles, running from the xiphoid process to the pubic symphysis and containing the umbilicus.","i":"img/tb/v3_moore_220_1563.jpg","iw":1000,"ih":776,"hl":[0.7212,0.2375,0.8066,0.2652],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.8","c":"Inferior abdominal wall and inguinal region of a male"},{"w":"The parietal peritoneum is the shiny membrane lining the inside of the abdominal walls and the underside of the diaphragm, separated from the transversalis fascia by extraperitoneal fat.","i":"img/tb/v3_moore_249_1601.jpg","iw":1000,"ih":1119,"hl":[0.0247,0.6967,0.3012,0.7295],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.25","c":"Principal formations of peritoneum"},{"w":"The greater omentum is the fatty apron hanging from the greater curvature of the stomach, draping in front of the small intestine and attaching to the transverse colon.","i":"img/tb/v3_gray_334_343.jpg","iw":885,"ih":1612,"hl":[0.41,0.9653,0.6948,0.9851],"a":"Gray's Anatomy for Students, Fig. 4.56","c":"Greater omentum"},{"w":"The ascending colon runs up the right flank from the cecum to the right colic flexure under the liver, with the right paracolic gutter lateral to it.","i":"img/tb/v3_gray_349_371.jpg","iw":890,"ih":2126,"hl":[0.0477,0.5593,0.2996,0.5756],"a":"Gray's Anatomy for Students, Fig. 4.82","c":"Colon"},{"w":"The descending colon runs down the left flank from the left colic flexure by the spleen to the iliac fossa, in front of the left kidney's lateral edge.","i":"img/tb/v3_moore_277_1657.jpg","iw":1000,"ih":878,"hl":[0.8761,0.3522,0.9855,0.403],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.52","c":"Terminal ileum and large intestine (including appendix)"},{"w":"The sigmoid colon is the S-shaped loop from the end of the descending colon in the left iliac fossa to the rectum at S3, hanging free on the sigmoid mesocolon.","i":"img/tb/v3_moore_399_1901.jpg","iw":1000,"ih":717,"hl":[0.9055,0.2105,0.9667,0.2377],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.31","c":"Sigmoid colon entering lesser pelvis and becoming rectum"},{"w":"The rectum continues the sigmoid colon from about S3 and follows the curve of the sacrum and coccyx down through the pelvis, with no teniae, haustra or mesentery.","i":"img/tb/v3_moore_277_1657.jpg","iw":1000,"ih":878,"hl":[0.623,0.7447,0.6895,0.77],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.52","c":"Terminal ileum and large intestine (including appendix)"},{"w":"The appendix is a narrow blind tube arising from the posteromedial wall of the cecum below the ileocecal junction, where the three teniae coli meet, hung on the mesoappendix.","i":"img/tb/v3_moore_278_1658.jpg","iw":1000,"ih":512,"hl":[0.3265,0.6294,0.3982,0.6679],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.53","c":"Terminal ileum, cecum, and appendix"},{"w":"The lesser omentum is the double peritoneal sheet from the stomach's lesser curvature and first part of the duodenum to the liver, with a thick free right edge.","i":"img/tb/v3_gray_335_344.jpg","iw":1000,"ih":921,"hl":[0.6973,0.0631,0.8376,0.0866],"a":"Gray's Anatomy for Students, Fig. 4.57","c":"Lesser omentum"},{"w":"The left triangular ligament is a thin peritoneal fold tying the left tip of the left liver lobe to the diaphragm, where the coronary ligament's layers meet.","i":"img/tb/v3_gray_358_385.jpg","iw":1000,"ih":616,"hl":[0.0145,0.178,0.2169,0.2094],"a":"Gray's Anatomy for Students, Fig. 4.96","c":"Posterior view of the bare area of the liver and associated ligaments"},{"w":"The bile duct runs in the lesser omentum's free edge, right of the hepatic artery and anterior to the portal vein, then behind the duodenum and pancreatic head.","i":"img/tb/v3_gray_364_394.jpg","iw":1000,"ih":622,"hl":[0.0298,0.4737,0.0949,0.5041],"a":"Gray's Anatomy for Students, Fig. 4.102","c":"Bile drainage"},{"w":"The celiac trunk is the first unpaired front branch of the abdominal aorta at T12, just above the pancreas, splitting into left gastric, splenic and common hepatic arteries.","i":"img/tb/v3_moore_324_1755.jpg","iw":1000,"ih":825,"hl":[0.0149,0.1457,0.1153,0.1724],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.83","c":"Blood vessels of suprarenal glands, kidneys, and superior parts of ureters"},{"w":"The right hepatic artery is the right terminal branch of the proper hepatic artery, passing behind the common hepatic duct and giving off the cystic artery in the cystohepatic triangle.","i":"img/tb/v3_gray_374_409.jpg","iw":1000,"ih":880,"hl":[0.3983,0.0186,0.5774,0.0453],"a":"Gray's Anatomy for Students, Fig. 4.114","c":"Distribution of the common hepatic artery"},{"w":"The left hepatic artery is the left end branch of the proper hepatic artery, running to the left side of the porta hepatis to supply the left liver.","i":"img/tb/v3_gray_374_409.jpg","iw":1000,"ih":880,"hl":[0.6891,0.1241,0.8545,0.1511],"a":"Gray's Anatomy for Students, Fig. 4.114","c":"Distribution of the common hepatic artery"},{"w":"The cystic artery usually arises from the right hepatic artery in the cystohepatic triangle, between cystic duct, common hepatic duct and liver, and runs to the gallbladder.","i":"img/tb/v3_moore_307_1719.jpg","iw":1000,"ih":619,"hl":[0.1228,0.5778,0.2184,0.6102],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.72","c":"Nerves and veins of liver and biliary system"},{"w":"The right gastric artery, a branch of the proper hepatic artery, runs left along the lesser curvature from the pylorus in the lesser omentum to join the left gastric artery.","i":"img/tb/v3_gray_373_408.jpg","iw":1000,"ih":797,"hl":[0.2245,0.1601,0.3716,0.1854],"a":"Gray's Anatomy for Students, Fig. 4.113","c":"Arterial supply to the pancreas"},{"w":"The hepatic lymph nodes lie along the hepatic arteries and bile duct in the lesser omentum and at the porta hepatis, draining onward to the celiac nodes.","i":"img/tb/v3_m
