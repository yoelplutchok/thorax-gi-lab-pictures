<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thorax &amp; GI Lab Pictures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one study column; sticky control bar; region sections split into picture-type parts.
   Occlusion boxes look like strips of amber lab tape laid over the labels. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5b6875;
  --line: #d3d9df;
  --accent: #1d5b86;
  --accent-ink: #ffffff;
  --tape: #f0a637;
  --tape-2: #e4952a;
  --tape-edge: #b86e0e;
  --chip: #e2e7ec;
  --note: #fff6e6;
  --note-line: #efd3a2;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151a; --surface: #172029; --ink: #e5eaee; --muted: #94a2ae; --line: #2a3541;
    --accent: #6eaedb; --accent-ink: #0d1217; --tape: #dc9a33; --tape-2: #cc8b27; --tape-edge: #f2b55a;
    --chip: #202b36; --note: #2a2316; --note-line: #5a4626; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151a; --surface: #172029; --ink: #e5eaee; --muted: #94a2ae; --line: #2a3541;
  --accent: #6eaedb; --accent-ink: #0d1217; --tape: #dc9a33; --tape-2: #cc8b27; --tape-edge: #f2b55a;
  --chip: #202b36; --note: #2a2316; --note-line: #5a4626; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { font: 700 1.3rem/1.1 var(--f-display); letter-spacing: .01em; margin-right: auto; }
.brand small { display: block; font: 500 .8rem/1.3 var(--f-body); color: var(--muted); letter-spacing: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hy { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.hy select, .hy input { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 6px; }
.hy input { width: 5.2em; font-variant-numeric: tabular-nums; }
.types { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.types .lbl { font-weight: 600; margin-right: 4px; }
.types button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .85rem; font-weight: 600; }
.types button:hover { border-color: var(--accent); }
.types button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.types button .c { font-weight: 500; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
.toc { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.toc a { flex: none; text-decoration: none; color: var(--ink); background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: .85rem; white-space: nowrap; }
.toc a:hover { background: var(--accent); color: var(--accent-ink); }
.toc a .c { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.toc a:hover .c { color: inherit; }
.toc a.empty { opacity: .45; }

main { max-width: 1180px; margin: 0 auto; padding-block: 18px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 34px; }
section.region { display: grid; gap: 18px; scroll-margin-top: 176px; }
h2 { font: 700 1.75rem/1.15 var(--f-display); margin: 0; text-wrap: balance; border-bottom: 3px solid var(--ink); padding-bottom: 6px; display: flex; align-items: baseline; gap: 10px; }
h2 .c, h3 .c { font: 500 .9rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.part { display: grid; gap: 14px; }
h3 { font: 600 1.05rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 0; color: var(--accent); display: flex; align-items: baseline; gap: 8px; }

figure.pic { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cap { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; font-size: .9rem; border-bottom: 1px solid var(--line); }
.cap .src { font-weight: 600; min-width: 0; }
.cap .rank { font: 600 .78rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cap .shown { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stage { position: relative; width: 100%; max-width: 100%; margin: 0 auto; background: var(--surface); }
.stage img { display: block; width: 100%; height: auto; }
.occ { position: absolute; padding: 0; border: 1px solid var(--tape-edge); border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--tape) 0 9px, var(--tape-2) 9px 18px);
  box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: background-color .12s, opacity .12s; }
.occ:hover { filter: brightness(1.07); }
.occ.open { background: transparent; box-shadow: none; border: 2px dashed var(--tape); }
.occ.open:hover { background: rgba(240,166,55,.12); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.actions .btn { padding: 5px 12px; }
.note { margin: 0; padding: 8px 12px; background: var(--note); border-top: 1px solid var(--note-line); font-size: .88rem; max-width: none; }
.note b { font-weight: 600; }
.hidden-count { color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .occ { transition: none; } }
@media (max-width: 560px) { .brand { font-size: 1.1rem; } h2 { font-size: 1.4rem; } }
</style>
</head>

<header class="bar">
  <div class="bar-in">
    <div class="row1">
      <div class="brand">Thorax &amp; GI lab pictures<small id="summary"></small></div>

      <label class="hy" for="topN">Show

          <option value="75">top 75 high-yield</option>
          <option value="100">top 100 high-yield</option>
          <option value="custom">top N high-yield…</option>
        </select>
        <input id="topCustom" type="number" min="1" step="1" inputmode="numeric" aria-label="Number of high-yield pictures" hidden>
      </label>
    </div>
    <div class="types" id="types" role="group" aria-label="Picture types"><span class="lbl">Type</span></div>
    <nav class="toc" id="toc" aria-label="Regions"></nav>
  </div>
</header>

const MEDIA = Object.fromEntries(DATA.media);
const ORDER_M = DATA.media.map(m => m[0]);
const main = document.getElementById('main');
const toc = document.getElementById('toc');
const figs = [];

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function updateShown(fig) {
  const boxes = fig.querySelectorAll('.occ');
  const open = fig.querySelectorAll('.occ.open').length;
  fig.querySelector('.shown').textContent = open + ' of ' + boxes.length + ' shown';
}
function setAll(scope, open) {
  scope.querySelectorAll('.occ').forEach(b => { b.classList.toggle('open', open); b.setAttribute('aria-pressed', open); });
  (scope.matches && scope.matches('figure.pic') ? [scope] : scope.querySelectorAll('figure.pic')).forEach(updateShown);
}

function build() {
  for (const [rid, rname] of DATA.regions) {
    const inR = DATA.pics.filter(p => p.r === rid);
    if (!inR.length) continue;
    const sec = el('section', 'region'); sec.id = rid; sec.dataset.name = rname;
    const h2 = el('h2', null, rname); const hc = el('span', 'c'); h2.append(hc); sec.append(h2);
    for (const mid of ORDER_M) {
      const inP = inR.filter(p => p.m === mid).sort((a, b) => a.o - b.o);
      if (!inP.length) continue;
      const part = el('div', 'part');
      const h3 = el('h3', null, MEDIA[mid]); const pc = el('span', 'c'); h3.append(pc); part.append(h3);
      for (const p of inP) {
        const fig = el('figure', 'pic'); fig.id = 'p-' + p.id; fig.dataset.rank = p.k; fig.dataset.m = p.m;
        const cap = el('figcaption', 'cap');
        cap.append(el('span', 'rank', 'HY #' + p.k), el('span', 'src', p.t), el('span', 'shown'));
        const stage = el('div', 'stage'); stage.style.aspectRatio = p.w + ' / ' + p.h;
        stage.style.maxWidth = 'min(100%, calc(' + (p.w / p.h).toFixed(4) + ' * (100vh - 225px)))';
        const img = el('img'); img.src = p.f; img.loading = 'lazy'; img.decoding = 'async'; img.width = p.w; img.height = p.h; img.alt = p.t;
        stage.append(img);
        p.b.forEach((b, i) => {
          const o = el('button', 'occ'); o.type = 'button';
          o.style.left = (b[0] * 100) + '%'; o.style.top = (b[1] * 100) + '%';
          o.style.width = ((b[2] - b[0]) * 100) + '%'; o.style.height = ((b[3] - b[1]) * 100) + '%';
          o.setAttribute('aria-label', 'Label ' + (i + 1)); o.setAttribute('aria-pressed', 'false');
          stage.append(o);
        });
        const act = el('div', 'actions');
        const hb = el('button', 'btn', 'Hide labels'); hb.type = 'button'; hb.dataset.act = 'hide';
        const sb = el('button', 'btn', 'Show labels'); sb.type = 'button'; sb.dataset.act = 'show';
        act.append(hb, sb);
        fig.append(cap, stage, act);
        for (const n of p.n) { const no = el('p', 'note'); const bb = el('b', null, 'Note: '); no.append(bb, document.createTextNode(n)); fig.append(no); }
        part.append(fig); figs.push(fig);
        updateShown(fig);
      }
      sec.append(part);
    }
    main.append(sec);
  }
}

main.addEventListener('click', e => {
  const o = e.target.closest('.occ');
  if (o) { const open = !o.classList.contains('open'); o.classList.toggle('open', open); o.setAttribute('aria-pressed', open); updateShown(o.closest('figure')); return; }
  const a = e.target.closest('[data-act]');
  if (a) setAll(a.closest('figure.pic'), a.dataset.act === 'show');
});
document.getElementById('revealAll').addEventListener('click', () => setAll(main, true));
document.getElementById('hideAll').addEventListener('click', () => setAll(main, false));

const sel = document.getElementById('topN'), custom = document.getElementById('topCustom');
const typesEl = document.getElementById('types');
let selTypes = new Set();            // empty = every type
const typeBtns = {};
function typeButton(id, name, count) {
  const b = el('button', null, name); b.type = 'button'; b.dataset.type = id;
  b.append(el('span', 'c', count)); typesEl.append(b); typeBtns[id] = b; return b;
}
function paintTypes() {
  typeBtns.all.setAttribute('aria-pressed', selTypes.size === 0);
  ORDER_M.forEach(m => { if (typeBtns[m]) typeBtns[m].setAttribute('aria-pressed', selTypes.has(m)); });
}
typesEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.type;
  if (t === 'all') selTypes.clear();
  else { selTypes.has(t) ? selTypes.delete(t) : selTypes.add(t); if (selTypes.size === Object.keys(typeBtns).length - 1) selTypes.clear(); }
  applyFilter();
});
function applyFilter() {
  let n = Infinity;
  if (sel.value === 'custom') { custom.hidden = false; const v = parseInt(custom.value, 10); n = v > 0 ? v : Infinity; }
  else { custom.hidden = true; if (sel.value !== 'all') n = +sel.value; }
  // top-N counts only the chosen picture types
  const ok = figs.filter(f => !selTypes.size || selTypes.has(f.dataset.m)).sort((a, b) => a.dataset.rank - b.dataset.rank);
  const keep = new Set(ok.slice(0, n === Infinity ? ok.length : n));
  figs.forEach(f => { f.hidden = !keep.has(f); });
  paintTypes();
  toc.textContent = '';
  let shownTot = 0, boxTot = 0;
  document.querySelectorAll('section.region').forEach(sec => {
    let secN = 0;
    sec.querySelectorAll('.part').forEach(part => {
      const k = part.querySelectorAll('figure.pic:not([hidden])').length;
      part.hidden = !k; part.querySelector('h3 .c').textContent = k + (k === 1 ? ' picture' : ' pictures'); secN += k;
    });
    sec.hidden = !secN;
    sec.querySelector('h2 .c').textContent = secN + (secN === 1 ? ' picture' : ' pictures');
    const a = el('a'); a.href = '#' + sec.id; a.textContent = sec.dataset.name; const c = el('span', 'c', secN); a.append(c);
    if (!secN) a.classList.add('empty');
    a.addEventListener('click', ev => { ev.preventDefault(); if (!sec.hidden) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    toc.append(a);
    shownTot += secN;
    sec.querySelectorAll('figure.pic:not([hidden]) .occ').forEach(() => boxTot++);
  });
  document.getElementById('summary').textContent = shownTot + ' of ' + figs.length + ' pictures \u00b7 ' + boxTot + ' labels';
  try { localStorage.setItem('labocc-top', JSON.stringify({ s: sel.value, c: custom.value, t: [...selTypes] })); } catch (e) {}
}
sel.addEventListener('change', () => { if (sel.value === 'custom' && !custom.value) custom.value = 30; applyFilter(); if (sel.value === 'custom') custom.focus(); });
custom.addEventListener('input', applyFilter);
custom.max = DATA.pics.length;

build();
typeButton('all', 'All types', DATA.pics.length);
ORDER_M.forEach(m => { const k = DATA.pics.filter(p => p.m === m).length; if (k) typeButton(m, MEDIA[m], k); });
try { const s = JSON.parse(localStorage.getItem('labocc-top') || 'null'); if (s) { sel.value = s.s; custom.value = s.c || ''; selTypes = new Set((s.t || []).filter(t => typeBtns[t])); } } catch (e) {}
applyFilter();
</script>

</body>
</html>
