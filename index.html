 sheet continuing the muscle medially, passing in front of rectus abdominis to the linea alba.","i":"img/tb/v3_moore_220_1563.jpg","iw":1000,"ih":776,"hl":[0.0146,0.5069,0.1454,0.5612],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.8","c":"Inferior abdominal wall and inguinal region of a male"},{"w":"Two labels: transversus abdominis is the deepest flat abdominal wall muscle, under internal oblique, and partly arises from the iliac crest, the curved upper rim of the ilium.","i":"img/tb/v3_gray_312_317.jpg","iw":1000,"ih":761,"hl":[0.0489,0.4738,0.2249,0.4994],"a":"Gray's Anatomy for Students, Fig. 4.31","c":"Transversus abdominis muscle and its aponeurosis"},{"w":"In low abdominal sections the ilium is the curved bony wing on each side, lateral to psoas, lined inside by iliacus and outside by the gluteal muscles.","i":"img/tb/v3_moore_361_1833.jpg","iw":1000,"ih":774,"hl":[0.0236,0.2133,0.0899,0.2602],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.4","c":"Joints of pelvic girdle"},{"w":"The right sacroiliac joint is where the ear-shaped surface of the sacrum meets the right ilium, at the back of the pelvis behind the internal iliac vessels.","i":"img/tb/v3_moore_361_1833.jpg","iw":1000,"ih":774,"hl":[0.0236,0.3009,0.2534,0.3498],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.4","c":"Joints of pelvic girdle"},{"w":"The gluteal muscles (maximus, medius, minimus) form the buttock behind and beside the iliac wing and hip joint, with gluteus maximus the most superficial and minimus the deepest.","i":"img/tb/v3_moore_513_2151.jpg","iw":1000,"ih":1147,"hl":[0.771,0.8402,0.8922,0.8577],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.29","c":"Super\ufb01 cial and intermediate layers of intrinsic back muscles: splenius and erector spinae"},{"w":"Sternohyoid is the strap muscle running from the back of the manubrium and medial clavicle up to the hyoid, lying superficial to sternothyroid in front of the thyroid gland.","i":"img/tb/v3_moore_118_1348.jpg","iw":1000,"ih":761,"hl":[0.0153,0.1638,0.1245,0.195],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.14","c":"Posterior aspect of anterior thoracic wall"},{"w":"Sternothyroid runs from the back of the manubrium up to the thyroid cartilage, lying deep to sternohyoid and directly on the thyroid gland and trachea.","i":"img/tb/v3_moore_1048_2543.jpg","iw":1000,"ih":1210,"hl":[0.5152,0.4389,0.6142,0.4541],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.26","c":"Relationships of thyroid gland"},{"w":"In axial sections the scapula is the flat triangular bone on the back of the chest wall over ribs 2\u20137, with subscapularis in front and infraspinatus behind.","i":"img/tb/v3_moore_731_2253.jpg","iw":1000,"ih":355,"hl":[0.6408,0.7719,0.6983,0.8242],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.25","c":"Movements of scapula and muscles producing them"},{"w":"In axial sections of the shoulder and arm the humerus is the round central bone, its head sitting against the glenoid cavity, wrapped by the rotator cuff and deltoid.","i":"img/tb/v3_moore_706_2199.jpg","iw":1000,"ih":696,"hl":[0.3313,0.3416,0.4351,0.3815],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.7","c":"Bones of right elbow region"},{"w":"Infraspinatus fills the infraspinous fossa on the back of the scapula below the spine, deep to deltoid and trapezius, and inserts on the greater tubercle of the humerus.","i":"img/tb/v3_moore_827_2437.jpg","iw":1000,"ih":575,"hl":[0.1195,0.2694,0.2153,0.3028],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.94","c":"Rotator cuff and glenohumeral joint"},{"w":"Rhomboid major runs from the T2\u2013T5 spinous processes down and out to the medial border of the scapula below its spine, lying deep to trapezius.","i":"img/tb/v3_moore_512_2150.jpg","iw":1000,"ih":1104,"hl":[0.14,0.19,0.2865,0.2111],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.28","c":"Muscles of back"},{"w":"Subscapularis fills the subscapular fossa on the front of the scapula, between the scapula and serratus anterior, and inserts on the lesser tubercle of the humerus.","i":"img/tb/v3_moore_827_2437.jpg","iw":1000,"ih":575,"hl":[0.1195,0.9273,0.2245,0.9611],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.94","c":"Rotator cuff and glenohumeral joint"},{"w":"The deltoid caps the shoulder, running from the lateral clavicle, acromion and scapular spine to the deltoid tuberosity; in axial sections it wraps the outside of the humeral head.","i":"img/tb/v3_gray_740_713.jpg","iw":882,"ih":1812,"hl":[0.4512,0.9678,0.8942,0.9868],"a":"Gray's Anatomy for Students, Fig. 7.35","c":"Lateral view of trapezius and deltoid muscles"},{"w":"Trapezius is the flat superficial muscle of the upper back and neck, running from the occiput and C7\u2013T12 spinous processes to the lateral clavicle, acromion and scapular spine.","i":"img/tb/v3_gray_114_59.jpg","iw":1000,"ih":838,"hl":[0.0922,0.3167,0.2772,0.338],"a":"Gray's Anatomy for Students, Fig. 2.38","c":"Innervation and blood supply of trapezius"},{"w":"The right subclavian vein continues the axillary vein from the 1st rib, passes in front of anterior scalene behind the clavicle, and joins the internal jugular to form the right brachiocephalic vein.","i":"img/tb/v3_gray_238_221.jpg","iw":1000,"ih":758,"hl":[0.0147,0.2476,0.1896,0.2754],"a":"Gray's Anatomy for Students, Fig. 3.79","c":"Structures in the superior mediastinum"},{"w":"The left subclavian vein continues the axillary vein from the 1st rib, passes in front of anterior scalene behind the clavicle, and joins the internal jugular to form the left brachiocephalic vein.","i":"img/tb/v3_gray_238_221.jpg","iw":1000,"ih":758,"hl":[0.8222,0.2495,0.9853,0.2777],"a":"Gray's Anatomy for Students, Fig. 3.79","c":"Structures in the superior mediastinum"},{"w":"The left axillary vein runs on the medial side of the axillary artery from the lower border of teres major to the 1st rib, where it becomes the subclavian vein.","i":"img/tb/v3_moore_129_1367.jpg","iw":953,"ih":945,"hl":[0.0252,0.3249,0.155,0.36],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.23","c":"Vasculature of breast"},{"w":"The right axillary vein runs on the medial side of the axillary artery from the lower border of teres major to the 1st rib, where it becomes the subclavian vein.","i":"img/tb/v3_moore_761_2315.jpg","iw":1000,"ih":350,"hl":[0.8615,0.4336,0.9111,0.5348],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.47","c":"Muscles, neurovascular structures, and compartments of arm"},{"w":"The left axillary artery continues the subclavian artery past the outer border of the 1st rib, passes behind pectoralis minor, and becomes the brachial artery at the lower border of teres major.","i":"img/tb/v3_moore_123_1356.jpg","iw":1000,"ih":1066,"hl":[0.0227,0.1659,0.1459,0.1965],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.19","c":"Arteries of thoracic wall"},{"w":"The inferior thyroid veins drain the lower thyroid gland and run down in front of the trachea, behind sternothyroid, to empty into the brachiocephalic veins, mainly the left one.","i":"img/tb/v3_moore_1011_2490.jpg","iw":1000,"ih":648,"hl":[0.0116,0.8841,0.1425,0.9114],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.1","c":"Dissection of anterior neck"},{"w":"The right axillary artery continues the subclavian artery past the outer border of the 1st rib, passes behind pectoralis minor, and becomes the brachial artery at the lower border of teres major.","i":"img/tb/v3_moore_748_2295.jpg","iw":996,"ih":922,"hl":[0.0241,0.6383,0.2186,0.6782],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.41","c":"Veins of axilla"},{"w":"Trachealis is the smooth muscle band bridging the open back ends of the C-shaped tracheal cartilages, lying directly in front of the esophagus.","i":"img/tb/v3_moore_1060_2572.jpg","iw":749,"ih":1499,"hl":[0.3711,0.8406,0.7155,0.8655],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.41","c":"Median sections of head and neck"},{"w":"In this upper thoracic section the articular disc is the fibrocartilage disc inside the sternoclavicular joint, between the medial end of the clavicle and the manubrium's clavicular notch.","i":"img/tb/v3_moore_834_2456.jpg","iw":995,"ih":1725,"hl":[0.5465,0.964,0.7525,0.9861],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.104","c":"Radio-ulnar ligaments and interosseous arteries"},{"w":"The T4 transverse process sticks out sideways behind the 4th rib, whose tubercle joins its tip at the costotransverse joint, with erector spinae lying behind it.","i":"img/tb/v3_moore_106_1332.jpg","iw":1000,"ih":730,"hl":[0.513,0.1062,0.6192,0.169],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.4","c":"Thoracic vertebrae"},{"w":"Two labels: sternothyroid is the strap muscle on the trachea behind the manubrium, while pectoralis minor runs from ribs 3\u20135 to the coracoid process, deep to pectoralis major.","i":"img/tb/v3_moore_116_1345.jpg","iw":1000,"ih":547,"hl":[0.7853,0.4189,0.922,0.4568],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.11","c":"Axio-appendicular, neck, and anterolateral abdominal muscles overlying thoracic wall"},{"w":"In an axial section, T4 sits at the level of the sternal angle, with the end of the aortic arch, the arch of the azygos vein and the tracheal bifurcation just in front.","i":"img/tb/v3_gray_97_26.jpg","iw":1000,"ih":389,"hl":[0.8167,0.0333,0.9252,0.0816],"a":"Gray's Anatomy for Students, Fig. 2.20","c":", cont'd B. Atlas and axis"},{"w":"Fatty connective tissue is loose fat packing the gaps between organs, vessels and muscles; on a cross-section it shows as smooth, uniform tissue filling the spaces around them."},{"w":"In an axial section of the upper chest, the right 1st costal cartilage links the 1st rib to the side of the manubrium, just below the sternoclavicular joint.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The right 3rd rib curves from its head at the T2 and T3 vertebrae around the upper chest to its costal cartilage, which joins the sternal body just below the sternal angle.","i":"img/tb/v3_moore_102_1326.jpg","iw":1000,"ih":929,"hl":[0.1336,0.881,0.2592,0.9377],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"In an axial section through the aortic arch, its anterior (proximal) end is the front-right end continuing from the ascending aorta, behind the manubrium and just left of the superior vena cava.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.7981,0.4215,0.8889,0.4454],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"In an axial section at T4 the distal aortic arch lies on the left side of the vertebral body, left of the trachea and esophagus, becoming the descending aorta.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.7981,0.4215,0.8889,0.4454],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"In an axial section pectoralis minor is the thin muscle just deep to pectoralis major on the upper front ribs, crossing in front of the axillary vessels.","i":"img/tb/v3_moore_116_1345.jpg","iw":1000,"ih":547,"hl":[0.7853,0.4189,0.922,0.4568],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.11","c":"Axio-appendicular, neck, and anterolateral abdominal muscles overlying thoracic wall"},{"w":"In axial sections the aortic arch is the curved vessel running from behind the manubrium back and left along the left side of the trachea to the vertebral column.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.7981,0.4215,0.8889,0.4454],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"Lymph nodes are small oval masses along vessels; in thoracic sections they cluster around the trachea, carina and lung hila, and in the abdomen along the aorta and mesenteric vessels.","i":"img/tb/v3_moore_305_1716.jpg","iw":1000,"ih":701,"hl":[0.7259,0.0597,0.8803,0.0985],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.70","c":"Lymphatic drainage and innervation of liver"},{"w":"The left 2nd costal cartilage joins the sternum at the sternal angle, where the manubrium meets the body, level with the T4\u2013T5 disc.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The head of the 6th rib articulates with the T5 and T6 vertebral bodies and the disc between them, just in front of the T6 transverse process.","i":"img/tb/v3_moore_109_1337.jpg","iw":1000,"ih":540,"hl":[0.7288,0.7032,0.9136,0.7639],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.8","c":"Joints of thoracic wall"},{"w":"The T5\u2013T6 disc lies between the T5 and T6 bodies just below the carina, behind the esophagus and descending aorta, with the heads of the 6th ribs joining it.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1345,0.2477,0.285,0.2801],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"The pulmonary trunk leaves the right ventricle left of the ascending aorta and splits under the aortic arch, the right pulmonary artery passing behind the ascending aorta and superior vena cava.","i":"img/tb/v3_moore_144_1411.jpg","iw":1000,"ih":459,"hl":[0.7187,0.1613,0.8684,0.2104],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.36","c":"Internal structure and organization of lungs"},{"w":"The left auricle is the ear-shaped pouch of the left atrium curling forward beside the pulmonary trunk; the left atrium itself forms the heart's back, in front of the esophagus.","i":"img/tb/v3_gray_213_185.jpg","iw":1000,"ih":769,"hl":[0.6092,0.3713,0.7046,0.3998],"a":"Gray's Anatomy for Students, Fig. 3.58","c":"Anterior surface of the heart"},{"w":"The 3rd costal cartilage runs from the front end of the 3rd rib to the side of the sternal body, one level below the sternal angle, under pectoralis major.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The left anterior descending artery runs down the anterior interventricular groove between the right and left ventricles toward the apex, beside the great cardiac vein.","i":"img/tb/v3_moore_184_1490.jpg","iw":996,"ih":896,"hl":[0.7652,0.5762,0.9759,0.6976],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"The great cardiac vein climbs the anterior interventricular groove beside the left anterior descending artery, then turns left in the coronary groove with the circumflex artery to become the coronary sinus.","i":"img/tb/v3_gray_232_214.jpg","iw":1000,"ih":767,"hl":[0.1382,0.402,0.2942,0.4305],"a":"Gray's Anatomy for Students, Fig. 3.75","c":"Major cardiac veins"},{"w":"Secondary (lobar) bronchi branch from each main bronchus, one per lobe, and split into tertiary (segmental) bronchi near the hilum, running beside the pulmonary artery branches.","i":"img/tb/v3_moore_143_1405.jpg","iw":1000,"ih":815,"hl":[0.0205,0.1524,0.2394,0.267],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.35","c":"Tracheobronchial tree and bronchopulmonary segments"},{"w":"The nucleus pulposus is the soft jelly-like core in the middle of an intervertebral disc, slightly behind centre and ringed by the anulus fibrosus.","i":"img/tb/v3_moore_493_2105.jpg","iw":1000,"ih":690,"hl":[0.0211,0.3654,0.1339,0.4584],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.15","c":"Structure and function of IV discs"},{"w":"In an axial disc section the anulus fibrosus is the layered fibrocartilage ring around the soft central nucleus pulposus, attached to the neighbouring vertebral body rims.","i":"img/tb/v3_moore_494_2107.jpg","iw":996,"ih":1290,"hl":[0.2674,0.8759,0.3836,0.9323],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.16","c":"Uncovertebral joints"},{"w":"On computed tomography the subepicardial fat is the low-density layer between the heart muscle and the thin pericardial line, thickest in the grooves around the coronary vessels.","i":"img/tb/v3_gray_208_177.jpg","iw":882,"ih":980,"hl":[0.034,0.1691,0.2456,0.3133],"a":"Gray's Anatomy for Students, Fig. 3.53","c":"Sagittal section of the pericardium"},{"w":"The two mitral valve cusps, anterior and posterior, hang from the opening between the left atrium and left ventricle, tied by chordae tendineae to the papillary muscles.","i":"img/tb/v3_moore_172_1466.jpg","iw":1000,"ih":687,"hl":[0.7496,0.6047,0.9793,0.6362],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.57","c":"Interior and out\ufb02 ow tract of left ventricle of heart"},{"w":"In this axial section the anterior borders of the lungs are their thin front edges reaching toward each other behind the sternum, the left one cut back by the cardiac notch.","i":"img/tb/v3_gray_195_155.jpg","iw":1000,"ih":694,"hl":[0.0486,0.0939,0.1686,0.1383],"a":"Gray's Anatomy for Students, Fig. 3.39","c":"Lungs"},{"w":"The posterior borders of the lungs are the thick rounded backs of each lung, filling the gutters beside the thoracic vertebral bodies and rib heads.","i":"img/tb/v3_gray_195_155.jpg","iw":1000,"ih":694,"hl":[0.5158,0.6396,0.5905,0.7127],"a":"Gray's Anatomy for Students, Fig. 3.39","c":"Lungs"},{"w":"The right 4th sternocostal joint is where the right 4th costal cartilage meets the side of the sternal body, just medial to the right internal thoracic vessels.","i":"img/tb/v3_moore_109_1340.jpg","iw":1000,"ih":517,"hl":[0.0977,0.2471,0.2896,0.3887],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.8","c":"Joints of thoracic wall"},{"w":"The right 4th costal cartilage links the right 4th rib to the sternal body, behind pectoralis major and in front of the right internal thoracic vessels and pleura.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The right 4th costochondral joint is where the front end of the 4th rib meets its costal cartilage, out to the side of the sternum, under pectoralis major.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7206,0.3953,0.9011,0.4232],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The right atrioventricular orifice opens from the right atrium into the right ventricle, is guarded by the tricuspid valve, and lies in front of and right of the mitral orifice.","i":"img/tb/v3_moore_168_1458.jpg","iw":1000,"ih":635,"hl":[0.4444,0.9166,0.5587,0.9794],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.53","c":"Right atrium of heart"},{"w":"In an axial section the cut diaphragm is the thin muscle band curving between the lung bases outside and the liver, stomach and spleen inside.","i":"img/tb/v3_moore_258_1617.jpg","iw":1000,"ih":1139,"hl":[0.0187,0.5821,0.1395,0.6073],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.33","c":"The esophagus and its relationships"},{"w":"The 4th costal cartilage links the 4th rib to the middle of the sternal body, lying under pectoralis major and in front of the internal thoracic vessels.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"Mediastinal fat fills the gaps between the great vessels, trachea and heart, most of it in the anterior mediastinum around the thymic remnant behind the sternum."},{"w":"In this low thoracic section the abdominal fat is the pale oval under the left diaphragm dome, which bulges up into the chest so lung surrounds it."}]};
const MEDIA = Object.fromEntries(DATA.media);
const ORDER_M = DATA.media.map(m => m[0]);
const main = document.getElementById('main');
const toc = document.getElementById('toc');
const figs = [];

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function updateShown(fig) {
  const boxes = fig.querySelectorAll('.occ');
  const open = fig.querySelectorAll('.occ.open').length;
  fig.querySelector('.shown').textContent = open + ' of ' + boxes.length + ' shown';
}
function setAll(scope, open) {
  scope.querySelectorAll('.occ').forEach(b => { b.classList.toggle('open', open); b.setAttribute('aria-pressed', open); });
  (scope.matches && scope.matches('figure.pic') ? [scope] : scope.querySelectorAll('figure.pic')).forEach(updateShown);
}

function whereBox(p) {
  const det = el('details', 'where');
  const sum = el('summary', null, 'Where is it?');
  sum.append(el('span', 'c', p.d.length === 1 ? '1 structure' : p.d.length + ' structures'));
  det.append(sum);
  const ul = el('ul');
  for (const [name, si, k] of p.d) {
    const s = DATA.S[si] || {};
    const li = el('li');
    const txt = el('div');
    const nm = el('p', 'nm'); if (k) nm.append(el('span', 'k', '#' + k)); nm.append(document.createTextNode(name));
    txt.append(nm, el('p', 'tx', s.w || ''));
    li.append(txt);
    if (s.i) {
      const f = el('figure', 'tb');
      const a = el('a'); a.href = s.i; a.target = '_blank'; a.rel = 'noopener'; a.title = 'Open full size';
      const im = el('img'); im.dataset.src = s.i; im.alt = (s.a || 'Textbook figure') + ': ' + name; im.width = s.iw; im.height = s.ih; im.decoding = 'async';
      a.append(im);
      if (s.hl) {
        const h = el('span', 'hl');
        h.style.left = (s.hl[0] * 100 - 0.8) + '%'; h.style.top = (s.hl[1] * 100 - 0.8) + '%';
        h.style.width = ((s.hl[2] - s.hl[0]) * 100 + 1.6) + '%'; h.style.height = ((s.hl[3] - s.hl[1]) * 100 + 1.6) + '%';
        a.append(h);
      }
      f.append(a);
      const cap = el('figcaption');
      cap.append(el('b', null, s.a || ''), document.createTextNode(s.c ? ' \u00b7 ' + s.c : ''));
      f.append(cap); li.append(f);
    } else li.classList.add('noimg');
    ul.append(li);
  }
  det.append(ul);
  det.addEventListener('toggle', () => { if (det.open) det.querySelectorAll('img[data-src]').forEach(im => { im.src = im.dataset.src; im.removeAttribute('data-src'); }); });
  return det;
}

function build() {
  for (const [rid, rname] of DATA.regions) {
    const inR = DATA.pics.filter(p => p.r === rid);
    if (!inR.length) continue;
    const sec = el('section', 'region'); sec.id = rid; sec.dataset.name = rname;
    const h2 = el('h2', null, rname); const hc = el('span', 'c'); h2.append(hc); sec.append(h2);
    for (const mid of ORDER_M) {
      const inP = inR.filter(p => p.m === mid).sort((a, b) => a.o - b.o);
      if (!inP.length) continue;
      const part = el('div', 'part');
      const h3 = el('h3', null, MEDIA[mid]); const pc = el('span', 'c'); h3.append(pc); part.append(h3);
      for (const p of inP) {
        const fig = el('figure', 'pic'); fig.id = 'p-' + p.id; fig.dataset.rank = p.k; fig.dataset.m = p.m;
        const cap = el('figcaption', 'cap');
        cap.append(el('span', 'rank', 'HY #' + p.k), el('span', 'src', p.t), el('span', 'shown'));
        const stage = el('div', 'stage'); stage.style.aspectRatio = p.w + ' / ' + p.h;
        stage.style.maxWidth = 'min(100%, calc(' + (p.w / p.h).toFixed(4) + ' * (100vh - 225px)))';
        const img = el('img'); img.src = p.f; img.loading = 'lazy'; img.decoding = 'async'; img.width = p.w; img.height = p.h; img.alt = p.t;
        stage.append(img);
        p.b.forEach((b, i) => {
          const o = el('button', 'occ'); o.type = 'button';
          o.style.left = (b[0] * 100) + '%'; o.style.top = (b[1] * 100) + '%';
          o.style.width = ((b[2] - b[0]) * 100) + '%'; o.style.height = ((b[3] - b[1]) * 100) + '%';
          o.setAttribute('aria-label', 'Label ' + (i + 1)); o.setAttribute('aria-pressed', 'false');
          stage.append(o);
        });
        const act = el('div', 'actions');
        const hb = el('button', 'btn', 'Hide labels'); hb.type = 'button'; hb.dataset.act = 'hide';
        const sb = el('button', 'btn', 'Show labels'); sb.type = 'button'; sb.dataset.act = 'show';
        act.append(hb, sb);
        fig.append(cap, stage, act);
        if (p.d && p.d.length) fig.append(whereBox(p));
        for (const n of p.n) { const no = el('p', 'note'); const bb = el('b', null, 'Note: '); no.append(bb, document.createTextNode(n)); fig.append(no); }
        part.append(fig); figs.push(fig);
        updateShown(fig);
      }
      sec.append(part);
    }
    main.append(sec);
  }
}

main.addEventListener('click', e => {
  const o = e.target.closest('.occ');
  if (o) { const open = !o.classList.contains('open'); o.classList.toggle('open', open); o.setAttribute('aria-pressed', open); updateShown(o.closest('figure')); return; }
  const a = e.target.closest('[data-act]');
  if (a) setAll(a.closest('figure.pic'), a.dataset.act === 'show');
});
document.getElementById('revealAll').addEventListener('click', () => setAll(main, true));
document.getElementById('hideAll').addEventListener('click', () => setAll(main, false));

const sel = document.getElementById('topN'), custom = document.getElementById('topCustom');
const typesEl = document.getElementById('types');
let selTypes = new Set();            // empty = every type
const typeBtns = {};
function typeButton(id, name, count) {
  const b = el('button', null, name); b.type = 'button'; b.dataset.type = id;
  b.append(el('span', 'c', count)); typesEl.append(b); typeBtns[id] = b; return b;
}
function paintTypes() {
  typeBtns.all.setAttribute('aria-pressed', selTypes.size === 0);
  ORDER_M.forEach(m => { if (typeBtns[m]) typeBtns[m].setAttribute('aria-pressed', selTypes.has(m)); });
}
typesEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.type;
  if (t === 'all') selTypes.clear();
  else { selTypes.has(t) ? selTypes.delete(t) : selTypes.add(t); if (selTypes.size === Object.keys(typeBtns).length - 1) selTypes.clear(); }
  applyFilter();
});
function applyFilter() {
  let n = Infinity;
  if (sel.value === 'custom') { custom.hidden = false; const v = parseInt(custom.value, 10); n = v > 0 ? v : Infinity; }
  else { custom.hidden = true; if (sel.value !== 'all') n = +sel.value; }
  // top-N counts only the chosen picture types
  const ok = figs.filter(f => !selTypes.size || selTypes.has(f.dataset.m)).sort((a, b) => a.dataset.rank - b.dataset.rank);
  const keep = new Set(ok.slice(0, n === Infinity ? ok.length : n));
  figs.forEach(f => { f.hidden = !keep.has(f); });
  paintTypes();
  toc.textContent = '';
  let shownTot = 0, boxTot = 0;
  document.querySelectorAll('section.region').forEach(sec => {
    let secN = 0;
    sec.querySelectorAll('.part').forEach(part => {
      const k = part.querySelectorAll('figure.pic:not([hidden])').length;
      part.hidden = !k; part.querySelector('h3 .c').textContent = k + (k === 1 ? ' picture' : ' pictures'); secN += k;
    });
    sec.hidden = !secN;
    sec.querySelector('h2 .c').textContent = secN + (secN === 1 ? ' picture' : ' pictures');
    const a = el('a'); a.href = '#' + sec.id; a.textContent = sec.dataset.name; const c = el('span', 'c', secN); a.append(c);
    if (!secN) a.classList.add('empty');
    a.addEventListener('click', ev => { ev.preventDefault(); if (!sec.hidden) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    toc.append(a);
    shownTot += secN;
    sec.querySelectorAll('figure.pic:not([hidden]) .occ').forEach(() => boxTot++);
  });
  document.getElementById('summary').textContent = shownTot + ' of ' + figs.length + ' pictures \u00b7 ' + boxTot + ' labels';
  try { localStorage.setItem('labocc-top', JSON.stringify({ s: sel.value, c: custom.value, t: [...selTypes] })); } catch (e) {}
}
sel.addEventListener('change', () => { if (sel.value === 'custom' && !custom.value) custom.value = 30; applyFilter(); if (sel.value === 'custom') custom.focus(); });
custom.addEventListener('input', applyFilter);
custom.max = DATA.pics.length;

build();
typeButton('all', 'All types', DATA.pics.length);
ORDER_M.forEach(m => { const k = DATA.pics.filter(p => p.m === m).length; if (k) typeButton(m, MEDIA[m], k); });
try { const s = JSON.parse(localStorage.getItem('labocc-top') || 'null'); if (s) { sel.value = s.s; custom.value = s.c || ''; selTypes = new Set((s.t || []).filter(t => typeBtns[t])); } } catch (e) {}
applyFilter();
</script>
