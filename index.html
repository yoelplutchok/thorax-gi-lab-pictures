oore_345_1792.jpg","iw":1000,"ih":892,"hl":[0.0212,0.2282,0.1766,0.2911],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.100","c":"Lymphatic vessels and lymph nodes of posterior abdominal wall and lymphatic trunks of abdomen"},{"w":"The anterior superior pancreaticoduodenal artery, a branch of the gastroduodenal artery, runs down the front of the pancreatic head beside the duodenum to meet the inferior pancreaticoduodenal artery.","i":"img/tb/v3_gray_375_410.jpg","iw":1000,"ih":633,"hl":[0.0143,0.5627,0.2489,0.6263],"a":"Gray's Anatomy for Students, Fig. 4.115","c":"Initial branching and relationships of the superior mesenteric artery"},{"w":"The posterior superior pancreaticoduodenal artery branches from the gastroduodenal artery behind the duodenum and descends on the back of the pancreatic head beside the bile duct.","i":"img/tb/v3_gray_375_410.jpg","iw":1000,"ih":633,"hl":[0.0923,0.3233,0.3269,0.3858],"a":"Gray's Anatomy for Students, Fig. 4.115","c":"Initial branching and relationships of the superior mesenteric artery"},{"w":"The posterior inferior pancreaticoduodenal artery branches from the inferior pancreaticoduodenal artery off the superior mesenteric artery and climbs behind the pancreatic head beside the duodenum.","i":"img/tb/v3_gray_363_393.jpg","iw":874,"ih":1115,"hl":[0.0275,0.664,0.4464,0.7268],"a":"Gray's Anatomy for Students, Fig. 4.101","c":"Arterial supply to the pancreas"},{"w":"The short gastric arteries are four or five small branches of the splenic artery near the splenic hilum that run in the gastrosplenic ligament to the fundus of the stomach.","i":"img/tb/v3_moore_265_1629.jpg","iw":1000,"ih":575,"hl":[0.7697,0.1848,0.9445,0.2232],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.40","c":"Arteries of stomach, duodenum, and spleen"},{"w":"The left branch of the portal vein runs left across the porta hepatis to the ligamentum teres fissure, meeting the round ligament and the ligamentum venosum.","i":"img/tb/v3_moore_307_1719.jpg","iw":1000,"ih":619,"hl":[0.8199,0.8938,0.9522,0.9259],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.72","c":"Nerves and veins of liver and biliary system"},{"w":"The right branch of the portal vein is the short, wide branch entering the right liver at the porta hepatis, behind the right hepatic artery and duct.","i":"img/tb/v3_gray_375_410.jpg","iw":1000,"ih":633,"hl":[0.2718,0.1076,0.3586,0.1404],"a":"Gray's Anatomy for Students, Fig. 4.115","c":"Initial branching and relationships of the superior mesenteric artery"},{"w":"The right gastric vein runs with the right gastric artery along the lesser curvature near the pylorus and drains directly into the portal vein.","i":"img/tb/v3_moore_266_1630.jpg","iw":1000,"ih":576,"hl":[0.213,0.3008,0.344,0.3349],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.41","c":"Veins of stomach, duodenum, and spleen"},{"w":"The left gastric vein runs with the left gastric artery along the upper lesser curvature, receives veins from the lower esophagus, and drains into the portal vein.","i":"img/tb/v3_moore_266_1630.jpg","iw":1000,"ih":576,"hl":[0.282,0.2191,0.4018,0.2536],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.41","c":"Veins of stomach, duodenum, and spleen"},{"w":"The quadrate lobe is the square area under the liver in front of the porta hepatis, between the gallbladder and the ligamentum teres fissure.","i":"img/tb/v3_gray_358_385.jpg","iw":1000,"ih":616,"hl":[0.3773,0.8472,0.4953,0.8815],"a":"Gray's Anatomy for Students, Fig. 4.96","c":"Posterior view of the bare area of the liver and associated ligaments"},{"w":"The ligamentum venosum lies in a fissure on the back of the liver between the caudate and left lobes, joining the left portal branch to the inferior vena cava.","i":"img/tb/v3_moore_300_1709.jpg","iw":1000,"ih":605,"hl":[0.0144,0.0975,0.1639,0.1553],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.66","c":"Relationships of liver to other abdominal viscera, lesser omentum, and portal triad"},{"w":"The right, middle and left hepatic veins run between liver segments and empty into the inferior vena cava on the back of the liver, just below the diaphragm.","i":"img/tb/v3_moore_302_1711.jpg","iw":1000,"ih":817,"hl":[0.1935,0.0387,0.3683,0.0699],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.67","c":"Hepatic segmentation"},{"w":"The celiac lymph nodes cluster around the celiac trunk's root on the front of the aorta, collecting from gastric, hepatic, splenic and pancreatic nodes.","i":"img/tb/v3_moore_306_1718.jpg","iw":1000,"ih":1109,"hl":[0.7762,0.5809,0.8864,0.6761],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.71","c":"Arteries supplying the biliary duct and lymphatic drainage of gallbladder and bile duct"},{"w":"The fundus is the rounded blind end of the gallbladder projecting below the liver's inferior border, touching the abdominal wall at the right ninth costal cartilage tip.","i":"img/tb/v3_moore_307_1719.jpg","iw":1000,"ih":619,"hl":[0.1239,0.3519,0.1814,0.3839],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.72","c":"Nerves and veins of liver and biliary system"},{"w":"The body is the broad middle part of the gallbladder, between fundus and neck, lying in its liver fossa against the transverse colon and duodenum.","i":"img/tb/v3_moore_307_1719.jpg","iw":1000,"ih":619,"hl":[0.1241,0.4883,0.1633,0.5207],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.72","c":"Nerves and veins of liver and biliary system"},{"w":"The neck of the gallbladder is its narrow tapered end pointing toward the porta hepatis, making an S-shaped bend before it continues as the cystic duct.","i":"img/tb/v3_moore_307_1719.jpg","iw":1000,"ih":619,"hl":[0.6514,0.1326,0.7988,0.1646],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.72","c":"Nerves and veins of liver and biliary system"},{"w":"The jejunal and ileal arteries leave the left side of the superior mesenteric artery and run in the mesentery, forming arcades and straight vasa recta to the small intestine.","i":"img/tb/v3_gray_342_355.jpg","iw":889,"ih":1101,"hl":[0.2493,0.9465,0.617,0.9782],"a":"Gray's Anatomy for Students, Fig. 4.68","c":"Arterial supply to the ileum"},{"w":"The vasa recta are the straight arteries running from the outermost arterial arcade in the mesentery to the small intestine wall, long in the jejunum and short in the ileum.","i":"img/tb/v3_moore_274_1650.jpg","iw":1000,"ih":788,"hl":[0.8367,0.6422,0.9307,0.6709],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.49","c":"Arterial supply and mesenteries of intestines"},{"w":"The ileocolic artery is the last right-side branch of the superior mesenteric artery, running down and right to the ileocecal junction, where it gives the appendicular artery.","i":"img/tb/v3_moore_274_1650.jpg","iw":1000,"ih":788,"hl":[0.0148,0.5496,0.0912,0.5783],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.49","c":"Arterial supply and mesenteries of intestines"},{"w":"The appendicular vein runs with the appendicular artery in the free edge of the mesoappendix and drains into the ileocolic vein, a tributary of the superior mesenteric vein.","i":"img/tb/v3_moore_257_1614.jpg","iw":1000,"ih":801,"hl":[0.0165,0.8226,0.1756,0.8513],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.32","c":"Arterial supply and venous drainage of abdominal parts of alimentary system"},{"w":"The middle colic artery leaves the front of the superior mesenteric artery just below the pancreas and runs inside the transverse mesocolon to the transverse colon.","i":"img/tb/v3_moore_281_1662.jpg","iw":1000,"ih":1065,"hl":[0.0219,0.2784,0.1738,0.3099],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.56","c":"Veins, lymph nodes, and nerves of large intestine"},{"w":"The ileocecal junction is where the terminal ileum joins the medial side of the large bowel in the right iliac fossa, between cecum below and ascending colon above.","i":"img/tb/v3_moore_278_1658.jpg","iw":1000,"ih":512,"hl":[0.3782,0.2868,0.4507,0.3631],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.53","c":"Terminal ileum, cecum, and appendix"},{"w":"The inferior mesenteric artery leaves the front of the aorta at L3, behind the third part of the duodenum, and runs down and left behind the peritoneum.","i":"img/tb/v3_moore_281_1662.jpg","iw":1000,"ih":1065,"hl":[0.8127,0.6455,0.9551,0.7079],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.56","c":"Veins, lymph nodes, and nerves of large intestine"},{"w":"The left colic artery is the first branch of the inferior mesenteric artery, running left behind the peritoneum toward the descending colon.","i":"img/tb/v3_moore_281_1662.jpg","iw":1000,"ih":1065,"hl":[0.8127,0.5465,0.9357,0.578],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.56","c":"Veins, lymph nodes, and nerves of large intestine"},{"w":"The sigmoid arteries are two to four branches of the inferior mesenteric artery that run down and left in the sigmoid mesocolon, between the left colic and superior rectal arteries.","i":"img/tb/v3_gray_378_412.jpg","iw":1000,"ih":1413,"hl":[0.7487,0.8684,0.9769,0.8899],"a":"Gray's Anatomy for Students, Fig. 4.117","c":"Inferior mesenteric artery"},{"w":"The inferior mesenteric vein climbs the left posterior abdominal wall, just left of the duodenojejunal flexure, then passes behind the pancreas to usually drain into the splenic vein.","i":"img/tb/v3_moore_281_1661.jpg","iw":965,"ih":1124,"hl":[0.8134,0.3323,0.9751,0.4291],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.56","c":"Veins, lymph nodes, and nerves of large intestine"},{"w":"The splenic vein runs right from the splenic hilum along the back of the pancreas and joins the superior mesenteric vein behind the pancreatic neck to form the portal vein.","i":"img/tb/v3_moore_266_1630.jpg","iw":1000,"ih":576,"hl":[0.5955,0.5908,0.6953,0.6261],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.41","c":"Veins of stomach, duodenum, and spleen"},{"w":"The left colic flexure is where the transverse colon turns sharply down into the descending colon, beside the lower spleen and in front of the left kidney.","i":"img/tb/v3_gray_350_373.jpg","iw":896,"ih":785,"hl":[0.7055,0.9271,0.9732,0.9679],"a":"Gray's Anatomy for Students, Fig. 4.83","c":"Right and left colic flexures"},{"w":"The head of the pancreas sits in the duodenal C-curve, right of the superior mesenteric vessels, in front of the inferior vena cava, with the bile duct behind.","i":"img/tb/v3_moore_271_1643.jpg","iw":1000,"ih":830,"hl":[0.0141,0.5732,0.1621,0.5994],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.45","c":"Relationships of duodenum"},{"w":"The pancreatic neck is the short narrow part between head and body, lying directly in front of the superior mesenteric vein and the start of the portal vein.","i":"img/tb/v3_moore_269_1638.jpg","iw":1000,"ih":520,"hl":[0.0185,0.6656,0.1121,0.765],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.44","c":"Duodenum, pancreas, and spleen"},{"w":"The body of the pancreas runs left from the neck across the aorta and left kidney, with the splenic vein behind it and splenic artery along its top.","i":"img/tb/v3_moore_264_1628.jpg","iw":1000,"ih":1247,"hl":[0.1715,0.3921,0.2478,0.4243],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.39","c":"Omental bursa and stomach bed"},{"w":"The tail is the narrow left end of the pancreas, lying in front of the left kidney and running with the splenic vessels in the splenorenal ligament to the splenic hilum.","i":"img/tb/v3_moore_264_1628.jpg","iw":1000,"ih":1247,"hl":[0.8183,0.3614,0.8946,0.3938],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.39","c":"Omental bursa and stomach bed"},{"w":"The uncinate process hooks left from the lower pancreatic head, behind the superior mesenteric vein and artery and in front of the aorta and inferior vena cava.","i":"img/tb/v3_moore_295_1691.jpg","iw":967,"ih":1025,"hl":[0.594,0.7434,0.8592,0.7793],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.60","c":"Arterial supply and venous drainage of pancreas"},{"w":"The main pancreatic duct runs through the pancreas from tail to head, then turns down to join the bile duct, opening at the major duodenal papilla.","i":"img/tb/v3_gray_362_390.jpg","iw":1000,"ih":520,"hl":[0.8262,0.3049,0.9862,0.3434],"a":"Gray's Anatomy for Students, Fig. 4.100","c":"Pancreatic duct system"},{"w":"Each kidney lies behind the peritoneum on psoas major and quadratus lumborum at T12 to L3, with the suprarenal gland on its upper pole and its hilum facing medially.","i":"img/tb/v3_gray_403_443.jpg","iw":1000,"ih":641,"hl":[0.4845,0.1404,0.54,0.1718],"a":"Gray's Anatomy for Students, Fig. 4.140","c":"Organization of fat and fascia surrounding the kidney"},{"w":"The renal veins leave each hilum in front of the renal arteries and drain into the inferior vena cava; the left is longer and crosses in front of the aorta.","i":"img/tb/v3_moore_322_1751.jpg","iw":1000,"ih":695,"hl":[0.3587,0.2296,0.4348,0.2562],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.80","c":"External and internal appearance of kidneys"},{"w":"The left suprarenal vein leaves the front of the left suprarenal gland and runs down to drain into the upper border of the left renal vein.","i":"img/tb/v3_moore_324_1755.jpg","iw":1000,"ih":825,"hl":[0.7141,0.5124,0.8807,0.5391],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.83","c":"Blood vessels of suprarenal glands, kidneys, and superior parts of ureters"},{"w":"The segmental arteries are the five end-arteries the renal artery splits into at the renal hilum, each feeding one kidney segment before dividing into interlobar arteries in the renal sinus.","i":"img/tb/v3_moore_324_1755.jpg","iw":1000,"ih":825,"hl":[0.7151,0.5951,0.8743,0.6218],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.83","c":"Blood vessels of suprarenal glands, kidneys, and superior parts of ureters"},{"w":"The renal pelvis is the funnel-shaped top of the ureter, formed in the renal sinus by the major calyces and lying behind the renal vessels at the hilum.","i":"img/tb/v3_moore_322_1751.jpg","iw":1000,"ih":695,"hl":[0.3587,0.273,0.4465,0.2997],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.80","c":"External and internal appearance of kidneys"},{"w":"The renal cortex is the outer pale band of the kidney just under the capsule, dipping inward as renal columns between the darker striped medullary pyramids.","i":"img/tb/v3_moore_322_1751.jpg","iw":1000,"ih":695,"hl":[0.8342,0.531,0.9247,0.5577],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.80","c":"External and internal appearance of kidneys"},{"w":"The renal pyramids make up the medulla: striped cones deep to the cortex, separated by renal columns, with their tips (papillae) pointing into the minor calyces.","i":"img/tb/v3_moore_322_1751.jpg","iw":1000,"ih":695,"hl":[0.8342,0.9145,0.9462,0.9414],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.80","c":"External and internal appearance of kidneys"},{"w":"The renal capsule is the thin, tough membrane on the kidney's surface, deep to the perirenal fat, turning inward at the hilum to line the renal sinus.","i":"img/tb/v3_moore_322_1751.jpg","iw":1000,"ih":695,"hl":[0.3587,0.5252,0.4725,0.5519],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.80","c":"External and internal appearance of kidneys"},{"w":"Each minor calyx is a small cup in the renal sinus wrapped around the tip (papilla) of a renal pyramid, joining others to form a major calyx.","i":"img/tb/v3_gray_404_444.jpg","iw":1000,"ih":801,"hl":[0.0643,0.686,0.1648,0.714],"a":"Gray's Anatomy for Students, Fig. 4.141","c":"Internal structure of the kidney"},{"w":"The inferior phrenic arteries, the abdominal aorta's first branches, climb onto the diaphragm's underside, the right behind the inferior vena cava, the left behind the esophagus.","i":"img/tb/v3_moore_319_1746.jpg","iw":1000,"ih":856,"hl":[0.0262,0.1112,0.1406,0.1345],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.76","c":"Posterior abdominal wall showing great vessels, kidneys, and suprarenal glands"},{"w":"The lumbar arteries are four paired branches from the back of the abdominal aorta at L1 to L4, hugging the vertebral bodies behind the sympathetic trunks and psoas.","i":"img/tb/v3_moore_532_2181.jpg","iw":901,"ih":2477,"hl":[0.6575,0.6723,0.8787,0.6873],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.46","c":"Arterial supply of spinal cord"},{"w":"Psoas minor is a small muscle from T12 and L1 whose long flat tendon runs down the front of psoas major; it is absent in many people.","i":"img/tb/v3_moore_341_1787.jpg","iw":1000,"ih":692,"hl":[0.783,0.6543,0.895,0.6882],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.97","c":"Muscles and nerves of posterior abdominal wall"},{"w":"Quadratus lumborum is the flat posterior abdominal wall muscle between the iliac crest and 12th rib, behind and lateral to psoas major and behind the kidney.","i":"img/tb/v3_gray_403_443.jpg","iw":1000,"ih":641,"hl":[0.3807,0.947,0.6041,0.9783],"a":"Gray's Anatomy for Students, Fig. 4.140","c":"Organization of fat and fascia surrounding the kidney"},{"w":"The iliopsoas is psoas major and iliacus merged below the iliac fossa, passing under the inguinal ligament lateral to the femoral vessels to insert on the lesser trochanter.","i":"img/tb/v3_moore_341_1787.jpg","iw":1000,"ih":692,"hl":[0.8635,0.8616,0.9432,0.8956],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.97","c":"Muscles and nerves of posterior abdominal wall"},{"w":"The genitofemoral nerve pierces psoas major and runs down its front; its genital branch enters the deep inguinal ring, its femoral branch passes under the inguinal ligament.","i":"img/tb/v3_gray_427_473.jpg","iw":1000,"ih":943,"hl":[0.6775,0.2561,0.8605,0.2744],"a":"Gray's Anatomy for Students","c":""},{"w":"The iliohypogastric nerve (L1) crosses in front of quadratus lumborum, then runs between internal oblique and transversus abdominis, just above the ilioinguinal nerve.","i":"img/tb/v3_gray_426_472.jpg","iw":1000,"ih":882,"hl":[0.0134,0.2645,0.1673,0.2865],"a":"Gray's Anatomy for Students, Fig. 4.161","c":"Lumbar plexus in the posterior abdominal region"},{"w":"The lateral femoral cutaneous nerve leaves the lateral border of psoas major, crosses iliacus, and passes under the inguinal ligament just medial to the anterior superior iliac spine.","i":"img/tb/v3_moore_231_1574.jpg","iw":1000,"ih":454,"hl":[0.0246,0.1874,0.1547,0.2696],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.14","c":"Formations of inguinal region"},{"w":"The subcostal nerve is the T12 anterior ramus, running along the lower border of the 12th rib, behind the lateral arcuate ligament and across quadratus lumborum behind the kidney.","i":"img/tb/v3_gray_426_472.jpg","iw":1000,"ih":882,"hl":[0.0455,0.2106,0.1666,0.2326],"a":"Gray's Anatomy for Students, Fig. 4.161","c":"Lumbar plexus in the posterior abdominal region"},{"w":"The obturator nerve leaves the medial border of psoas major at the pelvic brim, passes behind the common iliac vessels, and follows the pelvic wall to the obturator foramen.","i":"img/tb/v3_gray_427_473.jpg","iw":1000,"ih":943,"hl":[0.6771,0.3895,0.8468,0.4078],"a":"Gray's Anatomy for Students","c":""},{"w":"The lumbosacral trunk (L4 and L5) descends over the sacral ala, medial to psoas major and behind the common iliac vessels, to join the sacral plexus.","i":"img/tb/v3_moore_387_1884.jpg","iw":1000,"ih":686,"hl":[0.1182,0.2786,0.2524,0.3062],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.21","c":"Nerves and nerve plexuses of pelvis"},{"w":"The right crus is the thick diaphragm band rising from the L1\u2013L3 bodies on the right front of the aorta, behind the inferior vena cava, and splitting around the esophagus.","i":"img/tb/v3_gray_396_432.jpg","iw":1000,"ih":663,"hl":[0.2315,0.8919,0.3161,0.9189],"a":"Gray's Anatomy for Students, Fig. 4.132","c":"Diaphragm"},{"w":"In an axial section the left crus is the muscle band rising from L1 and L2 on the left of the aorta, smaller than the right crus.","i":"img/tb/v3_moore_335_1778.jpg","iw":1000,"ih":704,"hl":[0.9066,0.6376,0.9465,0.6719],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.91","c":"Attachments, disposition, and features of the abdominal aspect of the diaphragm"},{"w":"The celiac ganglia are paired firm nerve masses lying on the diaphragmatic crura on either side of the celiac trunk's origin, each receiving the greater splanchnic nerve.","i":"img/tb/v3_gray_424_469.jpg","iw":1000,"ih":992,"hl":[0.8262,0.1567,0.9575,0.1787],"a":"Gray's Anatomy for Students, Fig. 4.159","c":"Prevertebral ganglia associated with the prevertebral plexus"},{"w":"The anterior superior iliac spine is the rounded front tip of the iliac crest, where sartorius arises and the inguinal ligament starts its run to the pubic tubercle.","i":"img/tb/v3_moore_219_1561.jpg","iw":1000,"ih":813,"hl":[0.7759,0.6075,0.9678,0.6303],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.7","c":"Anterolateral abdominal wall"},{"w":"The pubic tubercle is the small knob on the upper border of the pubis at the lateral end of the pubic crest, where the inguinal ligament attaches.","i":"img/tb/v3_gray_475_537.jpg","iw":896,"ih":936,"hl":[0.5692,0.11,0.7848,0.1472],"a":"Gray's Anatomy for Students, Fig. 5.25","c":"Pubic symphysis and associated ligaments"},{"w":"The iliac fossa is the smooth hollow on the inner surface of the iliac wing, below the iliac crest, lined by the iliacus muscle.","i":"img/tb/v3_gray_470_526.jpg","iw":1000,"ih":685,"hl":[0.0849,0.1499,0.1583,0.1772],"a":"Gray's Anatomy for Students, Fig. 5.21","c":"Components of the pelvic bone"},{"w":"The iliac crest is the curved upper border of the ilium running from the anterior to the posterior superior iliac spine, its highest point level with L4.","i":"img/tb/v3_gray_316_323.jpg","iw":1000,"ih":749,"hl":[0.7717,0.6387,0.8973,0.6694],"a":"Gray's Anatomy for Students, Fig. 4.36","c":"Innervation of the anterolateral abdominal wall"},{"w":"The manubrium is the top part of the sternum, between the clavicles at T3 to T4, with the jugular notch above and the left brachiocephalic vein behind it.","i":"img/tb/v3_moore_107_1334.jpg","iw":1000,"ih":1028,"hl":[0.5002,0.2863,0.6599,0.321],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.6","c":"Sternum"},{"w":"The clavicular notches are the shallow sockets on each upper corner of the manubrium, beside the jugular notch, where the medial ends of the clavicles form the sternoclavicular joints.","i":"img/tb/v3_moore_107_1334.jpg","iw":1000,"ih":1028,"hl":[0.804,0.0216,0.934,0.0873],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.6","c":"Sternum"},{"w":"The jugular notch is the midline dip on top of the manubrium, between the two clavicular notches, level with T2 and with the trachea right behind it.","i":"img/tb/v3_moore_107_1334.jpg","iw":1000,"ih":1028,"hl":[0.4005,0.0216,0.5787,0.0552],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.6","c":"Sternum"},{"w":"The costal notch for the first rib is the depression on the upper side edge of the manubrium, just below the clavicular notch, where the 1st costal cartilage attaches.","i":"img/tb/v3_moore_107_1334.jpg","iw":1000,"ih":1028,"hl":[0.7499,0.427,0.8536,0.4926],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.6","c":"Sternum"},{"w":"The sternal angle is the ridge at the joint between manubrium and sternal body where the second costal cartilages attach, level with the T4\u2013T5 disc.","i":"img/tb/v3_moore_159_1439.jpg","iw":1000,"ih":818,"hl":[0.7653,0.2592,0.947,0.287],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.44","c":"Pericardial sac in relation to sternum and phrenic nerves"},{"w":"The costal notches for ribs 2\u20137 line the side edges of the sternum: the 2nd at the sternal angle, the 3rd\u20136th on the body, the 7th at the xiphisternal junction.","i":"img/tb/v3_moore_107_1334.jpg","iw":1000,"ih":1028,"hl":[0.7499,0.427,0.8536,0.4926],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.6","c":"Sternum"},{"w":"The xiphoid process is the small lowest part of the sternum, below the sternal body at the xiphisternal joint (level with T9), where the two costal margins meet.","i":"img/tb/v3_gray_150_102.jpg","iw":1000,"ih":1085,"hl":[0.8034,0.7325,0.9465,0.7648],"a":"Gray's Anatomy for Students","c":""},{"w":"The head of a rib is its back end, medial to the neck and tubercle, with two facets for its own vertebral body and the one above.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1345,0.2999,0.2862,0.3323],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"The neck of a rib is the narrow bar between its head and tubercle, lying in front of its vertebra's transverse process; ribs 11 and 12 have none.","i":"img/tb/v3_moore_110_1341.jpg","iw":1000,"ih":368,"hl":[0.3781,0.1908,0.4398,0.3039],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.9","c":"Costotransverse joints"},{"w":"The head of a typical rib carries two facets, split by a crest, that meet the body of its own vertebra and the vertebra above at the costovertebral joint.","i":"img/tb/v3_moore_104_1331.jpg","iw":1000,"ih":1025,"hl":[0.2035,0.3768,0.2704,0.4186],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.3","c":"Atypical ribs"},{"w":"The shaft is the long, curved body of the rib, running from the tubercle around the chest to the costal cartilage, with the costal groove along its inner lower edge.","i":"img/tb/v3_moore_104_1331.jpg","iw":1000,"ih":1025,"hl":[0.6317,0.4089,0.6745,0.43],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.3","c":"Atypical ribs"},{"w":"The angle of the rib is the sharp forward bend of the posterior shaft just lateral to the tubercle; the rib is weakest just in front of it.","i":"img/tb/v3_moore_104_1330.jpg","iw":965,"ih":615,"hl":[0.7352,0.0391,0.9199,0.099],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.2","c":"Typical ribs"},{"w":"The tubercle is the knob on the back of a rib where the neck meets the shaft, its facet joining the transverse process of the same-numbered vertebra at the costotransverse joint.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1226,0.4923,0.2438,0.5244],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"The twelve thoracic vertebrae lie between the cervical and lumbar spine, and each is recognized by its heart-shaped body and facets where the ribs' heads and tubercles attach.","i":"img/tb/v3_moore_102_1326.jpg","iw":1000,"ih":929,"hl":[0.5216,0.0186,0.7304,0.0471],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"A lumbar vertebra has a large kidney-shaped body with no rib facets, long thin transverse processes and a short square spinous process, with psoas major hugging its sides.","i":"img/tb/v3_moore_341_1787.jpg","iw":1000,"ih":692,"hl":[0.783,0.602,0.9422,0.6356],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.97","c":"Muscles and nerves of posterior abdominal wall"},{"w":"The teniae coli are three flat bands of longitudinal muscle running along the cecum and colon that meet at the base of the appendix and spread out at the rectosigmoid junction.","i":"img/tb/v3_gray_348_367.jpg","iw":889,"ih":1074,"hl":[0.2462,0.0224,0.4311,0.0544],"a":"Gray's Anatomy for Students, Fig. 4.79","c":"Positions of the appendix"},{"w":"The first rib is the short, flat, tightly curved rib just under the clavicle, joining T1 and the manubrium, with the subclavian vein and artery crossing its top.","i":"img/tb/v3_moore_750_2300.jpg","iw":1000,"ih":680,"hl":[0.8067,0.7152,0.8491,0.7419],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.43","c":"Formation of brachial plexus"},{"w":"The twelfth rib is the short lowest floating rib, joined only to T12 and ending free in the posterior abdominal wall muscles, with quadratus lumborum attached to its lower border.","i":"img/tb/v3_moore_104_1331.jpg","iw":1000,"ih":1025,"hl":[0.2285,0.8815,0.2965,0.9033],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.3","c":"Atypical ribs"},{"w":"On a frontal chest film the clavicle crosses the top of the chest from the manubrium to the acromion, above and in front of the first rib.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.5093,0.9488,0.5808,0.9766],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The heart's apex is the blunt lower left tip formed by the left ventricle, behind the left fifth intercostal space about 9 cm from the midline.","i":"img/tb/v3_moore_138_1395.jpg","iw":1000,"ih":742,"hl":[0.7685,0.6113,0.8374,0.6687],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.31","c":"Relationship of thoracic contents and linings of thoracic cage"},{"w":"On a frontal chest film the left dome is the curved line under the left lung base, slightly lower than the right, above the stomach gas bubble.","i":"img/tb/v3_moore_159_1439.jpg","iw":1000,"ih":818,"hl":[0.7653,0.7217,0.9719,0.7492],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.44","c":"Pericardial sac in relation to sternum and phrenic nerves"},{"w":"The gastric air bubble is swallowed air trapped in the stomach fundus, seen on an upright chest or abdominal film as a dark pocket just under the left hemidiaphragm.","i":"img/tb/v3_moore_263_1627.jpg","iw":1000,"ih":822,"hl":[0.0233,0.0467,0.1269,0.0901],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.38","c":"The internal surface of the stomach"},{"w":"On a chest film the left lung's inferior border is the sharp base edge over the diaphragm, at rib 6 midclavicular, rib 8 midaxillary and rib 10 posteriorly.","i":"img/tb/v3_moore_140_1399.jpg","iw":1000,"ih":590,"hl":[0.4001,0.8045,0.5752,0.8588],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.33","c":"Costal surfaces of lungs"},{"w":"On this frontal chest film the right dome of the diaphragm is the smooth curve under the right lung base, with dense liver beneath, sitting slightly higher than the left dome.","i":"img/tb/v3_moore_207_1532.jpg","iw":1000,"ih":757,"hl":[0.0472,0.5372,0.1521,0.5895],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"The sternum is the flat midline bone of the front chest wall, made of manubrium, body and xiphoid, with costal cartilages 1\u20137 at its sides and the heart behind.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7213,0.2447,0.9257,0.2725],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"Each rib curves from its thoracic vertebra around the chest wall to a costal cartilage; on a chest film the back parts lie flatter and the front parts slope down.","i":"img/tb/v3_gray_150_102.jpg","iw":1000,"ih":1085,"hl":[0.0182,0.6138,0.064,0.6461],"a":"Gray's Anatomy for Students","c":""},{"w":"On frontal films the aortopulmonary window is the notch between the aortic knob and left pulmonary artery, holding the ligamentum arteriosum and left recurrent laryngeal nerve.","i":"img/tb/v3_moore_193_1504.jpg","iw":1000,"ih":615,"hl":[0.6942,0.7664,0.8273,0.8559],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.68","c":"Great vessels and nerves"},{"w":"On a lateral spine film the intervertebral foramen is the hole between two adjacent pedicles, bounded by the disc in front and the facet joint behind.","i":"img/tb/v3_moore_493_2104.jpg","iw":1000,"ih":703,"hl":[0.0233,0.3074,0.2065,0.408],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.14","c":"Lumbar vertebrae and IV discs"},{"w":"On a frontal spine film the pedicles are the paired oval rings at the upper outer corners of each vertebral body, linking the body to the lamina and transverse process.","i":"img/tb/v3_moore_495_2108.jpg","iw":1000,"ih":1471,"hl":[0.0233,0.2692,0.1599,0.3414],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.17","c":"Relationship of ligaments to vertebrae and IV discs"},{"w":"The superior articular process projects up from where the pedicle meets the lamina and joins the inferior articular process of the vertebra above at the facet joint.","i":"img/tb/v3_moore_106_1332.jpg","iw":1000,"ih":730,"hl":[0.8288,0.6552,0.9821,0.7179],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.4","c":"Thoracic vertebrae"},{"w":"The inferior articular process projects down from where the pedicle meets the lamina and joins the superior articular process of the vertebra below at the facet joint.","i":"img/tb/v3_moore_474_2039.jpg","iw":1000,"ih":1474,"hl":[0.0201,0.1918,0.2769,0.2105],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.5","c":"Cervical vertebrae"},{"w":"The joint of the head of a rib is where the rib head meets two neighbouring thoracic vertebral bodies and the disc between them, medial to the costotransverse joint.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.0161,0.2763,0.0848,0.3713],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"The costotransverse joint is the joint between a rib's tubercle and the transverse process of its own vertebra, lateral to the rib head, for ribs 1 to 10.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.0161,0.5164,0.1046,0.6113],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"The vertebral body is the thick, round, weight-bearing front block of each vertebra, in front of the vertebral canal and stacked between intervertebral discs; thoracic bodies carry the rib heads.","i":"img/tb/v3_moore_494_2107.jpg","iw":996,"ih":1290,"hl":[0.1476,0.5329,0.2171,0.5618],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.16","c":"Uncovertebral joints"},{"w":"On this 3-D scan the transverse process is the bony bar projecting sideways and back from a thoracic vertebra, its tip meeting the rib tubercle at the costotransverse joint.","i":"img/tb/v3_moore_106_1332.jpg","iw":1000,"ih":730,"hl":[0.513,0.1062,0.6192,0.169],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.4","c":"Thoracic vertebrae"},{"w":"On a chest film each rib head sits at the rib's back end against the vertebral bodies, where a typical rib joins its own vertebra and the one above.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1345,0.2999,0.2862,0.3323],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"On this 3-D scan the angle of a rib is the bend in the shaft just lateral to the tubercle, where the rib turns forward and iliocostalis attaches.","i":"img/tb/v3_moore_515_2154.jpg","iw":594,"ih":1189,"hl":[0.6276,0.3192,0.9003,0.3502],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.31","c":"Intermediate layer of intrinsic back muscles (erector spinae muscles)"},{"w":"The second rib lies just below the first rib, and its costal cartilage meets the sternum at the sternal angle, which makes it the starting point for counting ribs.","i":"img/tb/v3_moore_104_1331.jpg","iw":1000,"ih":1025,"hl":[0.2252,0.1532,0.2878,0.1753],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.3","c":"Atypical ribs"},{"w":"The 7th rib is the lowest and longest true rib, its cartilage joining the sternum at the xiphisternal joint and forming the top of the costal margin.","i":"img/tb/v3_moore_102_1326.jpg","iw":1000,"ih":929,"hl":[0.1342,0.5102,0.1982,0.5387],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The 6th rib is the second-lowest true rib; its cartilage joins the lower sternal body just above the xiphoid and gives attachment to rectus abdominis.","i":"img/tb/v3_moore_113_1343.jpg","iw":1000,"ih":606,"hl":[0.0775,0.6969,0.1253,0.7296],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"Find the fifth rib by counting down from the first rib on a film, or the second at the sternal angle; the heart apex lies just below it.","i":"img/tb/v3_moore_195_1508.jpg","iw":1000,"ih":781,"hl":[0.1821,0.2921,0.2265,0.3157],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"Lateral exposures of mediastinum"},{"w":"Find the fourth rib by counting down from the second rib at the sternal angle, or the first on a film; the right lung's horizontal fissure follows it.","i":"img/tb/v3_moore_138_1395.jpg","iw":1000,"ih":742,"hl":[0.014,0.3383,0.066,0.3673],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.31","c":"Relationship of thoracic contents and linings of thoracic cage"},{"w":"The 3rd rib is one below the 2nd rib at the sternal angle; its cartilage joins the upper sternal body, and pectoralis minor arises from its front.","i":"img/tb/v3_moore_102_1326.jpg","iw":1000,"ih":929,"hl":[0.1336,0.881,0.2592,0.9377],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The 8th rib is the highest false rib, its cartilage joining the 7th costal cartilage above to help form the costal margin rather than reaching the sternum.","i":"img/tb/v3_moore_104_1331.jpg","iw":1000,"ih":1025,"hl":[0.0608,0.3547,0.1185,0.3765],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.3","c":"Atypical ribs"},{"w":"The 9th rib is a false rib whose cartilage joins the 8th in the costal margin; the transpyloric plane at L1 crosses the tips of the 9th costal cartilages.","i":"img/tb/v3_moore_150_1423.jpg","iw":988,"ih":816,"hl":[0.0243,0.053,0.1142,0.0982],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"On this oblique rib film the 10th rib is the lowest rib above the floating 11th and 12th ribs, and its cartilage joins the 9th at the bottom of the costal margin.","i":"img/tb/v3_moore_252_1607.jpg","iw":1000,"ih":584,"hl":[0.0126,0.6506,0.0685,0.684],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.29","c":"Omental (epiploic) foramen and omental bursa"},{"w":"On a radiograph the eleventh rib is the second-lowest rib, a short floating rib whose free front tip ends in the flank muscles without reaching the costal margin.","i":"img/tb/v3_moore_104_1331.jpg","iw":1000,"ih":1025,"hl":[0.187,0.6793,0.2551,0.7011],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.3","c":"Atypical ribs"},{"w":"The spine of the scapula is the bony ridge across the back of the scapula, between supraspinatus above and infraspinatus below, ending laterally as the acromion.","i":"img/tb/v3_gray_846_857.jpg","iw":1000,"ih":562,"hl":[0.1452,0.1435,0.2742,0.179],"a":"Gray's Anatomy for Students, Fig. 7.113","c":"Bony landmarks and muscles of the posterior scapular region"},{"w":"The body of the sternum runs from the sternal angle to the xiphisternal joint at T9, with notches on its sides for costal cartilages 2 through 7.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7213,0.4507,0.8759,0.4786],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"The spinal cord lies in the vertebral canal, behind the vertebral bodies and between the pedicles, running from the foramen magnum down to the conus medullaris at L1\u2013L2.","i":"img/tb/v3_moore_528_2173.jpg","iw":1000,"ih":1524,"hl":[0.6334,0.1738,0.9241,0.1884],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.40","c":"Spinal cord in situ"},{"w":"On a chest or abdominal film the vertebral column runs down the midline behind the heart, trachea and abdominal organs, its bodies stacked with disc spaces between them.","i":"img/tb/v3_moore_119_1352.jpg","iw":746,"ih":734,"hl":[0.0403,0.8674,0.365,0.9182],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.15","c":"Contents of an intercostal space"},{"w":"Costal cartilages are hyaline bars continuing each rib forward, ribs 1 to 7 reaching the sternum directly and ribs 8 to 10 joining the cartilage above.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"On a chest film, mediastinal fat and fascia surround the great vessels and trachea and add to the soft-tissue shadow of the central mediastinum between the two lungs."},{"w":"On a chest film the pulmonary arteries and veins make the branching lung markings that fan out from each hilum and thin out toward the edges of the lungs.","i":"img/tb/v3_gray_198_159.jpg","iw":1000,"ih":1333,"hl":[0.732,0.7174,0.8552,0.7394],"a":"Gray's Anatomy for Students, Fig. 3.42","c":"A. Left lung"},{"w":"The proximal aortic arch begins behind the 2nd right sternocostal joint, where the ascending aorta ends, and gives off the brachiocephalic trunk as it curves up and to the left.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.7981,0.4215,0.8889,0.4454],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"On a frontal chest film the distal aortic arch forms the aortic knob at the top of the left mediastinal border, where it turns down into the descending aorta at T4.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.7981,0.4215,0.8889,0.4454],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"The lobar (secondary) bronchi are the first branches of each main bronchus at the hilum, one for each lobe: three on the right and two on the left.","i":"img/tb/v3_gray_199_160.jpg","iw":1000,"ih":695,"hl":[0.1443,0.2421,0.2674,0.2923],"a":"Gray's Anatomy for Students","c":""},{"w":"On this axial scan the branches of the left pulmonary artery are the vessels it sends into the left lung after arching over the left main bronchus, beside the lobar bronchi.","i":"img/tb/v3_moore_196_1509.jpg","iw":1000,"ih":769,"hl":[0.0607,0.6005,0.2106,0.6245],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.70","c":"(Continued) B. The left side of the mediastinum, the \u201cred side,\u201d is dominated by arterial structures: the arch of aorta and thoracic aorta, left common carotid"},{"w":"On this axial scan the branches of the right pulmonary artery are the vessels it sends into the right lung after crossing in front of the right main bronchus, beside the lobar bronchi.","i":"img/tb/v3_moore_145_1414.jpg","iw":1000,"ih":648,"hl":[0.0131,0.1296,0.1407,0.1913],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.37","c":"Pulmonary circulation"},{"w":"The cut edge of the diaphragm is where the dome was cut away to open the view, the muscle sheet separating the thoracic cavity above from the abdominal cavity below.","i":"img/tb/v3_moore_258_1617.jpg","iw":1000,"ih":1139,"hl":[0.0187,0.5821,0.1395,0.6073],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.33","c":"The esophagus and its relationships"},{"w":"The subepicardial space is the fat layer under the epicardium that carries the coronary vessels in the heart's grooves; on a chest film it shows as a dark stripe outlining the heart.","i":"img/tb/v3_gray_208_177.jpg","iw":882,"ih":980,"hl":[0.034,0.1691,0.2456,0.3133],"a":"Gray's Anatomy for Students, Fig. 3.53","c":"Sagittal section of the pericardium"},{"w":"On an arch angiogram the right vertebral artery is the first branch of the right subclavian artery, which comes off the brachiocephalic trunk, and climbs to the C6 transverse foramen.","i":"img/tb/v3_moore_1042_2539.jpg","iw":1000,"ih":625,"hl":[0.8366,0.0797,0.9489,0.1097],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.24","c":"Root of neck and prevertebral region"},{"w":"On this arch angiogram the right subclavian artery is the lateral branch of the brachiocephalic trunk, arching over the right lung apex toward the first rib.","i":"img/tb/v3_moore_1042_2539.jpg","iw":1000,"ih":625,"hl":[0.0122,0.5672,0.1923,0.5981],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.24","c":"Root of neck and prevertebral region"},{"w":"On this arch angiogram the right common carotid artery is the medial branch rising from the brachiocephalic trunk behind the right sternoclavicular joint, climbing beside the trachea.","i":"img/tb/v3_moore_192_1503.jpg","iw":872,"ih":945,"hl":[0.4359,0.0254,0.8976,0.0648],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.67","c":"Common pattern of branches of arch of aorta"},{"w":"On an arch angiogram the left vertebral artery is the first branch of the left subclavian artery, climbing up the neck to enter the C6 transverse foramen.","i":"img/tb/v3_moore_1042_2539.jpg","iw":1000,"ih":625,"hl":[0.8366,0.0797,0.9489,0.1097],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.24","c":"Root of neck and prevertebral region"},{"w":"On these arteriograms the catheter is the thin tube threaded through the aorta from a leg or arm artery, its tip seated in the origin of the artery being filled with contrast.","i":"img/tb/v3_moore_323_1754.jpg","iw":468,"ih":1081,"hl":[0.0513,0.8767,0.3131,0.9111],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.82","c":"Normal constrictions of ureters demonstrated by retro- grade pyelogram"},{"w":"On a coronary angiogram the septal branches are short, straight vessels leaving the anterior and posterior interventricular arteries at right angles to plunge into the interventricular septum.","i":"img/tb/v3_moore_175_1471.jpg","iw":794,"ih":847,"hl":[0.0308,0.5645,0.1968,0.6511],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.59","c":"Coronary arteries"},{"w":"On this right coronary angiogram the contrast in the ascending aorta is dye spilling back from the catheter tip at the right coronary origin, outlining the aortic root above the valve.","i":"img/tb/v3_gray_210_179.jpg","iw":1000,"ih":727,"hl":[0.1606,0.155,0.2768,0.1801],"a":"Gray's Anatomy for Students, Fig. 3.55","c":"Posterior portion of pericardia! sac showing reflections of serous pericardium"},{"w":"On a coronary angiogram the lateral (diagonal) arteries branch off the left anterior descending artery and run diagonally over the front of the left ventricle toward its lateral wall.","i":"img/tb/v3_gray_228_208.jpg","iw":1000,"ih":753,"hl":[0.7495,0.8103,0.8977,0.8369],"a":"Gray's Anatomy for Students, Fig. 3.72","c":"Left dominant coronary artery"},{"w":"On a coronary angiogram the posterior left ventricular artery runs over the diaphragmatic surface of the left ventricle, coming from the right coronary past the crux in right-dominant hearts."},{"w":"The right interlobar bronchus (bronchus intermedius) continues the right main bronchus below the upper lobe bronchus and splits into the middle and lower lobe bronchi.","i":"img/tb/v3_moore_194_1507.jpg","iw":1000,"ih":820,"hl":[0.0151,0.5596,0.1042,0.6112],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.69","c":"Deep dissection of superior mediastinum"},{"w":"The right upper lobe bronchus is the first branch of the right main bronchus, leaving about 2 cm below the carina and running above the right pulmonary artery.","i":"img/tb/v3_moore_143_1405.jpg","iw":1000,"ih":815,"hl":[0.0205,0.1524,0.2394,0.267],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.35","c":"Tracheobronchial tree and bronchopulmonary segments"},{"w":"On a chest or neck film the mandible is the U-shaped lower jaw at the top of the image, above the hyoid and in front of the upper cervical vertebrae.","i":"img/tb/v3_moore_1013_2495.jpg","iw":1000,"ih":552,"hl":[0.4516,0.5496,0.5261,0.5832],"a":"Moore's Clinically Oriented Anatomy, Fig. 8.3","c":"Bones and cartilages of neck"},{"w":"On this bronchogram the right middle lobar bronchus leaves the front of the interlobar (intermediate) bronchus and runs forward and outward into the middle lobe; only the right lung has one.","i":"img/tb/v3_moore_143_1405.jpg","iw":1000,"ih":815,"hl":[0.0205,0.3371,0.133,0.4517],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.35","c":"Tracheobronchial tree and bronchopulmonary segments"},{"w":"On this bronchogram the right lower lobar bronchus continues the interlobar (intermediate) bronchus below the middle lobar bronchus origin, running down and back into the right lower lobe.","i":"img/tb/v3_moore_143_1405.jpg","iw":1000,"ih":815,"hl":[0.0205,0.6331,0.133,0.7477],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.35","c":"Tracheobronchial tree and bronchopulmonary segments"},{"w":"The larynx is the air passage in the front of the neck from C3 to C6, between the pharynx above and the trachea below, seen on a neck film as an air column.","i":"img/tb/v3_gray_876_903.jpg","iw":1000,"ih":606,"hl":[0.9228,0.2831,0.982,0.3184],"a":"Gray's Anatomy for Students, Fig. 8.13","c":"Larynx and associated structures in the neck"},{"w":"Segmental (tertiary) bronchi branch from each lobar bronchus, one to each bronchopulmonary segment, running in the segment's center beside a segmental branch of the pulmonary artery.","i":"img/tb/v3_moore_143_1405.jpg","iw":1000,"ih":815,"hl":[0.0205,0.4895,0.1512,0.5659],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.35","c":"Tracheobronchial tree and bronchopulmonary segments"},{"w":"On a frontal chest film the carina is where the tracheal air column splits into the two main bronchi, at the sternal angle level (T4\u2013T5).","i":"img/tb/v3_gray_199_160.jpg","iw":1000,"ih":695,"hl":[0.7738,0.03,0.8366,0.0802],"a":"Gray's Anatomy for Students","c":""},{"w":"The descending (second) part of the duodenum runs down beside L1\u2013L3, around the pancreatic head, in front of the right kidney and right of the inferior vena cava.","i":"img/tb/v3_moore_294_1686.jpg","iw":1000,"ih":678,"hl":[0.0129,0.3468,0.2431,0.3759],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.59","c":"Spleen, pancreas, duodenum, and biliary ducts"},{"w":"The ascending (fourth) part of the duodenum rises along the left side of the aorta on left psoas to L2, turning forward as the duodenojejunal flexure.","i":"img/tb/v3_moore_271_1643.jpg","iw":1000,"ih":830,"hl":[0.8869,0.7102,0.9693,0.7873],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.45","c":"Relationships of duodenum"},{"w":"On an upright film or barium study the gastric fundus is the dome of the stomach rising above the cardia, tucked under the left hemidiaphragm, where swallowed air collects.","i":"img/tb/v3_moore_263_1627.jpg","iw":1000,"ih":822,"hl":[0.0233,0.0467,0.1269,0.0901],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.38","c":"The internal surface of the stomach"},{"w":"The body is the largest part of the stomach, between the fundus above and the pyloric antrum below, ending at the angular incisure on the lesser curvature.","i":"img/tb/v3_moore_262_1623.jpg","iw":1000,"ih":829,"hl":[0.8147,0.1723,0.8679,0.1998],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.37","c":"Abdominal part of esophagus and stomach"},{"w":"The pyloric antrum is the wide part of the stomach between the angular incisure and the narrow pyloric canal, tapering to the right toward the pylorus and duodenum.","i":"img/tb/v3_moore_262_1623.jpg","iw":1000,"ih":829,"hl":[0.0183,0.8344,0.1457,0.8622],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.37","c":"Abdominal part of esophagus and stomach"},{"w":"The pyloric sphincter is the thick ring of circular smooth muscle around the pyloric opening, at the sharp junction of the stomach with the duodenum.","i":"img/tb/v3_moore_262_1623.jpg","iw":1000,"ih":829,"hl":[0.9234,0.2973,0.9832,0.3521],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.37","c":"Abdominal part of esophagus and stomach"},{"w":"On a barium meal the pyloric canal is the short narrow channel between the wider pyloric antrum and the pyloric sphincter, leading into the duodenal cap.","i":"img/tb/v3_moore_263_1627.jpg","iw":1000,"ih":822,"hl":[0.0233,0.8481,0.0974,0.8915],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.38","c":"The internal surface of the stomach"},{"w":"On a barium meal the angular incisure is the sharp notch low on the stomach's lesser curvature, where the body ends and the pyloric part begins.","i":"img/tb/v3_moore_262_1623.jpg","iw":1000,"ih":829,"hl":[0.0173,0.7484,0.1602,0.7763],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.37","c":"Abdominal part of esophagus and stomach"},{"w":"On a barium meal the greater curvature is the stomach's long convex left and lower border, from cardiac notch to pylorus, where the greater omentum attaches.","i":"img/tb/v3_moore_262_1623.jpg","iw":1000,"ih":829,"hl":[0.823,0.852,0.9139,0.9068],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.37","c":"Abdominal part of esophagus and stomach"},{"w":"On a barium meal the lesser curvature is the short concave right border of the stomach, from the cardia to the pylorus, notched low down by the angular incisure.","i":"img/tb/v3_gray_335_344.jpg","iw":1000,"ih":921,"hl":[0.7182,0.1044,0.9839,0.1279],"a":"Gray's Anatomy for Students, Fig. 4.57","c":"Lesser omentum"},{"w":"The superior (first) part of the duodenum runs right and back from the pylorus at L1, with the bile duct, gastroduodenal artery and portal vein behind it.","i":"img/tb/v3_moore_294_1686.jpg","iw":1000,"ih":678,"hl":[0.0135,0.1613,0.218,0.1908],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.59","c":"Spleen, pancreas, duodenum, and biliary ducts"},{"w":"A peristaltic contraction is a moving ring of muscle squeeze; on a barium swallow or meal it shows as a smooth narrowing of the contrast column travelling along the esophagus or stomach."},{"w":"On a barium study the duodenojejunal flexure is the sharp bend at L2, just left of the spine and below the pancreas, where duodenum becomes jejunum.","i":"img/tb/v3_moore_272_1645.jpg","iw":1000,"ih":981,"hl":[0.0239,0.0703,0.2417,0.1433],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.47","c":"Jejunum and ileum"},{"w":"On a barium meal gastric rugae are the coarse, mostly lengthwise folds of the stomach lining, clearest when the stomach is empty and flattened when full."},{"w":"On an upright film the fundus is the dome of the stomach above the cardia, under the left diaphragm beside the spleen, holding the gastric air bubble.","i":"img/tb/v3_moore_258_1617.jpg","iw":1000,"ih":1139,"hl":[0.6275,0.7215,0.7372,0.7707],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.33","c":"The esophagus and its relationships"},{"w":"A hiatal hernia is part of the stomach pushed up through the esophageal hiatus into the chest, seen as a gas- or contrast-filled pouch above the diaphragm behind the heart.","i":"img/tb/v3_moore_284_1668.jpg","iw":1000,"ih":627,"hl":[0.2687,0.9129,0.7151,0.9656],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"On a pelvic film or cystogram the bladder is the rounded midline shadow just above the pubic symphysis, in front of the rectum, filled with contrast when opacified.","i":"img/tb/v3_moore_408_1914.jpg","iw":1000,"ih":752,"hl":[0.7356,0.3053,0.8764,0.3368],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.37","c":"Pelvic part of ureters, urinary bladder, seminal glands, terminal parts of ductus deferens, and prostate"},{"w":"On these barium enemas the semilunar folds are the crescent-shaped inward folds between neighboring haustra, making notches along the colon outline that do not cross the whole lumen.","i":"img/tb/v3_moore_277_1657.jpg","iw":1000,"ih":878,"hl":[0.5236,0.0332,0.6104,0.0834],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.52","c":"Terminal ileum and large intestine (including appendix)"},{"w":"Haustra are the pouches of the colon wall between the teniae coli; on a barium enema or abdominal film their folds indent the colon but do not cross its full width.","i":"img/tb/v3_moore_278_1658.jpg","iw":1000,"ih":512,"hl":[0.3524,0.1044,0.4269,0.143],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.53","c":"Terminal ileum, cecum, and appendix"},{"w":"On this oral cholecystogram the spiral valve is the twisting mucosal fold inside the gallbladder neck and cystic duct, giving the duct a beaded, corkscrew outline.","i":"img/tb/v3_moore_304_1712.jpg","iw":1000,"ih":835,"hl":[0.0153,0.3172,0.1172,0.3452],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.69","c":"Flow of blood and bile in liver"},{"w":"On a lumbar film L4 is the vertebra level with the tops of the iliac crests, with the aortic bifurcation in front of it and L5 sitting just below.","i":"img/tb/v3_moore_504_2125.jpg","iw":692,"ih":1046,"hl":[0.6751,0.0502,0.9087,0.0858],"a":"Moore's Clinically Oriented Anatomy","c":""},{"w":"On this aortogram the fourth lumbar arteries are the lowest paired branches from the back of the abdominal aorta, at L4 just above its bifurcation into the common iliac arteries.","i":"img/tb/v3_moore_501_2121.jpg","iw":1000,"ih":836,"hl":[0.0232,0.1945,0.1608,0.2793],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.25","c":"Blood supply of vertebrae"},{"w":"On this aortogram the first lumbar arteries are the highest of four paired branches from the back of the abdominal aorta, curving sideways around the L1 vertebral body.","i":"img/tb/v3_moore_501_2121.jpg","iw":1000,"ih":836,"hl":[0.0232,0.1945,0.1608,0.2793],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.25","c":"Blood supply of vertebrae"},{"w":"The median sacral artery leaves the back of the abdominal aorta just above its bifurcation at L4 and runs down the midline over L5, the sacrum and the coccyx.","i":"img/tb/v3_moore_387_1884.jpg","iw":1000,"ih":686,"hl":[0.7315,0.4523,0.8793,0.4797],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.21","c":"Nerves and nerve plexuses of pelvis"},{"w":"On these celiac and hepatic arteriograms the superior pancreaticoduodenal arteries run down from the gastroduodenal artery in the curve between the duodenum and pancreatic head.","i":"img/tb/v3_moore_265_1629.jpg","iw":1000,"ih":575,"hl":[0.3493,0.8985,0.5791,0.974],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.40","c":"Arteries of stomach, duodenum, and spleen"},{"w":"On a celiac angiogram the pancreatic arteries are the small branches dropping from the splenic artery into the pancreatic body and tail below it.","i":"img/tb/v3_moore_295_1691.jpg","iw":967,"ih":1025,"hl":[0.3969,0.0586,0.5497,0.1301],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.60","c":"Arterial supply and venous drainage of pancreas"},{"w":"On an angiogram the arterial arcades are loops joining neighbouring jejunal and ileal arteries in the mesentery, few and large for jejunum, many and small for ileum.","i":"img/tb/v3_moore_274_1650.jpg","iw":1000,"ih":788,"hl":[0.8367,0.5505,0.9744,0.5792],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.49","c":"Arterial supply and mesenteries of intestines"},{"w":"On a superior mesenteric angiogram the jejunal and ileal branches are the many arteries fanning from the left side of the superior mesenteric artery toward the small bowel.","i":"img/tb/v3_moore_274_1650.jpg","iw":1000,"ih":788,"hl":[0.8367,0.481,0.97,0.51],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.49","c":"Arterial supply and mesenteries of intestines"},{"w":"On a mesenteric angiogram the marginal artery is the continuous channel along the inner border of the colon, linking the colic branches of both mesenteric arteries.","i":"img/tb/v3_moore_279_1659.jpg","iw":1000,"ih":650,"hl":[0.4627,0.1641,0.5321,0.1942],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.54","c":"Arterial supply to intestines"},{"w":"On a pelvic angiogram the superior rectal artery continues the inferior mesenteric artery down to the rectum, while the middle and inferior rectal arteries come from internal iliac branches.","i":"img/tb/v3_gray_379_415.jpg","iw":1000,"ih":1221,"hl":[0.5728,0.8796,0.7207,0.8944],"a":"Gray's Anatomy for Students, Fig. 4.118","c":"Arterial supply to the abdominal parts of the gastrointestinal system and to the spleen"},{"w":"The superior vertebral notch is the shallow curve on the top edge of the pedicle; with the inferior notch of the vertebra above it forms the intervertebral foramen.","i":"img/tb/v3_moore_493_2104.jpg","iw":1000,"ih":703,"hl":[0.2862,0.0332,0.6182,0.084],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.14","c":"Lumbar vertebrae and IV discs"},{"w":"The inferior vertebral notch is the deep curve on the underside of the pedicle; with the superior notch of the vertebra below it forms the intervertebral foramen for the spinal nerve.","i":"img/tb/v3_gray_90_15.jpg","iw":885,"ih":1016,"hl":[0.4751,0.9421,0.8146,0.9764],"a":"Gray's Anatomy for Students, Fig. 2.12","c":"Intervertebral foramina"},{"w":"On this lateral lumbar film the body of L4 is level with the top of the iliac crest and the aortic bifurcation, one body above L5 resting on the sacrum.","i":"img/tb/v3_moore_471_2030.jpg","iw":1000,"ih":635,"hl":[0.0222,0.838,0.083,0.8896],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.2","c":"Typical vertebra, represented by the 2nd lumbar vertebra"},{"w":"On this lateral lumbar film the body of L1 is the highest lumbar body, just below T12 and the 12th ribs, at the level of the transpyloric plane.","i":"img/tb/v3_moore_471_2030.jpg","iw":1000,"ih":635,"hl":[0.0222,0.838,0.083,0.8896],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.2","c":"Typical vertebra, represented by the 2nd lumbar vertebra"},{"w":"The L3 intervertebral disc lies between the L3 and L4 vertebral bodies, seen on a lumbar film as the gap just above L4, at about the level of the umbilicus.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1345,0.2477,0.285,0.2801],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"The left 4th costal cartilage links the 4th rib to the sternal body, and at its level the left lung's anterior border swings out to form the cardiac notch.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"In an axial chest section pectoralis major is the thick superficial muscle on the front of the chest wall, under the breast and in front of pectoralis minor.","i":"img/tb/v3_moore_120_1353.jpg","iw":1000,"ih":637,"hl":[0.806,0.4076,0.9329,0.4384],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.16","c":"Super\ufb01 cial dissection of male pectoral region"},{"w":"The left 5th costal cartilage joins the 5th rib to the sternal body in front of the heart, just above the 5th intercostal space where the apex lies.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"In axial sections the intercostal muscle is the thin band bridging neighbouring rib cuts around the chest wall, its external, internal and innermost layers blended into one.","i":"img/tb/v3_gray_180_138.jpg","iw":1000,"ih":807,"hl":[0.0485,0.0192,0.4545,0.063],"a":"Gray's Anatomy for Students, Fig. 3.27","c":"Intercostal muscles"},{"w":"The T9\u2013T10 disc lies between the T9 and T10 vertebral bodies, just above the esophageal hiatus level, with the descending aorta and azygos vein in front of it.","i":"img/tb/v3_moore_106_1333.jpg","iw":1000,"ih":681,"hl":[0.1345,0.2477,0.285,0.2801],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.5","c":"Costovertebral articulations of a typical rib"},{"w":"Latissimus dorsi is the broad flat muscle over the lower back and posterior axillary fold, superficial to serratus anterior and the lower ribs, inserting in the humerus's intertubercular groove.","i":"img/tb/v3_moore_732_2254.jpg","iw":1000,"ih":1136,"hl":[0.6135,0.0204,0.9483,0.0823],"a":"Moore's Clinically Oriented Anatomy, Fig. 6.26","c":"Latissimus dorsi"},{"w":"In these upper abdominal sections the adipose tissue is the fat packed around the abdominal esophagus and stomach, in the omenta between the stomach, liver, spleen and diaphragm."},{"w":"The muscular part of the diaphragm is the outer ring of muscle arising from the xiphoid, the lower six ribs and the lumbar vertebrae, converging on the central tendon.","i":"img/tb/v3_moore_139_1397.jpg","iw":1000,"ih":589,"hl":[0.0133,0.8559,0.1014,0.9001],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.32","c":"Diaphragm, base of pulmonary cavities and mediastinum, and costodiaphragmatic recesses"},{"w":"The gastric vessels run along the stomach's curvatures inside the omenta: left and right gastric along the lesser curvature, gastro-omental and short gastric along the greater curvature.","i":"img/tb/v3_gray_373_408.jpg","iw":1000,"ih":797,"hl":[0.4462,0.0657,0.5829,0.091],"a":"Gray's Anatomy for Students, Fig. 4.113","c":"Arterial supply to the pancreas"},{"w":"The 7th costal cartilage is the last one to reach the sternum directly, joining it at the xiphisternal junction and starting the costal margin.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"In axial sections the diaphragmatic crura are the muscle bands hugging each side of the aorta on the upper lumbar vertebrae; the right crus also encircles the esophagus.","i":"img/tb/v3_gray_132_81.jpg","iw":1000,"ih":1011,"hl":[0.2739,0.0145,0.4368,0.0478],"a":"Gray's Anatomy for Students, Fig. 2.52","c":"Arrangement of structures in the vertebral canal and the back (lumbar region)"},{"w":"In an upper abdominal axial section the fundus and body of the stomach sit in the left upper quadrant under the left hemidiaphragm, in front of the spleen and left kidney.","i":"img/tb/v3_moore_263_1627.jpg","iw":1000,"ih":822,"hl":[0.0233,0.0467,0.1269,0.0901],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.38","c":"The internal surface of the stomach"},{"w":"The cardiac region (cardia) of the stomach surrounds the esophageal opening, left of T11, below and right of the fundus and behind the left lobe of the liver.","i":"img/tb/v3_moore_262_1623.jpg","iw":1000,"ih":829,"hl":[0.6123,0.1429,0.6788,0.1708],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.37","c":"Abdominal part of esophagus and stomach"},{"w":"These gastric blood vessels are the small vessels cut in the fat beside the stomach's greater curvature, the short gastric and left gastro-omental branches of the splenic vessels.","i":"img/tb/v3_gray_373_408.jpg","iw":1000,"ih":797,"hl":[0.5088,0.0174,0.6708,0.0424],"a":"Gray's Anatomy for Students, Fig. 4.113","c":"Arterial supply to the pancreas"},{"w":"The posterior intercostal artery comes off the thoracic aorta and runs with its vein and nerve in the costal groove under each rib, in vein-artery-nerve order from top down.","i":"img/tb/v3_moore_123_1359.jpg","iw":1000,"ih":1089,"hl":[0.0234,0.4205,0.1736,0.4859],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.19","c":"Arteries of thoracic wall"},{"w":"The falciform ligament attaches the front and upper surface of the liver to the anterior abdominal wall and diaphragm, marking the line between the anatomical right and left lobes.","i":"img/tb/v3_moore_256_1611.jpg","iw":1000,"ih":1124,"hl":[0.0237,0.1635,0.1535,0.2274],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.31","c":"Abdominal contents in situ and in relation to alimentary system"},{"w":"In axial sections the fissure for the ligamentum venosum is the deep cleft between the caudate lobe behind and left lobe in front, where the lesser omentum attaches.","i":"img/tb/v3_gray_357_383.jpg","iw":1000,"ih":602,"hl":[0.7162,0.9026,0.9053,0.9735],"a":"Gray's Anatomy for Students","c":""},{"w":"The 7th rib's costal cartilage is the lowest to reach the sternum, joining beside the xiphoid at the xiphisternal joint and curving down to start the costal margin.","i":"img/tb/v3_moore_102_1325.jpg","iw":1000,"ih":852,"hl":[0.7221,0.5064,0.8687,0.534],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.1","c":"Thoracic skeleton"},{"w":"In this axial section the anterior (superior) border of the spleen is its sharp, often notched front edge, between the diaphragmatic surface and the gastric impression, pointing toward the stomach.","i":"img/tb/v3_moore_272_1644.jpg","iw":1000,"ih":976,"hl":[0.9149,0.2317,0.9835,0.2577],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.46","c":"Lymphatic drainage and innervation of duodenum, pancreas, and spleen"},{"w":"The 7th costal cartilage is the last to reach the sternum, joining it at the xiphisternal joint, and forms the top of the costal margin as it sweeps down and out.","i":"img/tb/v3_moore_258_1617.jpg","iw":1000,"ih":1139,"hl":[0.0221,0.4851,0.1348,0.5343],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.33","c":"The esophagus and its relationships"},{"w":"The sternal part of the diaphragm is two small slips from the back of the xiphoid process, running back to the central tendon just under the heart.","i":"img/tb/v3_moore_335_1778.jpg","iw":1000,"ih":704,"hl":[0.1669,0.0883,0.2834,0.1236],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.91","c":"Attachments, disposition, and features of the abdominal aspect of the diaphragm"},{"w":"The costal part of the diaphragm arises from the inner surfaces of the lower six ribs and costal cartilages, curving up between the lung bases and the liver and spleen.","i":"img/tb/v3_moore_139_1397.jpg","iw":1000,"ih":589,"hl":[0.0133,0.8559,0.1014,0.9001],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.32","c":"Diaphragm, base of pulmonary cavities and mediastinum, and costodiaphragmatic recesses"},{"w":"In axial sections the fissure for the ligamentum teres is the cleft on the liver's underside between the left and quadrate lobes, continuous with the falciform ligament.","i":"img/tb/v3_moore_299_1707.jpg","iw":1000,"ih":736,"hl":[0.023,0.4729,0.2887,0.5682],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.65","c":"Visceral surface of the liver"},{"w":"In this section the common hepatic duct is the small duct at the porta hepatis, between the quadrate lobe in front and the portal vein behind it.","i":"img/tb/v3_moore_308_1722.jpg","iw":1000,"ih":347,"hl":[0.2793,0.4086,0.3948,0.5097],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.74","c":"Variation in origin and course of cystic artery"},{"w":"In upper abdominal sections the left and right costal margins are the cartilage cuts at the front of each side, formed by costal cartilages 7 to 10.","i":"img/tb/v3_moore_118_1347.jpg","iw":1000,"ih":711,"hl":[0.8111,0.7651,0.9252,0.7954],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.13","c":"Dissection of anterior aspect of anterior thoracic wall"},{"w":"T12 is the last thoracic vertebra and carries the 12th ribs, with the aortic hiatus of the diaphragm in front of it and the upper poles of the kidneys beside it.","i":"img/tb/v3_moore_138_1395.jpg","iw":1000,"ih":742,"hl":[0.7685,0.8641,0.8902,0.8931],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.31","c":"Relationship of thoracic contents and linings of thoracic cage"},{"w":"The hepatic artery leaves the celiac trunk, runs right along the top of the pancreas, then climbs in the hepatoduodenal ligament beside the bile duct, in front of the portal vein.","i":"img/tb/v3_gray_374_409.jpg","iw":1000,"ih":880,"hl":[0.3983,0.0186,0.5774,0.0453],"a":"Gray's Anatomy for Students, Fig. 4.114","c":"Distribution of the common hepatic artery"},{"w":"In axial sections the right adrenal gland sits behind the inferior vena cava above the right kidney; the left lies medial to the upper left kidney, beside the left crus.","i":"img/tb/v3_moore_326_1759.jpg","iw":858,"ih":1038,"hl":[0.7895,0.0289,0.972,0.096],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.86","c":"Lymphatics of kidneys and suprarenal glands"},{"w":"In an axial section the left kidney lies lateral to psoas major and in front of quadratus lumborum, behind the spleen and the tail of the pancreas.","i":"img/tb/v3_moore_255_1609.jpg","iw":1000,"ih":684,"hl":[0.154,0.3769,0.2435,0.4084],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.30","c":"Overview of thoracic and abdominal viscera"},{"w":"In an axial section the perirenal fat is the fat packed directly around the kidney and suprarenal gland, inside the thin line of the renal fascia.","i":"img/tb/v3_gray_403_443.jpg","iw":1000,"ih":641,"hl":[0.3531,0.2075,0.4674,0.2389],"a":"Gray's Anatomy for Students, Fig. 4.140","c":"Organization of fat and fascia surrounding the kidney"},{"w":"The transverse colon hangs on the transverse mesocolon below the stomach, and the greater omentum drapes down from the greater curvature in front of it, fused to its front surface.","i":"img/tb/v3_moore_250_1604.jpg","iw":1000,"ih":764,"hl":[0.8455,0.5688,0.9753,0.5942],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.26","c":"Parts of greater and lesser omenta"},{"w":"The middle colic vein drains the transverse colon, running in the transverse mesocolon to join the superior mesenteric vein in front of the head of the pancreas.","i":"img/tb/v3_moore_281_1661.jpg","iw":965,"ih":1124,"hl":[0.0265,0.2069,0.1331,0.3038],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.56","c":"Veins, lymph nodes, and nerves of large intestine"},{"w":"The intestinal branches are the jejunal and ileal arteries that leave the left side of the superior mesenteric artery and run in the mesentery to the small intestine loops.","i":"img/tb/v3_gray_376_411.jpg","iw":1000,"ih":1065,"hl":[0.758,0.5411,0.8614,0.5573],"a":"Gray's Anatomy for Students, Fig. 4.116","c":"Superior mesenteric artery"},{"w":"The jejunal vessels run in the mesentery between the superior mesenteric artery and vein and the jejunal loops in the left upper abdomen, below the transverse mesocolon.","i":"img/tb/v3_gray_376_411.jpg","iw":1000,"ih":1065,"hl":[0.758,0.5411,0.8614,0.5573],"a":"Gray's Anatomy for Students, Fig. 4.116","c":"Superior mesenteric artery"},{"w":"Spinal nerve roots run down the vertebral canal from the cord to their exit foramina; below the conus medullaris at L1\u2013L2 they form the cauda equina inside the dural sac.","i":"img/tb/v3_gray_423_467.jpg","iw":1000,"ih":903,"hl":[0.5754,0.0721,0.6773,0.0937],"a":"Gray's Anatomy for Students, Fig. 4.158","c":"Nerve fibers passing through the abdominal prevertebral plexus and ganglia"},{"w":"In an axial section the renal fascia is the thin line wrapping the kidney, suprarenal gland and perirenal fat, with the pararenal fat lying outside it.","i":"img/tb/v3_gray_403_443.jpg","iw":1000,"ih":641,"hl":[0.0395,0.4323,0.1367,0.4637],"a":"Gray's Anatomy for Students, Fig. 4.140","c":"Organization of fat and fascia surrounding the kidney"},{"w":"The renal sinus is the fat-filled cavity inside the kidney, opening at the hilum, that holds the renal pelvis, the calyces and branches of the renal vessels.","i":"img/tb/v3_moore_322_1751.jpg","iw":1000,"ih":695,"hl":[0.5172,0.2557,0.5549,0.2823],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.80","c":"External and internal appearance of kidneys"},{"w":"The conus medullaris is the tapered end of the spinal cord in the vertebral canal at L1\u2013L2, the level of the renal vessels, with cauda equina roots around it.","i":"img/tb/v3_moore_532_2181.jpg","iw":901,"ih":2477,"hl":[0.6575,0.5996,0.932,0.6146],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.46","c":"Arterial supply of spinal cord"},{"w":"In axial sections the right renal vein is the short, wide vein running straight from the right renal hilum, in front of the renal artery, into the inferior vena cava.","i":"img/tb/v3_gray_405_445.jpg","iw":1000,"ih":642,"hl":[0.1856,0.949,0.3016,0.9785],"a":"Gray's Anatomy for Students, Fig. 4.142","c":"Renal vasculature"},{"w":"The dorsal and ventral roots of each spinal nerve leave the cord inside the vertebral canal and join in the intervertebral foramen, between the pedicles of neighbouring vertebrae.","i":"img/tb/v3_moore_530_2176.jpg","iw":1000,"ih":921,"hl":[0.7433,0.7545,0.9768,0.8312],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.43","c":"Spinal cord within its meninges"},{"w":"In an axial section the pararenal fat is the fat outside the renal fascia, thickest behind and lateral to the kidney, in front of quadratus lumborum and psoas.","i":"img/tb/v3_moore_320_1748.jpg","iw":1000,"ih":488,"hl":[0.6907,0.5737,0.986,0.6179],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.77","c":"Lumbar approach to kidney and musculofascial relationships of kidney"},{"w":"In these lower abdominal sections the aponeuroses are the flat tendon sheets of the three flat muscles, running forward to form the rectus sheath and meeting at the linea alba."},{"w":"In axial sections the erector spinae is the thick muscle column on each side of the spinous processes, behind the transverse processes and rib angles, deep to trapezius and latissimus dorsi.","i":"img/tb/v3_moore_515_2156.jpg","iw":741,"ih":490,"hl":[0.8044,0.3546,0.9557,0.5057],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.31","c":"Intermediate layer of intrinsic back muscles (erector spinae muscles)"},{"w":"In these lower lumbar sections the cauda equina is the bundle of nerve roots filling the vertebral canal below the conus medullaris, floating in cerebrospinal fluid inside the dural sac.","i":"img/tb/v3_gray_135_84.jpg","iw":1000,"ih":2104,"hl":[0.157,0.7263,0.3301,0.7492],"a":"Gray's Anatomy for Students, Fig. 2.54","c":"Course of spinal nerves in the vertebral canal"},{"w":"The superior articular process of L5 rises from the L5 pedicle-lamina junction, in front of and lateral to the L4 inferior articular process at the L4\u2013L5 facet joint.","i":"img/tb/v3_moore_106_1332.jpg","iw":1000,"ih":730,"hl":[0.8288,0.6552,0.9821,0.7179],"a":"Moore's Clinically Oriented Anatomy, Fig. 1.4","c":"Thoracic vertebrae"},{"w":"The facet joint is the synovial joint between the inferior articular process of one vertebra and the superior articular process of the vertebra below, just behind the intervertebral foramen.","i":"img/tb/v3_moore_496_2111.jpg","iw":1000,"ih":1039,"hl":[0.684,0.4472,0.9532,0.482],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.19","c":"Innervation of zygapophysial joints"},{"w":"The inferior articular process of L4 hangs down behind the L4\u2013L5 disc and sits behind and medial to the superior articular process of L5, forming the L4\u2013L5 facet joint.","i":"img/tb/v3_gray_170_123.jpg","iw":940,"ih":768,"hl":[0.1213,0.8972,0.4698,0.9687],"a":"Gray's Anatomy for Students, Fig. 3.18","c":"Typical thoracic vertebra"},{"w":"The retroperitoneal space lies behind the posterior parietal peritoneum and in front of the back muscles, holding the kidneys, adrenals, aorta, inferior vena cava and most of the duodenum and pancreas.","i":"img/tb/v3_gray_288_285.jpg","iw":1000,"ih":860,"hl":[0.29,0.6654,0.4823,0.6879],"a":"Gray's Anatomy for Students, Fig. 4.7","c":"A series showing the progression (A to C) from an intraperitoneal organ to a secondarily retroperitoneal organ"},{"w":"Gluteus medius lies on the outer surface of the iliac wing, between gluteus maximus behind it and gluteus minimus deep to it, and inserts on the greater trochanter.","i":"img/tb/v3_moore_513_2151.jpg","iw":1000,"ih":1147,"hl":[0.771,0.8402,0.8922,0.8577],"a":"Moore's Clinically Oriented Anatomy, Fig. 4.29","c":"Super\ufb01 cial and intermediate layers of intrinsic back muscles: splenius and erector spinae"},{"w":"In this low axial section the left iliac ala is the broad bony wing at the left side of the pelvis, with iliacus inside it and the gluteal muscles outside.","i":"img/tb/v3_moore_358_1828.jpg","iw":1000,"ih":746,"hl":[0.7751,0.1393,0.9065,0.181],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.2","c":"Pelvic girdle"},{"w":"The lumbar plexus forms from the L1\u2013L4 ventral rami inside the psoas major muscle, in front of the lumbar transverse processes, and its branches leave around the psoas edges.","i":"img/tb/v3_moore_236_1581.jpg","iw":1000,"ih":730,"hl":[0.0753,0.2877,0.1845,0.3142],"a":"Moore's Clinically Oriented Anatomy, Fig. 2.19","c":"Arterial supply and lymphatic drainage of testis and scrotum; innervation of scrotum"},{"w":"Retroperitoneal fat packs the space behind the posterior parietal peritoneum, surrounding the kidneys, aorta and inferior vena cava, in front of psoas major and quadratus lumborum."},{"w":"The sacral promontory is the jutting front upper edge of the S1 body, forming the back of the pelvic inlet, with the median sacral vessels running down in front of it.","i":"img/tb/v3_moore_362_1837.jpg","iw":946,"ih":944,"hl":[0.0457,0.4323,0.2168,0.51],"a":"Moore's Clinically Oriented Anatomy, Fig. 3.5","c":"Sacro-iliac joints and pubic symphysis with associated ligaments"},{"w":"In axial sections the external oblique aponeurosis is the thin white
