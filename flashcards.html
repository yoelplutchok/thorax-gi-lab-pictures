<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thorax &amp; GI Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* One card at a time: picture on top, question, reveal, then a closed "where is it" drawer with a specimen photo. */
:root {
  --bg: #eceff2; --surface: #ffffff; --ink: #18212b; --muted: #5b6875; --line: #d3d9df;
  --accent: #1d5b86; --accent-ink: #ffffff; --tape: #f0a637; --tape-2: #e4952a; --tape-edge: #b86e0e; --chip: #e2e7ec;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #10151a; --surface: #172029; --ink: #e5eaee; --muted: #94a2ae; --line: #2a3541;
    --accent: #6eaedb; --accent-ink: #0d1217; --chip: #202b36; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #10151a; --surface: #172029; --ink: #e5eaee; --muted: #94a2ae; --line: #2a3541;
  --accent: #6eaedb; --accent-ink: #0d1217; --chip: #202b36; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); margin: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 8px; display: grid; gap: 8px; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { font: 700 1.3rem/1.1 var(--f-display); margin-right: auto; }
.brand small { display: block; font: 500 .8rem/1.3 var(--f-body); color: var(--muted); }
.brand a { color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 6px; }
.chips { display: flex; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .85rem; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips .c { font-weight: 500; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 60px; display: grid; gap: 12px; }
.nav { display: flex; align-items: center; gap: 10px; }
.nav .pos { font: 600 1rem var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); margin: 0 auto; }
.card { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stage { position: relative; margin: 0 auto; background: #fff; }
.stage img { display: block; width: 100%; height: auto; }
.cover { position: absolute; display: grid; place-items: center; border: 1px solid var(--tape-edge); border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--tape) 0 9px, var(--tape-2) 9px 18px); color: #3a2a08; font-weight: 700; font-size: .8rem; }
.cover.open { background: rgba(255, 230, 0, .25); border: 3px solid #e0262f; color: transparent; }
.src { font-size: .78rem; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--line); }
.grp { margin: 0; font: 600 .95rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.grp span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 6px; }
.q { margin: 0; font: 600 1.1rem/1.3 var(--f-display); }
.ans { display: flex; align-items: center; gap: 14px; min-height: 44px; }
.name { margin: 0; font: 700 1.6rem/1.15 var(--f-display); }
.where { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.where > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; display: flex; gap: 8px; align-items: center; }
.where > summary::-webkit-details-marker { display: none; }
.where > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
.where[open] > summary::before { transform: rotate(45deg); }
.where .body { padding: 0 14px 14px; display: grid; gap: 12px; }
.where .tx { margin: 0; max-width: 70ch; font-size: 1rem; }
.where figure { margin: 0; }
.where figure img { display: block; max-width: 100%; max-height: 70vh; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.where figcaption { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.keys { font-size: .8rem; color: var(--muted); }
.keys kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 600 .75rem var(--f-body); background: var(--surface); }
@media (prefers-reduced-motion: reduce) { .where > summary::before { transition: none; } }
</style>
</head>
<body>


<header class="bar">
  <div class="bar-in">
    <div class="row1">
      <div class="brand">Thorax &amp; GI flashcards<small><span id="summary"></span> &middot; <a href="index.html">labelled pictures</a></small></div>
      <button class="btn" id="shuffle" type="button">Shuffle</button>
      <button class="btn" id="restart" type="button">Start over</button>
    </div>
    <div class="filters">
      <label>Region <select id="region"></select></label>
      <label>Jump to <select id="group"></select></label>
      <div class="chips" id="kinds" role="group" aria-label="Picture type"></div>
    </div>
  </div>
</header>
<main>
  <div class="nav">
    <button class="btn" id="prev" type="button">&larr; Prev</button>
    <span class="pos" id="pos"></span>
    <button class="btn" id="next" type="button">Next &rarr;</button>
  </div>
  <p class="grp" id="grp"></p>
  <figure class="card" id="card">
    <div class="stage" id="stage"><img id="front" alt=""></div>
    <figcaption class="src" id="src"></figcaption>
  </figure>
  <p class="q" id="q"></p>
  <div class="ans">
    <button class="btn primary" id="reveal" type="button">Show answer</button>
    <h2 class="name" id="name" hidden></h2>
  </div>
  <details class="where" id="where">
    <summary>Where is it? <span class="keys">&middot; plus a real specimen photo</span></summary>
    <div class="body">
      <p class="tx" id="wtx"></p>
      <figure id="cadfig"><img id="cad" alt=""><figcaption id="cadcap"></figcaption></figure>
    </div>
  </details>
  <p class="keys"><kbd>Space</kbd> show answer, then next &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> previous / next &nbsp; <kbd>W</kbd> where is it</p>
</main>

<script>
const DATA = {"regions":[["thwall","Thoracic wall & bony thorax"],["lungs","Lungs, pleura & airways"],["mediast","Mediastinum & great vessels"],["heart","Heart & coronary vessels"],["abwall","Abdominal wall"],["foregut","Stomach, duodenum & peritoneum"],["liver","Liver, gallbladder, pancreas & spleen"],["gut","Small & large intestine"],["retro","Kidneys & posterior abdominal wall"]],"cards":[{"k":"clavicle","n":"Clavicle","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_102_1325.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.1","hl":[0.5093,0.9488,0.5808,0.9766],"w":"On a frontal chest film the clavicle crosses the top of the chest from the manubrium to the acromion, above and in front of the first rib.","c":"img/fc_cad/bl_BL-1586732782915.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Clavicle\" label","g":"Clavicle and sternum","fw":1000,"fh":852,"cw":1100,"ch":825},{"k":"sternum","n":"Sternum","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_102_1325.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.1","hl":[0.7213,0.2447,0.9257,0.2725],"w":"The sternum is the flat midline bone of the front chest wall, made of manubrium, body and xiphoid, with costal cartilages 1\u20137 at its sides and the heart behind.","c":"img/na_CSAAB3_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 3: Musculoskeletal","g":"Clavicle and sternum","fw":1000,"fh":852,"cw":1400,"ch":783},{"k":"manubrium","n":"Manubrium (of sternum)","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_107_1334.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.6","hl":[0.5002,0.2863,0.6599,0.321],"w":"The manubrium is the top part of the sternum, between the clavicles at T3 to T4, with the jugular notch above and the left brachiocephalic vein behind it.","c":"img/zs_S07-s518.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 518","g":"Clavicle and sternum","fw":1000,"fh":1028,"cw":599,"ch":1040},{"k":"jugular notch","n":"Jugular (suprasternal) notch","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_107_1334.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.6","hl":[0.4005,0.0216,0.5787,0.0552],"w":"The jugular notch is the midline dip on top of the manubrium, between the two clavicular notches, level with T2 and with the trachea right behind it.","c":"img/zs_S07-s522.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 522","g":"Clavicle and sternum","fw":1000,"fh":1028,"cw":599,"ch":1040},{"k":"new:clavicular notch of manubrium","n":"Clavicular notch of manubrium","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_107_1334.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.6","hl":[0.804,0.0216,0.934,0.0873],"w":"The clavicular notches are the shallow sockets on each upper corner of the manubrium, beside the jugular notch, where the medial ends of the clavicles form the sternoclavicular joints.","c":"img/zs_S07-s520.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 520","g":"Clavicle and sternum","fw":1000,"fh":1028,"cw":599,"ch":1040},{"k":"new:articular disc","n":"Articular Disc","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_834_2456.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 6.104","hl":[0.5465,0.964,0.7525,0.9861],"w":"In this upper thoracic section the articular disc is the fibrocartilage disc inside the sternoclavicular joint, between the medial end of the clavicle and the manubrium's clavicular notch.","c":"img/na_CSATH3_0.jpg","cc":"NetAnatomy Thorax cross-section, level 3: Musculoskeletal","g":"Clavicle and sternum","fw":995,"fh":1725,"cw":1400,"ch":758},{"k":"new:costal notch for first rib","n":"Costal notch for first rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_107_1334.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.6","hl":[0.7499,0.427,0.8536,0.4926],"w":"The costal notch for the first rib is the depression on the upper side edge of the manubrium, just below the clavicular notch, where the 1st costal cartilage attaches.","c":"img/zs_S07-s524.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 524","g":"Clavicle and sternum","fw":1000,"fh":1028,"cw":599,"ch":1040},{"k":"sternal angle","n":"Sternal angle (manubriosternal joint)","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_159_1439.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.44","hl":[0.7653,0.2592,0.947,0.287],"w":"The sternal angle is the ridge at the joint between manubrium and sternal body where the second costal cartilages attach, level with the T4\u2013T5 disc.","c":"img/zs_S07-s526.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 526","g":"Clavicle and sternum","fw":1000,"fh":818,"cw":599,"ch":1040},{"k":"body of sternum","n":"Body of sternum","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_102_1325.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.1","hl":[0.7213,0.4507,0.8759,0.4786],"w":"The body of the sternum runs from the sternal angle to the xiphisternal joint at T9, with notches on its sides for costal cartilages 2 through 7.","c":"img/na_CSATH13_0.jpg","cc":"NetAnatomy Thorax cross-section, level 13: Musculoskeletal","g":"Clavicle and sternum","fw":1000,"fh":852,"cw":1400,"ch":764},{"k":"xiphoid process","n":"Xiphoid process","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_gray_150_102.jpg","s":"Gray's Anatomy for Students","hl":[0.8034,0.7325,0.9465,0.7648],"w":"The xiphoid process is the small lowest part of the sternum, below the sternal body at the xiphisternal joint (level with T9), where the two costal margins meet.","c":"img/zs_S07-s530.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 530","g":"Clavicle and sternum","fw":1000,"fh":1085,"cw":599,"ch":1040},{"k":"rib","n":"Rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_gray_150_102.jpg","s":"Gray's Anatomy for Students","hl":[0.0182,0.6138,0.064,0.6461],"w":"Each rib curves from its thoracic vertebra around the chest wall to a costal cartilage; on a chest film the back parts lie flatter and the front parts slope down.","c":null,"cc":null,"g":"Ribs, first to twelfth","fw":1000,"fh":1085},{"k":"first rib","n":"First rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_750_2300.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 6.43","hl":[0.8067,0.7152,0.8491,0.7419],"w":"The first rib is the short, flat, tightly curved rib just under the clavicle, joining T1 and the manubrium, with the subclavian vein and artery crossing its top.","c":"img/fc_cad/bl_BL-1586739768015.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"1st rib, cut\" label","g":"Ribs, first to twelfth","fw":1000,"fh":680,"cw":1100,"ch":825},{"k":"second rib","n":"Second rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_104_1331.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.3","hl":[0.2252,0.1532,0.2878,0.1753],"w":"The second rib lies just below the first rib, and its costal cartilage meets the sternum at the sternal angle, which makes it the starting point for counting ribs.","c":"img/na_CSATH7_0.jpg","cc":"NetAnatomy Thorax cross-section, level 7: Musculoskeletal","g":"Ribs, first to twelfth","fw":1000,"fh":1025,"cw":1400,"ch":749},{"k":"new:3rd rib","n":"3rd Rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_102_1326.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.1","hl":[0.1336,0.881,0.2592,0.9377],"w":"The 3rd rib is one below the 2nd rib at the sternal angle; its cartilage joins the upper sternal body, and pectoralis minor arises from its front.","c":"img/na_CSATH8_0.jpg","cc":"NetAnatomy Thorax cross-section, level 8: Musculoskeletal","g":"Ribs, first to twelfth","fw":1000,"fh":929,"cw":1400,"ch":725},{"k":"fourth rib","n":"Fourth rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_138_1395.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.31","hl":[0.014,0.3383,0.066,0.3673],"w":"Find the fourth rib by counting down from the second rib at the sternal angle, or the first on a film; the right lung's horizontal fissure follows it.","c":"img/na_CSATH8_0.jpg","cc":"NetAnatomy Thorax cross-section, level 8: Musculoskeletal","g":"Ribs, first to twelfth","fw":1000,"fh":742,"cw":1400,"ch":725},{"k":"fifth rib","n":"Fifth rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_195_1508.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.70","hl":[0.1821,0.2921,0.2265,0.3157],"w":"Find the fifth rib by counting down from the first rib on a film, or the second at the sternal angle; the heart apex lies just below it.","c":"img/na_CSATH13_0.jpg","cc":"NetAnatomy Thorax cross-section, level 13: Musculoskeletal","g":"Ribs, first to twelfth","fw":1000,"fh":781,"cw":1400,"ch":764},{"k":"new:6th rib","n":"6th Rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_113_1343.jpg","s":"Moore's Clinically Oriented Anatomy","hl":[0.0775,0.6969,0.1253,0.7296],"w":"The 6th rib is the second-lowest true rib; its cartilage joins the lower sternal body just above the xiphoid and gives attachment to rectus abdominis.","c":"img/na_CSATH13_0.jpg","cc":"NetAnatomy Thorax cross-section, level 13: Musculoskeletal","g":"Ribs, first to twelfth","fw":1000,"fh":606,"cw":1400,"ch":764},{"k":"new:7th rib","n":"7th Rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_102_1326.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.1","hl":[0.1342,0.5102,0.1982,0.5387],"w" 331.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.3","hl":[0.187,0.6793,0.2551,0.7011],"w":"On a radiograph the eleventh rib is the second-lowest rib, a short floating rib whose free front tip ends in the flank muscles without reaching the costal margin.","c":null,"cc":null,"g":"Ribs, first to twelfth","fw":1000,"fh":1025},{"k":"twelfth rib","n":"Twelfth (12th) rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_104_1331.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.3","hl":[0.2285,0.8815,0.2965,0.9033],"w":"The twelfth rib is the short lowest floating rib, joined only to T12 and ending free in the posterior abdominal wall muscles, with quadratus lumborum attached to its lower border.","c":"img/ta_S06-q34.jpg","cc":"2020 TA mock practical, question 34","g":"Ribs, first to twelfth","fw":1000,"fh":1025,"cw":1400,"ch":1127},{"k":"thoracic vertebra","n":"Thoracic vertebra","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_102_1326.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.1","hl":[0.5216,0.0186,0.7304,0.0471],"w":"The twelve thoracic vertebrae lie between the cervical and lumbar spine, and each is recognized by its heart-shaped body and facets where the ribs' heads and tubercles attach.","c":"img/zs_S07-s544.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 544","g":"Thoracic vertebrae, discs and the T4 level","fw":1000,"fh":929,"cw":1400,"ch":938},{"k":"vertebral body","n":"Vertebral body","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_494_2107.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 4.16","hl":[0.1476,0.5329,0.2171,0.5618],"w":"The vertebral body is the thick, round, weight-bearing front block of each vertebra, in front of the vertebral canal and stacked between intervertebral discs; thoracic bodies carry the rib heads.","c":null,"cc":null,"g":"Thoracic vertebrae, discs and the T4 level","fw":99 ],"w":"The head of a rib is its back end, medial to the neck and tubercle, with two facets for its own vertebral body and the one above.","c":"img/zs_S07-s532.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 532","g":"Back of a rib and its joints with the vertebra","fw":1000,"fh":681,"cw":1400,"ch":1063},{"k":"new:head of the 6th rib","n":"Head of the 6th Rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_109_1337.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.8","hl":[0.7288,0.7032,0.9136,0.7639],"w":"The head of the 6th rib articulates with the T5 and T6 vertebral bodies and the disc between them, just in front of the T6 transverse process.","c":"img/na_CSATH8_0.jpg","cc":"NetAnatomy Thorax cross-section, level 8: Musculoskeletal","g":"Back of a rib and its joints with the vertebra","fw":1000,"fh":540,"cw":1400,"ch":725},{"k":"new:articular facet of head of rib","n":"Articular facet of head of rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_104_1331.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.3","hl":[0.2035,0.3768,0.2704,0.4186],"w":"The head of a typical rib carries two facets, split by a crest, that meet the body of its own vertebra and the vertebra above at the costovertebral joint.","c":"img/zs_S07-s536.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 536","g":"Back of a rib and its joints with the vertebra","fw":1000,"fh":1025,"cw":1400,"ch":1055},{"k":"joint of head of rib","n":"Joint of head of rib","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_moore_106_1333.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.5","hl":[0.0161,0.2763,0.0848,0.3713],"w":"The joint of the head of a rib is where the rib head meets two neighbouring thoracic vertebral bodies and the disc between them, medial to the costotransverse joint.","c":"img/na_CSATH8_0.jpg","cc":"NetAnatomy Thorax cross-section, level 8: Muscul ":1000,"fh":1210,"cw":1400,"ch":715},{"k":"intercostal muscles","n":"Intercostal muscle","q":"Name the structure whose label is covered.","r":"thwall","t":"tb","f":"img/tb/v3_gray_180_138.jpg","s":"Gray's Anatomy for Students, Fig. 3.27","hl":[0.0485,0.0192,0.4545,0.063],"w":"In axial sections the intercostal muscle is the thin band bridging neighbouring rib cuts around the chest wall, its external, internal and innermost layers blended into one.","c":"img/na_CSATH13_0.jpg","cc":"NetAnatomy Thorax cross-section, level 13: Musculoskeletal","g":"Intercostal muscles and nerve","fw":1000,"fh":807,"cw":1400,"ch":764},{"k":"external intercostal muscle","n":"External intercostal muscle","q":"Name this muscle.","r":"thwall","t":"vb","f":"img/fc/fc_zs_S07-s004.jpg","s":"2021 zSpace & bones review (Exam 2), slide 4","hl":null,"w":"The external intercostal is the outermost muscle layer in each intercostal space, its fibres running down and forward from one rib to the rib below.","c":"img/fc_cad/cc_CC-1708284004072.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Intercostal muscles and nerve","fw":1300,"fh":491,"cw":1100,"ch":562},{"k":"internal intercostal muscle","n":"Internal intercostal muscle","q":"Name the structure at the arrows.","r":"thwall","t":"vb","f":"img/fc/fc_pr_st13.jpg","s":"Practice practical, station 13","hl":null,"w":"The internal intercostal lies deep to the external intercostal in each rib space, its fibres running down and back, with the intercostal vessels and nerve beneath it.","c":"img/fc_cad/bl_BL-1586740098790.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Internal intercostal m.\" label","g":"Intercostal muscles and nerve","fw":889,"fh":1080,"cw":1100,"ch":825},{"k":"innermost intercostal muscle","n":"Innermost intercostal muscle","q":"Name this muscle.","r":"thwall","t":"vb","f":"img/fc/fc_zs_S07-s048.jpg","s":"2021 zSpace & bones review (Exam 2), slide 48","hl":null,"w":"The innermost intercostal is mina junction, in front of and lateral to the L4 inferior articular process at the L4\u2013L5 facet joint.","c":"img/na_CSAAB11_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 11: Musculoskeletal","g":"Lumbar vertebra and back muscle","fw":1000,"fh":730,"cw":1400,"ch":731},{"k":"new:facet joint","n":"Facet Joint","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_moore_496_2111.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 4.19","hl":[0.684,0.4472,0.9532,0.482],"w":"The facet joint is the synovial joint between the inferior articular process of one vertebra and the superior articular process of the vertebra below, just behind the intervertebral foramen.","c":"img/na_CSAAB11_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 11: Musculoskeletal","g":"Lumbar vertebra and back muscle","fw":1000,"fh":1039,"cw":1400,"ch":731},{"k":"new:erector spinae muscle","n":"Erector Spinae Muscle","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_moore_515_2156.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 4.31","hl":[0.8044,0.3546,0.9557,0.5057],"w":"In axial sections the erector spinae is the thick muscle column on each side of the spinous processes, behind the transverse processes and rib angles, deep to trapezius and latissimus dorsi.","c":"img/na_CSAAB10_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 10: Musculoskeletal","g":"Lumbar vertebra and back muscle","fw":741,"fh":490,"cw":1400,"ch":730},{"k":"new:ala of left ilium","n":"Ala (Wing) of Left Ilium","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_moore_358_1828.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 3.2","hl":[0.7751,0.1393,0.9065,0.181],"w":"In this low axial section the left iliac ala is the broad bony wing at the left side of the pelvis, with iliacus inside it and the gluteal muscles outside.","c":"img/na_CSAAB12_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 12: Musculoskeletal","g":"Hip bone landmarks","fw":1000,"fh":746,"cw":1400,"ch":784},{"k":"iliac fossa","n":"Iliac fossa","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_gray_470_526.jpg","s":"Gray's Anatomy for Students, Fig. 5.21","hl":[0.0849,0.1499,0.1583,0.1772],"w":"The iliac fossa is the smooth hollow on the inner surface of the iliac wing, below the iliac crest, lined by the iliacus muscle.","c":"img/zs_S07-s514.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 514","g":"Hip bone landmarks","fw":1000,"fh":685,"cw":1400,"ch":915},{"k":"iliac crest","n":"Iliac crest","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_gray_316_323.jpg","s":"Gray's Anatomy for Students, Fig. 4.36","hl":[0.7717,0.6387,0.8973,0.6694],"w":"The iliac crest is the curved upper border of the ilium running from the anterior to the posterior superior iliac spine, its highest point level with L4.","c":"img/zs_S07-s516.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 516","g":"Hip bone landmarks","fw":1000,"fh":749,"cw":1400,"ch":914},{"k":"anterior superior iliac spine","n":"Anterior superior iliac spine (ASIS)","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_moore_219_1561.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.7","hl":[0.7759,0.6075,0.9678,0.6303],"w":"The anterior superior iliac spine is the rounded front tip of the iliac crest, where sartorius arises and the inguinal ligament starts its run to the pubic tubercle.","c":"img/zs_S07-s510.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 510","g":"Hip bone landmarks","fw":1000,"fh":813,"cw":1400,"ch":915},{"k":"pubic tubercle","n":"Pubic tubercle","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_gray_475_537.jpg","s":"Gray's Anatomy for Students, Fig. 5.25","hl":[0.5692,0.11,0.7848,0.1472],"w":"The pubic tubercle is the small knob on the upper border of the pubis at the lateral end of the pubic crest, where the inguinal ligament attaches.","c":"img/zs_S07-s512.jpg","cc":"2021 zSpace & bones review (Exam 2), slide 512","g":"Hip bone landmarks","fw":896,"fh":936,"cw":1400,"ch":914},{"k":"external oblique muscle","n":"External oblique muscle","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s203.jpg","s":"2021 zSpace & bones review (Exam 2), slide 203","hl":null,"w":"In axial sections the external oblique is the outermost flat muscle of the lateral abdominal wall, superficial to internal oblique and transversus abdominis.","c":"img/fc_cad/bl_BL-1586732836927.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"External abdominal oblique m.\" label","g":"Flat abdominal muscles, outside in","fw":1300,"fh":593,"cw":1100,"ch":825},{"k":"external oblique aponeurosis","n":"Aponeurosis of external oblique","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_moore_220_1563.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.8","hl":[0.0146,0.5069,0.1454,0.5612],"w":"In axial sections the external oblique aponeurosis is the thin white sheet continuing the muscle medially, passing in front of rectus abdominis to the linea alba.","c":"img/fc_cad/cc_CC-1708281542008.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Flat abdominal muscles, outside in","fw":1000,"fh":776,"cw":1100,"ch":787},{"k":"internal oblique muscle","n":"Internal oblique muscle","q":"Name the structure at the arrows.","r":"abwall","t":"vb","f":"img/fc/fc_pr_st16.jpg","s":"Practice practical, station 16","hl":null,"w":"The internal oblique is the middle flat abdominal muscle, between the external oblique outside and transversus abdominis inside, with fibres running up and toward the midline.","c":"img/ta_S06-q10.jpg","cc":"2020 TA mock practical, question 10","g":"Flat abdominal muscles, outside in","fw":982,"fh":1080,"cw":1400,"ch":970},{"k":"transversus abdominis muscle","n":"Transversus abdominis muscle","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s207.jpg","s":"2021 zSpace & bones review (Exam 2), slide 207","hl":null,"w":"In axial sections transversus abdominis is the innermost of the three flat lateral muscles, deep to internal oblique and just outside the transversalis fascia and peritoneum.","c":"img/fc_cad/bl_BL-1586746778275.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Tranversus abdominis m.\" label","g":"Flat abdominal muscles, outside in","fw":1300,"fh":568,"cw":1100,"ch":825},{"k":"new:transversus abdominis m iliac crest","n":"Transversus Abdominis M. Iliac Crest","q":"Name the structure whose label is covered.","r":"abwall","t":"tb","f":"img/tb/v3_gray_312_317.jpg","s":"Gray's Anatomy for Students, Fig. 4.31","hl":[0.0489,0.4738,0.2249,0.4994],"w":"Two labels: transversus abdominis is the deepest flat abdominal wall muscle, under internal oblique, and partly arises from the iliac crest, the curved upper rim of the ilium.","c":"img/na_CSAAB13_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 13: Musculoskeletal","g":"Flat abdominal muscles, outside in","fw":1000,"fh":761,"cw":1400,"ch":755},{"k":"rectus abdominis muscle","n":"Left Rectus Abdominis muscle","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s209.jpg","s":"2021 zSpace & bones review (Exam 2), slide 209","hl":null,"w":"Rectus abdominis is the paired vertical strap muscle on each side of the linea alba, running from the pubis to the xiphoid and lower costal cartilages.","c":"img/fc_cad/bl_BL-1586746607270.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Rectus abdominis m.\" label","g":"Rectus abdominis and rectus sheath","fw":1300,"fh":580,"cw":1100,"ch":825},{"k":"tendinous intersections","n":"Tendinous intersections (of rectus abdominis)","q":"Name this, be specific.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s231.jpg","s":"2021 zSpace & bones review (Exam 2), slide 231","hl":null,"w":"The tendinous intersections are three horizontal fibrous bands across rectus abdominis, at the umbilicus, near the xiphoid and midway between, fused to the anterior rectus sheath.","c":null,"cc":null,"g":"Rectus abdominis and rectus sheath","fw":1300,"fh":678},{"k":"linea alba","n":"Linea alba","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s235.jpg","s":"2021 zSpace & bones review (Exam 2), slide 235","hl":null,"w":"The linea alba is the midline fibrous seam between the two rectus abdominis muscles, running from the xiphoid process to the pubic symphysis and containing the umbilicus.","c":"img/fc_cad/bl_BL-1586746257673.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Linea alba\" label","g":"Rectus abdominis and rectus sheath","fw":847,"fh":818,"cw":1100,"ch":825},{"k":"pyramidalis muscle","n":"Pyramidalis muscle","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s211.jpg","s":"2021 zSpace & bones review (Exam 2), slide 211","hl":null,"w":"Pyramidalis is a small triangular muscle in front of the lowest part of rectus abdominis inside the rectus sheath, running from the pubis up to the linea alba.","c":"img/fc_cad/cc_CC-1708281541974.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Rectus abdominis and rectus sheath","fw":1300,"fh":563,"cw":1100,"ch":785},{"k":"arcuate line","n":"Arcuate line (of rectus sheath)","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s233.jpg","s":"2021 zSpace & bones review (Exam 2), slide 233","hl":null,"w":"The arcuate line is the curved lower edge of the posterior rectus sheath, a third of the way from umbilicus to pubic crest, where inferior epigastric vessels enter.","c":"img/fc_cad/bl_BL-1586746730609.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Arcuate line\" label","g":"Rectus abdominis and rectus sheath","fw":1300,"fh":574,"cw":1100,"ch":825},{"k":"superior epigastric artery","n":"Superior epigastric artery","q":"Name this artery.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s012.jpg","s":"2021 zSpace & bones review (Exam 2), slide 12","hl":null,"w":"The superior epigastric artery is the medial terminal branch of the internal thoracic artery, entering the rectus sheath below the 6th intercostal space and running down behind rectus abdominis.","c":"img/fc_cad/cc_CC-1708281541996.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Epigastric arteries and inguinal region","fw":1300,"fh":511,"cw":1100,"ch":770},{"k":"inferior epigastric artery","n":"Inferior epigastric artery","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s225.jpg","s":"2021 zSpace & bones review (Exam 2), slide 225","hl":null,"w":"The inferior epigastric artery leaves the external iliac above the inguinal ligament, climbs medial to the deep inguinal ring, and enters the rectus sheath at the arcuate line.","c":"img/pr_st32.jpg","cc":"Practice practical, station 32","g":"Epigastric arteries and inguinal region","fw":1300,"fh":571,"cw":1400,"ch":1132},{"k":"inguinal ligament","n":"Inguinal ligament","q":"Name this structure.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s213.jpg","s":"2021 zSpace & bones review (Exam 2), slide 213","hl":null,"w":"The inguinal ligament is the rolled lower edge of the external oblique aponeurosis, running from the anterior superior iliac spine to the pubic tubercle over the femoral vessels.","c":"img/fc_cad/bl_BL-1586746287433.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Inguinal ligament\" label","g":"Epigastric arteries and inguinal region","fw":1300,"fh":516,"cw":1100,"ch":825},{"k":"ilioinguinal nerve","n":"Ilioinguinal nerve","q":"Name this nerve.","r":"abwall","t":"vb","f":"img/fc/fc_zs_S07-s219.jpg","s":"2021 zSpace & bones review (Exam 2), slide 219","hl":null,"w":"The ilioinguinal nerve (L1) runs across quadratus lumborum just below the iliohypogastric nerve, then through the inguinal canal beside the spermatic cord, exiting the superficial inguinal ring.","c":"img/pr_st31.jpg","cc":"Practice practical, station 31","g":"Epigastric arteries and inguinal region","fw":1300,"fh":556,"cw":1400,"ch":1132},{"k":"stomach","n":"Stomach","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s263.jpg","s":"2021 zSpace & bones review (Exam 2), slide 263","hl":null,"w":"The stomach is the J-shaped sac in the left upper abdomen, running from the esophagus at the cardia to the duodenum at the pylorus, in front of the pancreas.","c":"img/fc_cad/bl_BL-1586747005348.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Stomach\" label","g":"Parts of the stomach","fw":1300,"fh":574,"cw":1100,"ch":825},{"k":"lesser curvature of stomach","n":"Lesser curvature of stomach","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_gray_335_344.jpg","s":"Gray's Anatomy for Students, Fig. 4.57","hl":[0.7182,0.1044,0.9839,0.1279],"w":"On a barium meal the lesser curvature is the short concave right border of the stomach, from the cardia to the pylorus, notched low down by the angular incisure.","c":"img/fc_cad/cc_CC-1708281542093.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Parts of the stomach","fw":1000,"fh":921,"cw":1100,"ch":625},{"k":"greater curvature of stomach","n":"Greater curvature of stomach","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_262_1623.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.37","hl":[0.823,0.852,0.9139,0.9068],"w":"On a barium meal the greater curvature is the stomach's long convex left and lower border, from cardiac notch to pylorus, where the greater omentum attaches.","c":"img/fc_cad/cc_CC-1708281542094.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Parts of the stomach","fw":1000,"fh":829,"cw":1100,"ch":615},{"k":"new:cardiac region of the stomach","n":"Cardiac Region of the Stomach","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_262_1623.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.37","hl":[0.6123,0.1429,0.6788,0.1708],"w":"The cardiac region (cardia) of the stomach surrounds the esophageal opening, left of T11, below and right of the fundus and behind the left lobe of the liver.","c":"img/na_CSAAB2_1.jpg","cc":"NetAnatomy Abdomen cross-section, level 2: Gastrointestinal","g":"Parts of the stomach","fw":1000,"fh":829,"cw":1400,"ch":766},{"k":"fundus of stomach","n":"Fundus of stomach","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_258_1617.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.33","hl":[0.6275,0.7215,0.7372,0.7707],"w":"On an upright film the fundus is the dome of the stomach above the cardia, under the left diaphragm beside the spleen, holding the gastric air bubble.","c":"img/fc_cad/cc_CC-1708281542089.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Parts of the stomach","fw":1000,"fh":1139,"cw":1100,"ch":627},{"k":"new:fundus","n":"Fundus","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_263_1627.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.38","hl":[0.0233,0.0467,0.1269,0.0901],"w":"On an upright film or barium study the gastric fundus is the dome of the stomach rising above the cardia, tucked under the left hemidiaphragm, where swallowed air collects.","c":null,"cc":null,"g":"Parts of the stomach","fw":1000,"fh":822},{"k":"body of stomach","n":"Body of stomach","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_262_1623.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.37","hl":[0.8147,0.1723,0.8679,0.1998],"w":"The body is the largest part of the stomach, between the fundus above and the pyloric antrum below, ending at the angular incisure on the lesser curvature.","c":"img/fc_cad/cc_CC-1708281542090.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Parts of the stomach","fw":1000,"fh":829,"cw":1100,"ch":643},{"k":"angular incisure","n":"Angular incisure (of stomach)","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_262_1623.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.37","hl":[0.0173,0.7484,0.1602,0.7763],"w":"On a barium meal the angular incisure is the sharp notch low on the stomach's lesser curvature, where the body ends and the pyloric part begins.","c":null,"cc":null,"g":"Parts of the stomach","fw":1000,"fh":829},{"k":"pyloric antrum","n":"Pyloric antrum","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_262_1623.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.37","hl":[0.0183,0.8344,0.1457,0.8622],"w":"The pyloric antrum is the wide part of the stomach between the angular incisure and the narrow pyloric canal, tapering to the right toward the pylorus and duodenum.","c":"img/na_CSAAB3_1.jpg","cc":"NetAnatomy Abdomen cross-section, level 3: Gastrointestinal","g":"Parts of the stomach","fw":1000,"fh":829,"cw":1400,"ch":770},{"k":"pyloric canal","n":"Pyloric canal","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_263_1627.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.38","hl":[0.0233,0.8481,0.0974,0.8915],"w":"On a barium meal the pyloric canal is the short narrow channel between the wider pyloric antrum and the pyloric sphincter, leading into the duodenal cap.","c":null,"cc":null,"g":"Parts of the stomach","fw":1000,"fh":822},{"k":"pylorus","n":"Pylorus","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_269_1640.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.44","hl":[0.0135,0.3274,0.1637,0.3606],"w":"The pylorus is the thickened sphincter end of the stomach, joining the superior part of the duodenum at the transpyloric plane (L1) just right of the midline.","c":"img/fc_cad/bl_BL-1586748600192.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Pylorus\" label","g":"Parts of the stomach","fw":1000,"fh":618,"cw":1100,"ch":825},{"k":"pyloric sphincter","n":"Pyloric sphincter (surrounds the pyloric orifice)","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_262_1623.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.37","hl":[0.9234,0.2973,0.9832,0.3521],"w":"The pyloric sphincter is the thick ring of circular smooth muscle around the pyloric opening, at the sharp junction of the stomach with the duodenum.","c":"img/fc_cad/bl_BL-1586748600203.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Pyloric sphincter\" label","g":"Parts of the stomach","fw":1000,"fh":829,"cw":1100,"ch":825},{"k":"parietal peritoneum","n":"Parietal peritoneum","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s237.jpg","s":"2021 zSpace & bones review (Exam 2), slide 237","hl":null,"w":"The parietal peritoneum is the shiny membrane lining the inside of the abdominal walls and the underside of the diaphragm, separated from the transversalis fascia by extraperitoneal fat.","c":"img/fc_cad/bl_BL-1586746778302.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Parietal peritoneum\" label","g":"Peritoneum and omenta","fw":1300,"fh":550,"cw":1100,"ch":825},{"k":"greater omentum","n":"Greater omentum","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s249.jpg","s":"2021 zSpace & bones review (Exam 2), slide 249","hl":null,"w":"The greater omentum is the fatty apron hanging from the greater curvature of the stomach, draping in front of the small intestine and attaching to the transverse colon.","c":"img/fc_cad/bl_BL-1586746966177.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Omental apron of gastrocolic ligament\" label","g":"Peritoneum and omenta","fw":1300,"fh":681,"cw":1100,"ch":825},{"k":"lesser omentum","n":"Lesser omentum","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s265.jpg","s":"2021 zSpace & bones review (Exam 2), slide 265","hl":null,"w":"The lesser omentum is the double peritoneal sheet from the stomach's lesser curvature and first part of the duodenum to the liver, with a thick free right edge.","c":null,"cc":null,"g":"Peritoneum and omenta","fw":1300,"fh":575},{"k":"hepatogastric ligament","n":"Hepatogastric ligament","q":"Name the structure at the arrows.","r":"foregut","t":"vb","f":"img/fc/fc_pr_st18.jpg","s":"Practice practical, station 18","hl":null,"w":"The hepatogastric ligament is the thin left part of the lesser omentum, spanning from the stomach's lesser curvature to the fissure for the ligamentum venosum.","c":"img/fc_cad/bl_BL-1586748388044.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Hepatogastric ligament (lesser omentum)\" label","g":"Peritoneum and omenta","fw":1271,"fh":1032,"cw":1100,"ch":825},{"k":"duodenum","n":"Duodenum","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_266_1630.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.41","hl":[0.0815,0.7208,0.1651,0.7553],"w":"The duodenum is the C-shaped first part of the small intestine, curving around the pancreatic head from the pylorus at L1 to the duodenojejunal flexure at L2.","c":"img/fc_cad/bl_BL-1586748468105.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Duodenum\" label","g":"Duodenum, pancreas and spleen","fw":1000,"fh":576,"cw":1100,"ch":825},{"k":"superior part of duodenum","n":"Superior (1st) part of duodenum","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_294_1686.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.59","hl":[0.0135,0.1613,0.218,0.1908],"w":"The superior (first) part of the duodenum runs right and back from the pylorus at L1, with the bile duct, gastroduodenal artery and portal vein behind it.","c":"img/fc_cad/bl_BL-1586796524406.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Superior (1st) part\" label","g":"Duodenum, pancreas and spleen","fw":1000,"fh":678,"cw":1100,"ch":825},{"k":"descending part of duodenum","n":"Descending (2nd) part of duodenum","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_294_1686.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.59","hl":[0.0129,0.3468,0.2431,0.3759],"w":"The descending (second) part of the duodenum runs down beside L1\u2013L3, around the pancreatic head, in front of the right kidney and right of the inferior vena cava.","c":"img/fc_cad/bl_BL-1586796524397.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Descending (2nd) part\" label","g":"Duodenum, pancreas and spleen","fw":1000,"fh":678,"cw":1100,"ch":825},{"k":"inferior part of duodenum","n":"Inferior (horizontal, 3rd) part of duodenum","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_328_1762.jpg","s":"Moore's Clinically Oriented Anatomy","hl":[0.0555,0.6211,0.3246,0.7257],"w":"The third part of the duodenum crosses L3 from right to left, between the superior mesenteric vessels in front and the inferior vena cava and aorta behind.","c":"img/ta_S06-q06.jpg","cc":"2020 TA mock practical, question 6","g":"Duodenum, pancreas and spleen","fw":562,"fh":701,"cw":1400,"ch":889},{"k":"ascending part of duodenum","n":"Ascending (4th) part of duodenum","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_271_1643.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.45","hl":[0.8869,0.7102,0.9693,0.7873],"w":"The ascending (fourth) part of the duodenum rises along the left side of the aorta on left psoas to L2, turning forward as the duodenojejunal flexure.","c":"img/fc_cad/bl_BL-1586796524426.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Ascending (4th) part\" label","g":"Duodenum, pancreas and spleen","fw":1000,"fh":830,"cw":1100,"ch":825},{"k":"duodenojejunal flexure","n":"Duodenojejunal flexure","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_272_1645.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.47","hl":[0.0239,0.0703,0.2417,0.1433],"w":"On a barium study the duodenojejunal flexure is the sharp bend at L2, just left of the spine and below the pancreas, where duodenum becomes jejunum.","c":null,"cc":null,"g":"Duodenum, pancreas and spleen","fw":1000,"fh":981},{"k":"head of pancreas","n":"Head of pancreas","q":"Name #1 \u2013 part of the pancreas","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s409.jpg","s":"2021 zSpace & bones review (Exam 2), slide 409","hl":null,"w":"The head of the pancreas sits in the duodenal C-curve, right of the superior mesenteric vessels, in front of the inferior vena cava, with the bile duct behind.","c":"img/fc_cad/bl_BL-1586796623227.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Head\" label","g":"Duodenum, pancreas and spleen","fw":1300,"fh":502,"cw":1100,"ch":825},{"k":"uncinate process of pancreas","n":"Uncinate process of pancreas","q":"Name #5 \u2013 part of the pancreas","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s409.jpg","s":"2021 zSpace & bones review (Exam 2), slide 409","hl":null,"w":"The uncinate process hooks left from the lower pancreatic head, behind the superior mesenteric vein and artery and in front of the aorta and inferior vena cava.","c":"img/fc_cad/bl_BL-1586796623226.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Uncinate process\" label","g":"Duodenum, pancreas and spleen","fw":1300,"fh":502,"cw":1100,"ch":825},{"k":"neck of pancreas","n":"Neck of pancreas","q":"Name #2 \u2013 part of the pancreas","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s409.jpg","s":"2021 zSpace & bones review (Exam 2), slide 409","hl":null,"w":"The pancreatic neck is the short narrow part between head and body, lying directly in front of the superior mesenteric vein and the start of the portal vein.","c":"img/na_CSAAB7_3.jpg","cc":"NetAnatomy Abdomen cross-section, level 7: Other","g":"Duodenum, pancreas and spleen","fw":1300,"fh":502,"cw":1400,"ch":751},{"k":"body of pancreas","n":"Body of pancreas","q":"Name #3 \u2013 part of the pancreas","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s409.jpg","s":"2021 zSpace & bones review (Exam 2), slide 409","hl":null,"w":"The body of the pancreas runs left from the neck across the aorta and left kidney, with the splenic vein behind it and splenic artery along its top.","c":"img/fc_cad/bl_BL-1586796623236.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Body\" label","g":"Duodenum, pancreas and spleen","fw":1300,"fh":502,"cw":1100,"ch":825},{"k":"tail of pancreas","n":"Tail of pancreas","q":"Name #4 \u2013 part of the pancreas","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s409.jpg","s":"2021 zSpace & bones review (Exam 2), slide 409","hl":null,"w":"The tail is the narrow left end of the pancreas, lying in front of the left kidney and running with the splenic vessels in the splenorenal ligament to the splenic hilum.","c":"img/fc_cad/bl_BL-1586796623237.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Tail\" label","g":"Duodenum, pancreas and spleen","fw":1300,"fh":502,"cw":1100,"ch":825},{"k":"main pancreatic duct","n":"Main pancreatic duct","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s411.jpg","s":"2021 zSpace & bones review (Exam 2), slide 411","hl":null,"w":"The main pancreatic duct runs through the pancreas from tail to head, then turns down to join the bile duct, opening at the major duodenal papilla.","c":"img/fc_cad/bl_BL-1586749473506.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Pancreatic duct\" label","g":"Duodenum, pancreas and spleen","fw":1300,"fh":464,"cw":1100,"ch":825},{"k":"spleen","n":"Spleen","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s261.jpg","s":"2021 zSpace & bones review (Exam 2), slide 261","hl":null,"w":"The spleen sits in the left upper abdomen against the diaphragm at ribs 9\u201311, behind and left of the stomach, lateral to the left kidney and above the left colic flexure.","c":"img/ta_S05-s037.jpg","cc":"2021 TA mock practical, slide 37","g":"Duodenum, pancreas and spleen","fw":1300,"fh":551,"cw":1400,"ch":1098},{"k":"celiac trunk","n":"Celiac trunk","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s299.jpg","s":"2021 zSpace & bones review (Exam 2), slide 299","hl":null,"w":"The celiac trunk is the first unpaired front branch of the abdominal aorta at T12, just above the pancreas, splitting into left gastric, splenic and common hepatic arteries.","c":"img/fc_cad/bl_BL-1586749615176.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Celiac trunk\" label","g":"Celiac trunk and left gastric artery","fw":1300,"fh":539,"cw":1100,"ch":825},{"k":"celiac lymph nodes","n":"Celiac lymph nodes","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s355.jpg","s":"2021 zSpace & bones review (Exam 2), slide 355","hl":null,"w":"The celiac lymph nodes cluster around the celiac trunk's root on the front of the aorta, collecting from gastric, hepatic, splenic and pancreatic nodes.","c":null,"cc":null,"g":"Celiac trunk and left gastric artery","fw":1300,"fh":579},{"k":"left gastric artery","n":"Left Gastric Artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s313.jpg","s":"2021 zSpace & bones review (Exam 2), slide 313","hl":null,"w":"The left gastric artery is the smallest branch of the celiac trunk, climbing to the esophagogastric junction and then running down the lesser curvature inside the lesser omentum.","c":"img/ta_S05-s017.jpg","cc":"2021 TA mock practical, slide 17","g":"Celiac trunk and left gastric artery","fw":1193,"fh":808,"cw":1400,"ch":1127},{"k":"left gastric vein","n":"Left gastric vein","q":"Name this, be specific.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s341.jpg","s":"2021 zSpace & bones review (Exam 2), slide 341","hl":null,"w":"The left gastric vein runs with the left gastric artery along the upper lesser curvature, receives veins from the lower esophagus, and drains into the portal vein.","c":null,"cc":null,"g":"Celiac trunk and left gastric artery","fw":1300,"fh":617},{"k":"splenic artery","n":"Splenic artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s327.jpg","s":"2021 zSpace & bones review (Exam 2), slide 327","hl":null,"w":"The splenic artery is the largest celiac trunk branch, winding left along the upper border of the pancreas behind the stomach to reach the splenic hilum through the splenorenal ligament.","c":"img/ta_S05-s110.jpg","cc":"2021 TA mock practical, slide 110","g":"Splenic artery and its branches","fw":1300,"fh":572,"cw":1400,"ch":1127},{"k":"splenic vein","n":"Splenic vein","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s397.jpg","s":"2021 zSpace & bones review (Exam 2), slide 397","hl":null,"w":"The splenic vein runs right from the splenic hilum along the back of the pancreas and joins the superior mesenteric vein behind the pancreatic neck to form the portal vein.","c":"img/fc_cad/bl_BL-1586750074816.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Splenic v.\" label","g":"Splenic artery and its branches","fw":1300,"fh":521,"cw":1100,"ch":825},{"k":"pancreatic arteries","n":"Pancreatic artery","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_295_1691.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.60","hl":[0.3969,0.0586,0.5497,0.1301],"w":"On a celiac angiogram the pancreatic arteries are the small branches dropping from the splenic artery into the pancreatic body and tail below it.","c":null,"cc":null,"g":"Splenic artery and its branches","fw":967,"fh":1025},{"k":"left gastro-omental artery","n":"Left Gastro-omental Artery","q":"Name the structure at the arrows.","r":"foregut","t":"vb","f":"img/fc/fc_pr_st20.jpg","s":"Practice practical, station 20","hl":null,"w":"The left gastro-omental artery is a branch of the splenic artery that runs along the greater curvature of the stomach inside the greater omentum.","c":"img/pr_st34.jpg","cc":"Practice practical, station 34","g":"Splenic artery and its branches","fw":1273,"fh":1080,"cw":1400,"ch":1132},{"k":"short gastric arteries","n":"Short gastric arteries","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s329.jpg","s":"2021 zSpace & bones review (Exam 2), slide 329","hl":null,"w":"The short gastric arteries are four or five small branches of the splenic artery near the splenic hilum that run in the gastrosplenic ligament to the fundus of the stomach.","c":"img/fc_cad/bl_BL-1586750182567.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Short gastric aa.\" label","g":"Splenic artery and its branches","fw":1300,"fh":668,"cw":1100,"ch":825},{"k":"common hepatic artery","n":"Common hepatic artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s301.jpg","s":"2021 zSpace & bones review (Exam 2), slide 301","hl":null,"w":"The common hepatic artery runs right from the celiac trunk along the pancreas's upper border, splitting near the duodenum's first part into gastroduodenal and proper hepatic arteries.","c":"img/ta_S05-s108.jpg","cc":"2021 TA mock practical, slide 108","g":"Common hepatic and gastroduodenal arteries","fw":1300,"fh":552,"cw":1400,"ch":1120},{"k":"gastroduodenal artery","n":"Gastroduodenal artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s317.jpg","s":"2021 zSpace & bones review (Exam 2), slide 317","hl":null,"w":"The gastroduodenal artery leaves the common hepatic artery and descends behind the first part of the duodenum, splitting into the right gastro-omental and anterior superior pancreaticoduodenal arteries.","c":"img/ta_S05-s033.jpg","cc":"2021 TA mock practical, slide 33","g":"Common hepatic and gastroduodenal arteries","fw":1300,"fh":526,"cw":1400,"ch":1232},{"k":"superior pancreaticoduodenal artery","n":"Superior pancreaticoduodenal artery","q":"Name the structure whose label is covered.","r":"foregut","t":"tb","f":"img/tb/v3_moore_265_1629.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.40","hl":[0.3493,0.8985,0.5791,0.974],"w":"On these celiac and hepatic arteriograms the superior pancreaticoduodenal arteries run down from the gastroduodenal artery in the curve between the duodenum and pancreatic head.","c":"img/fc_cad/cc_CC-1708281542115.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Common hepatic and gastroduodenal arteries","fw":1000,"fh":575,"cw":1100,"ch":516},{"k":"posterior superior pancreaticoduodenal artery","n":"Posterior superior pancreaticoduodenal artery","q":"Name this, be specific.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s323.jpg","s":"2021 zSpace & bones review (Exam 2), slide 323","hl":null,"w":"The posterior superior pancreaticoduodenal artery branches from the gastroduodenal artery behind the duodenum and descends on the back of the pancreatic head beside the bile duct.","c":"img/fc_cad/bl_BL-1586796852166.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Posterior superior pancreaticoduodenal a.\" label","g":"Common hepatic and gastroduodenal arteries","fw":1300,"fh":603,"cw":1100,"ch":825},{"k":"anterior superior pancreaticoduodenal artery","n":"Anterior superior pancreaticoduodenal artery","q":"Name this, be specific.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s321.jpg","s":"2021 zSpace & bones review (Exam 2), slide 321","hl":null,"w":"The anterior superior pancreaticoduodenal artery, a branch of the gastroduodenal artery, runs down the front of the pancreatic head beside the duodenum to meet the inferior pancreaticoduodenal artery.","c":"img/fc_cad/bl_BL-1586796733166.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Anterior superior pancreaticoduodenal a.\" label","g":"Common hepatic and gastroduodenal arteries","fw":1300,"fh":609,"cw":1100,"ch":825},{"k":"right gastro-omental artery","n":"Right Gastroepiploic Artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s319.jpg","s":"2021 zSpace & bones review (Exam 2), slide 319","hl":null,"w":"The right gastro-omental artery is a terminal branch of the gastroduodenal artery that starts below the pylorus and runs left along the greater curvature inside the greater omentum.","c":"img/ta_S06-q05.jpg","cc":"2020 TA mock practical, question 5","g":"Common hepatic and gastroduodenal arteries","fw":1300,"fh":594,"cw":1400,"ch":812},{"k":"proper hepatic artery","n":"Proper hepatic artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s303.jpg","s":"2021 zSpace & bones review (Exam 2), slide 303","hl":null,"w":"The proper hepatic artery continues the common hepatic beyond the gastroduodenal branch, rising in the hepatoduodenal ligament left of the bile duct and in front of the portal vein.","c":"img/fc_cad/bl_BL-1586749322783.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Hepatic artery proper\" label","g":"Proper hepatic artery and its branches","fw":1300,"fh":552,"cw":1100,"ch":825},{"k":"right gastric artery","n":"Right gastric artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s311.jpg","s":"2021 zSpace & bones review (Exam 2), slide 311","hl":null,"w":"The right gastric artery, a branch of the proper hepatic artery, runs left along the lesser curvature from the pylorus in the lesser omentum to join the left gastric artery.","c":"img/fc_cad/bl_BL-1586749652586.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"R. gastric a.\" label","g":"Proper hepatic artery and its branches","fw":1181,"fh":759,"cw":1100,"ch":825},{"k":"right gastric vein","n":"Right gastric vein","q":"Name this, be specific.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s339.jpg","s":"2021 zSpace & bones review (Exam 2), slide 339","hl":null,"w":"The right gastric vein runs with the right gastric artery along the lesser curvature near the pylorus and drains directly into the portal vein.","c":null,"cc":null,"g":"Proper hepatic artery and its branches","fw":1300,"fh":617},{"k":"left hepatic artery","n":"Left Hepatic Artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s307.jpg","s":"2021 zSpace & bones review (Exam 2), slide 307","hl":null,"w":"The left hepatic artery is the left end branch of the proper hepatic artery, running to the left side of the porta hepatis to supply the left liver.","c":"img/fc_cad/bl_BL-1586749113498.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"L. br. of hepatic a. proper\" label","g":"Proper hepatic artery and its branches","fw":1062,"fh":759,"cw":1100,"ch":825},{"k":"right hepatic artery","n":"Right Hepatic Artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s305.jpg","s":"2021 zSpace & bones review (Exam 2), slide 305","hl":null,"w":"The right hepatic artery is the right terminal branch of the proper hepatic artery, passing behind the common hepatic duct and giving off the cystic artery in the cystohepatic triangle.","c":"img/fc_cad/bl_BL-1586749113485.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"R. br. of hepatic a. proper\" label","g":"Proper hepatic artery and its branches","fw":1062,"fh":743,"cw":1100,"ch":825},{"k":"cystic artery","n":"Cystic artery","q":"Name this structure.","r":"foregut","t":"vb","f":"img/fc/fc_zs_S07-s309.j
