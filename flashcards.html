605,"cw":1100,"ch":825},{"k":"inferior mesenteric vein","n":"Inferior mesenteric vein","q":"Name this structure.","r":"gut","t":"vb","f":"img/fc/fc_zs_S07-s395.jpg","s":"2021 zSpace & bones review (Exam 2), slide 395","hl":null,"w":"The inferior mesenteric vein climbs the left posterior abdominal wall, just left of the duodenojejunal flexure, then passes behind the pancreas to usually drain into the splenic vein.","c":"img/fc_cad/bl_BL-1586747915236.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Inferior mesenteric v.\" label","g":"Inferior mesenteric vessels and marginal artery","fw":1300,"fh":586,"cw":1100,"ch":825},{"k":"left colic artery","n":"Left Colic Artery","q":"Name this structure.","r":"gut","t":"vb","f":"img/fc/fc_zs_S07-s389.jpg","s":"2021 zSpace & bones review (Exam 2), slide 389","hl":null,"w":"The left colic artery is the first branch of the inferior mesenteric artery, running left behind the peritoneum toward the descending colon.","c":"img/fc_cad/bl_BL-1586748052421.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Left colic a.\" label","g":"Inferior mesenteric vessels and marginal artery","fw":1300,"fh":566,"cw":1100,"ch":825},{"k":"sigmoid arteries","n":"Sigmoid arteries","q":"Name this structure.","r":"gut","t":"vb","f":"img/fc/fc_zs_S07-s391.jpg","s":"2021 zSpace & bones review (Exam 2), slide 391","hl":null,"w":"The sigmoid arteries are two to four branches of the inferior mesenteric artery that run down and left in the sigmoid mesocolon, between the left colic and superior rectal arteries.","c":"img/fc_cad/bl_BL-1586748052436.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Sigmoid aa.\" label","g":"Inferior mesenteric vessels and marginal artery","fw":1300,"fh":564,"cw":1100,"ch":825},{"k":"superior rectal artery","n":"Superior rectal artery","q":"Name this structure.","r":"gut","t":"vb","f":"img/fc/fc_zs_S07-s393.jpg","s":"2021 zSpace & bones review (Exam 2), slide 393","hl":null,"w":"The superior rectal artery is the terminal continuation of the inferior mesenteric artery, crossing the left common iliac vessels in the sigmoid mesocolon root to reach the back of the rectum.","c":"img/ta_S06-q07.jpg","cc":"2020 TA mock practical, question 7","g":"Inferior mesenteric vessels and marginal artery","fw":1300,"fh":578,"cw":1400,"ch":997},{"k":"new:rectal arteries","n":"Rectal Arteries","q":"Name the structure whose label is covered.","r":"gut","t":"tb","f":"img/tb/v3_gray_379_415.jpg","s":"Gray's Anatomy for Students, Fig. 4.118","hl":[0.5728,0.8796,0.7207,0.8944],"w":"On a pelvic angiogram the superior rectal artery continues the inferior mesenteric artery down to the rectum, while the middle and inferior rectal arteries come from internal iliac branches.","c":null,"cc":null,"g":"Inferior mesenteric vessels and marginal artery","fw":1000,"fh":1221},{"k":"marginal artery","n":"Marginal artery (of Drummond)","q":"Name the structure whose label is covered.","r":"gut","t":"tb","f":"img/tb/v3_moore_279_1659.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.54","hl":[0.4627,0.1641,0.5321,0.1942],"w":"On a mesenteric angiogram the marginal artery is the continuous channel along the inner border of the colon, linking the colic branches of both mesenteric arteries.","c":"img/fc_cad/bl_BL-1586747875934.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Marginal a.\" label","g":"Inferior mesenteric vessels and marginal artery","fw":1000,"fh":650,"cw":1100,"ch":825},{"k":"new:t12","n":"T12","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_138_1395.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.31","hl":[0.7685,0.8641,0.8902,0.8931],"w":"T12 is the last thoracic vertebra and carries the 12th ribs, with the aortic hiatus of the diaphragm in front of it and the upper poles of the kidneys beside it.","c":"img/na_CSAAB6_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 6: Musculoskeletal","g":"Vertebral levels and parts of a vertebra","fw":1000,"fh":742,"cw":1400,"ch":724},{"k":"new:body of l1","n":"Body of L1","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_471_2030.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 4.2","hl":[0.0222,0.838,0.083,0.8896],"w":"On this lateral lumbar film the body of L1 is the highest lumbar body, just below T12 and the 12th ribs, at the level of the transpyloric plane.","c":null,"cc":null,"g":"Vertebral levels and parts of a vertebra","fw":1000,"fh":635},{"k":"new:l4 vertebra","n":"L4 Vertebra","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_504_2125.jpg","s":"Moore's Clinically Oriented Anatomy","hl":[0.6751,0.0502,0.9087,0.0858],"w":"On a lumbar film L4 is the vertebra level with the tops of the iliac crests, with the aortic bifurcation in front of it and L5 sitting just below.","c":null,"cc":null,"g":"Vertebral levels and parts of a vertebra","fw":692,"fh":1046},{"k":"intervertebral disc","n":"Intervertebral disc","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_106_1333.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.5","hl":[0.1345,0.2477,0.285,0.2801],"w":"The intervertebral disc is the fibrocartilage pad between two vertebral bodies, seen as the gap between them on X-ray and as concentric rings on a slab.","c":"img/pl_s23.jpg","cc":"Plastination, slide 23","g":"Vertebral levels and parts of a vertebra","fw":1000,"fh":681,"cw":1848,"ch":1112},{"k":"vertebral foramen","n":"Vertebral foramen","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_106_1332.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.4","hl":[0.186,0.0755,0.2731,0.1386],"w":"On this slab the vertebral foramen is the hole behind the vertebral body enclosed by the pedicles and laminae; stacked together, these holes form the vertebral canal.","c":"img/pl_s23.jpg","cc":"Plastination, slide 23","g":"Vertebral levels and parts of a vertebra","fw":1000,"fh":730,"cw":1848,"ch":1112},{"k":"new:superior vertebral notch","n":"Superior Vertebral Notch","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_493_2104.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 4.14","hl":[0.2862,0.0332,0.6182,0.084],"w":"The superior vertebral notch is the shallow curve on the top edge of the pedicle; with the inferior notch of the vertebra above it forms the intervertebral foramen.","c":null,"cc":null,"g":"Vertebral levels and parts of a vertebra","fw":1000,"fh":703},{"k":"new:inferior vertebral notch","n":"Inferior Vertebral Notch","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_gray_90_15.jpg","s":"Gray's Anatomy for Students, Fig. 2.12","hl":[0.4751,0.9421,0.8146,0.9764],"w":"The inferior vertebral notch is the deep curve on the underside of the pedicle; with the superior notch of the vertebra below it forms the intervertebral foramen for the spinal nerve.","c":null,"cc":null,"g":"Vertebral levels and parts of a vertebra","fw":885,"fh":1016},{"k":"sacrum","n":"Sacrum","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_369_1852.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 3.9","hl":[0.7214,0.8356,0.7952,0.8719],"w":"The sacrum is the triangle of five fused vertebrae below L5 forming the back of the pelvis, set between the two iliac wings at the sacroiliac joints.","c":"img/pl_s28.jpg","cc":"Plastination, slide 28","g":"Sacrum and ilium","fw":1000,"fh":683,"cw":1900,"ch":1133},{"k":"new:sacral promontory","n":"Sacral Promontory","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_362_1837.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 3.5","hl":[0.0457,0.4323,0.2168,0.51],"w":"The sacral promontory is the jutting front upper edge of the S1 body, forming the back of the pelvic inlet, with the median sacral vessels running down in front of it.","c":"img/na_CSAAB13_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 13: Musculoskeletal","g":"Sacrum and ilium","fw":946,"fh":944,"cw":1400,"ch":755},{"k":"ilium","n":"Ilium (ala of ilium)","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_361_1833.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 3.4","hl":[0.0236,0.2133,0.0899,0.2602],"w":"In low abdominal sections the ilium is the curved bony wing on each side, lateral to psoas, lined inside by iliacus and outside by the gluteal muscles.","c":"img/na_CSAAB13_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 13: Musculoskeletal","g":"Sacrum and ilium","fw":1000,"fh":774,"cw":1400,"ch":755},{"k":"new:right sacroiliac joint","n":"Right Sacroiliac Joint","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_361_1833.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 3.4","hl":[0.0236,0.3009,0.2534,0.3498],"w":"The right sacroiliac joint is where the ear-shaped surface of the sacrum meets the right ilium, at the back of the pelvis behind the internal iliac vessels.","c":"img/na_CSAAB13_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 13: Musculoskeletal","g":"Sacrum and ilium","fw":1000,"fh":774,"cw":1400,"ch":755},{"k":"new:gluteal muscles","n":"Gluteal Muscles","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_513_2151.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 4.29","hl":[0.771,0.8402,0.8922,0.8577],"w":"The gluteal muscles (maximus, medius, minimus) form the buttock behind and beside the iliac wing and hip joint, with gluteus maximus the most superficial and minimus the deepest.","c":"img/na_CSAAB13_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 13: Musculoskeletal","g":"Muscles of the body wall","fw":1000,"fh":1147,"cw":1400,"ch":755},{"k":"new:sternal part of the diaphragm","n":"Sternal part the Diaphragm","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_335_1778.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.91","hl":[0.1669,0.0883,0.2834,0.1236],"w":"The sternal part of the diaphragm is two small slips from the back of the xiphoid process, running back to the central tendon just under the heart.","c":"img/na_CSAAB4_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 4: Musculoskeletal","g":"Parts of the diaphragm","fw":1000,"fh":704,"cw":1400,"ch":751},{"k":"new:costal part of the diaphragm","n":"Costal part the Diaphragm","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_139_1397.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 1.32","hl":[0.0133,0.8559,0.1014,0.9001],"w":"The costal part of the diaphragm arises from the inner surfaces of the lower six ribs and costal cartilages, curving up between the lung bases and the liver and spleen.","c":"img/na_CSAAB4_0.jpg","cc":"NetAnatomy Abdomen cross-section, level 4: Musculoskeletal","g":"Parts of the diaphragm","fw":1000,"fh":589,"cw":1400,"ch":751},{"k":"crus of diaphragm","n":"Crus of diaphragm","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_gray_132_81.jpg","s":"Gray's Anatomy for Students, Fig. 2.52","hl":[0.2739,0.0145,0.4368,0.0478],"w":"In axial sections the diaphragmatic crura are the muscle bands hugging each side of the aorta on the upper lumbar vertebrae; the right crus also encircles the esophagus.","c":"img/na_CSAAB2_1.jpg","cc":"NetAnatomy Abdomen cross-section, level 2: Gastrointestinal","g":"Parts of the diaphragm","fw":1000,"fh":1011,"cw":1400,"ch":766},{"k":"psoas major muscle","n":"Psoas major muscle","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s465.jpg","s":"2021 zSpace & bones review (Exam 2), slide 465","hl":null,"w":"Psoas major is the thick round muscle hugging the sides of the lumbar vertebral bodies, with the kidney in front and lateral and quadratus lumborum behind and lateral.","c":"img/fc_cad/cc_CC-1708281542317.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Muscles of the posterior abdominal wall","fw":1300,"fh":571,"cw":1100,"ch":763},{"k":"psoas minor muscle","n":"Psoas minor muscle","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s467.jpg","s":"2021 zSpace & bones review (Exam 2), slide 467","hl":null,"w":"Psoas minor is a small muscle from T12 and L1 whose long flat tendon runs down the front of psoas major; it is absent in many people.","c":"img/fc_cad/cc_CC-1708281542318.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Muscles of the posterior abdominal wall","fw":1300,"fh":571,"cw":1100,"ch":760},{"k":"quadratus lumborum muscle","n":"Quadratus lumborum muscle","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s471.jpg","s":"2021 zSpace & bones review (Exam 2), slide 471","hl":null,"w":"Quadratus lumborum is the flat posterior abdominal wall muscle between the iliac crest and 12th rib, behind and lateral to psoas major and behind the kidney.","c":"img/fc_cad/cc_CC-1708281542316.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Muscles of the posterior abdominal wall","fw":1300,"fh":607,"cw":1100,"ch":677},{"k":"iliacus muscle","n":"Iliacus muscle","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s469.jpg","s":"2021 zSpace & bones review (Exam 2), slide 469","hl":null,"w":"The iliacus lines the iliac fossa lateral to psoas major, with the femoral nerve in the groove between them, and joins psoas to insert on the lesser trochanter.","c":"img/fc_cad/cc_CC-1708281542319.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Muscles of the posterior abdominal wall","fw":1300,"fh":552,"cw":1100,"ch":700},{"k":"iliopsoas muscle","n":"Iliopsoas muscle (psoas major + iliacus)","q":"Name this muscle.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s473.jpg","s":"2021 zSpace & bones review (Exam 2), slide 473","hl":null,"w":"The iliopsoas is psoas major and iliacus merged below the iliac fossa, passing under the inguinal ligament lateral to the femoral vessels to insert on the lesser trochanter.","c":null,"cc":null,"g":"Muscles of the posterior abdominal wall","fw":1300,"fh":619},{"k":"kidney","n":"Kidney","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s419.jpg","s":"2021 zSpace & bones review (Exam 2), slide 419","hl":null,"w":"Each kidney lies behind the peritoneum on psoas major and quadratus lumborum at T12 to L3, with the suprarenal gland on its upper pole and its hilum facing medially.","c":"img/fc_cad/cc_CC-1708281542289.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Kidneys, suprarenal glands and coverings","fw":1300,"fh":574,"cw":1100,"ch":686},{"k":"left kidney","n":"Left Kidney","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_255_1609.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.30","hl":[0.154,0.3769,0.2435,0.4084],"w":"In an axial section the left kidney lies lateral to psoas major and in front of quadratus lumborum, behind the spleen and the tail of the pancreas.","c":"img/fc_cad/cc_CC-1708281542289.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Kidneys, suprarenal glands and coverings","fw":1000,"fh":684,"cw":1100,"ch":686},{"k":"right kidney","n":"Right Kidney","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_255_1609.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.30","hl":[0.6869,0.402,0.7886,0.4334],"w":"The right kidney lies retroperitoneally on psoas major and quadratus lumborum, slightly lower than the left, behind the liver, descending duodenum and right colic flexure.","c":"img/fc_cad/bl_BL-1586797234037.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"R. kidney\" label","g":"Kidneys, suprarenal glands and coverings","fw":1000,"fh":684,"cw":1100,"ch":825},{"k":"suprarenal gland","n":"Left Adrenal Gland","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_326_1759.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.86","hl":[0.7895,0.0289,0.972,0.096],"w":"In axial sections the right adrenal gland sits behind the inferior vena cava above the right kidney; the left lies medial to the upper left kidney, beside the left crus.","c":"img/fc_cad/cc_CC-1708281542290.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Kidneys, suprarenal glands and coverings","fw":858,"fh":1038,"cw":1100,"ch":618},{"k":"renal fascia","n":"Renal fascia (Gerota's fascia)","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_gray_403_443.jpg","s":"Gray's Anatomy for Students, Fig. 4.140","hl":[0.0395,0.4323,0.1367,0.4637],"w":"In an axial section the renal fascia is the thin line wrapping the kidney, suprarenal gland and perirenal fat, with the pararenal fat lying outside it.","c":"img/fc_cad/bl_BL-1586744909919.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Renal fascia\" label","g":"Kidneys, suprarenal glands and coverings","fw":1000,"fh":641,"cw":1100,"ch":825},{"k":"fibrous capsule of kidney","n":"Fibrous capsule of kidney (renal capsule)","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s443.jpg","s":"2021 zSpace & bones review (Exam 2), slide 443","hl":null,"w":"The renal capsule is the thin, tough membrane on the kidney's surface, deep to the perirenal fat, turning inward at the hilum to line the renal sinus.","c":"img/fc_cad/bl_BL-1586745198300.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Renal fibrous capsule\" label","g":"Kidneys, suprarenal glands and coverings","fw":1300,"fh":666,"cw":1100,"ch":825},{"k":"renal cortex","n":"Renal cortex","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s439.jpg","s":"2021 zSpace & bones review (Exam 2), slide 439","hl":null,"w":"The renal cortex is the outer pale band of the kidney just under the capsule, dipping inward as renal columns between the darker striped medullary pyramids.","c":"img/fc_cad/bl_BL-1586745004189.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Renal cortex\" label","g":"Inside the kidney, out to the ureter","fw":1228,"fh":750,"cw":1100,"ch":825},{"k":"renal pyramid","n":"Renal pyramid (medulla)","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s441.jpg","s":"2021 zSpace & bones review (Exam 2), slide 441","hl":null,"w":"The renal pyramids make up the medulla: striped cones deep to the cortex, separated by renal columns, with their tips (papillae) pointing into the minor calyces.","c":"img/fc_cad/bl_BL-1586745004203.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Renal pyramid (medulla)\" label","g":"Inside the kidney, out to the ureter","fw":1228,"fh":750,"cw":1100,"ch":825},{"k":"renal sinus","n":"Renal sinus","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_moore_322_1751.jpg","s":"Moore's Clinically Oriented Anatomy, Fig. 2.80","hl":[0.5172,0.2557,0.5549,0.2823],"w":"The renal sinus is the fat-filled cavity inside the kidney, opening at the hilum, that holds the renal pelvis, the calyces and branches of the renal vessels.","c":"img/fc_cad/bl_BL-1586745073265.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Renal sinus\" label","g":"Inside the kidney, out to the ureter","fw":1000,"fh":695,"cw":1100,"ch":825},{"k":"minor calyx","n":"Minor calyx","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s445.jpg","s":"2021 zSpace & bones review (Exam 2), slide 445","hl":null,"w":"Each minor calyx is a small cup in the renal sinus wrapped around the tip (papilla) of a renal pyramid, joining others to form a major calyx.","c":"img/fc_cad/cc_CC-1708281542300.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Inside the kidney, out to the ureter","fw":1300,"fh":648,"cw":906,"ch":798},{"k":"major calyx","n":"Major calyx","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s447.jpg","s":"2021 zSpace & bones review (Exam 2), slide 447","hl":null,"w":"The major calyces are the two or three main branches of the renal pelvis inside the renal sinus, each formed where several minor calyces join.","c":"img/fc_cad/cc_CC-1708281542301.jpg","cc":"ComprehensiveCadaver \u00b7 the line points to it","g":"Inside the kidney, out to the ureter","fw":1300,"fh":648,"cw":1014,"ch":798},{"k":"renal pelvis","n":"Renal pelvis","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s431.jpg","s":"2021 zSpace & bones review (Exam 2), slide 431","hl":null,"w":"The renal pelvis is the funnel-shaped top of the ureter, formed in the renal sinus by the major calyces and lying behind the renal vessels at the hilum.","c":"img/fc_cad/bl_BL-1586745246872.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"Renal pelvis\" label","g":"Inside the kidney, out to the ureter","fw":1300,"fh":600,"cw":1100,"ch":825},{"k":"ureter","n":"Left Ureter","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s433.jpg","s":"2021 zSpace & bones review (Exam 2), slide 433","hl":null,"w":"Each ureter runs from the renal pelvis down the front of psoas major behind the peritoneum, crossed anteriorly by the gonadal vessels, and enters the pelvis over the common iliac bifurcation.","c":"img/pr_st40.jpg","cc":"Practice practical, station 40","g":"Inside the kidney, out to the ureter","fw":1300,"fh":614,"cw":833,"ch":1163},{"k":"renal artery","n":"Left Renal Artery","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s435.jpg","s":"2021 zSpace & bones review (Exam 2), slide 435","hl":null,"w":"Each renal artery leaves the aorta just below the superior mesenteric artery; the right runs behind the inferior vena cava, the left behind the left renal vein.","c":"img/ta_S05-s112.jpg","cc":"2021 TA mock practical, slide 112","g":"Renal and gonadal vessels","fw":1131,"fh":756,"cw":1400,"ch":1127},{"k":"segmental arteries of kidney","n":"Segmental arteries of kidney","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s429.jpg","s":"2021 zSpace & bones review (Exam 2), slide 429","hl":null,"w":"The segmental arteries are the five end-arteries the renal artery splits into at the renal hilum, each feeding one kidney segment before dividing into interlobar arteries in the renal sinus.","c":"img/fc_cad/bl_BL-1586745198300.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 shows the kidney","g":"Renal and gonadal vessels","fw":1300,"fh":600,"cw":1100,"ch":825},{"k":"renal vein","n":"Renal vein","q":"Name this structure.","r":"retro","t":"vb","f":"img/fc/fc_zs_S07-s425.jpg","s":"2021 zSpace & bones review (Exam 2), slide 425","hl":null,"w":"The renal veins leave each hilum in front of the renal arteries and drain into the inferior vena cava; the left is longer and crosses in front of the aorta.","c":null,"cc":null,"g":"Renal and gonadal vessels","fw":1096,"fh":828},{"k":"right renal vein","n":"Right Renal Vein","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_gray_405_445.jpg","s":"Gray's Anatomy for Students, Fig. 4.142","hl":[0.1856,0.949,0.3016,0.9785],"w":"In axial sections the right renal vein is the short, wide vein running straight from the right renal hilum, in front of the renal artery, into the inferior vena cava.","c":"img/fc_cad/bl_BL-1586745298160.jpg","cc":"BlueLink cadaver atlas (University of Michigan) \u00b7 find the \"R. renal v.\" label","g":"Renal and gonadal vessels","fw":1000,"fh":642,"cw":1100,"ch":825},{"k":"left renal vein","n":"Left Renal vein","q":"Name the structure whose label is covered.","r":"retro","t":"tb","f":"img/tb/v3_gray_405_445.jpg", const $ = id => document.getElementById(id);
const RNAME = Object.fromEntries(DATA.regions);
let kind = 'all', region = 'all', order = [], pos = 0, shown = false;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function pool() { return DATA.cards.map((c, i) => i).filter(i => (kind === 'all' || DATA.cards[i].t === kind) && (region === 'all' || DATA.cards[i].r === region)); }

function save() { try { localStorage.setItem('labocc-fc2', JSON.stringify({ kind, region, order, pos })); } catch (e) {} }

function show() {
  const n = order.length;
  if (!n) { $('pos').textContent = 'No cards'; return; }
  pos = Math.max(0, Math.min(pos, n - 1));
  const c = DATA.cards[order[pos]];
  shown = false;
  $('pos').textContent = (pos + 1) + ' / ' + n;
  const same = order.filter(i => DATA.cards[i].r === c.r && DATA.cards[i].g === c.g);
  $('grp').textContent = RNAME[c.r] + ' \u00b7 ' + c.g;
  if (same.length > 1) $('grp').append(el('span', null, (same.indexOf(order[pos]) + 1) + ' of ' + same.length));
  const gs = $('group'); if (gs.value !== c.r + '|' + c.g) gs.value = c.r + '|' + c.g;
  const st = $('stage');
  st.style.aspectRatio = c.fw + ' / ' + c.fh;
  st.style.maxWidth = 'min(100%, calc(' + (c.fw / c.fh).toFixed(4) + ' * (100vh - 330px)))';
  st.querySelectorAll('.cover').forEach(x => x.remove());
  const img = $('front'); img.src = c.f; img.alt = c.t === 'vb' ? 'Visible Body 3-D model' : 'Textbook figure'; img.width = c.fw; img.height = c.fh;
  if (c.hl) {
    const cv = el('span', 'cover', '?');
    cv.style.left = (c.hl[0] * 100 - 0.6) + '%'; cv.style.top = (c.hl[1] * 100 - 0.6) + '%';
    cv.style.width = ((c.hl[2] - c.hl[0]) * 100 + 1.2) + '%'; cv.style.height = ((c.hl[3] - c.hl[1]) * 100 + 1.2) + '%';
    st.append(cv);
  }
  $('src').textContent = (c.t === 'vb' ? 'Visible Body \u00b7 ' : '') + c.s;
  $('q').textContent = c.q;
  $('name').textContent = c.n; $('name').hidden = true; $('reveal').hidden = false;
  $('where').open = false;
  $('wtx').textContent = c.w || '';
  if (c.c) { $('cadfig').hidden = false; $('cad').dataset.src = c.c; $('cad').removeAttribute('src'); $('cad').width = c.cw; $('cad').height = c.ch; $('cadcap').textContent = c.cc || ''; }
  else { $('cadfig').hidden = true; }
  // warm the next card's picture
  if (pos + 1 < n) { const pre = new Image(); pre.src = DATA.cards[order[pos + 1]].f; }
  save();
}
function reveal() {
  shown = true; $('name').hidden = false; $('reveal').hidden = true;
  $('stage').querySelectorAll('.cover').forEach(x => x.classList.add('open'));
}
function go(d) { pos += d; if (pos >= order.length) pos = 0; if (pos < 0) pos = order.length - 1; show(); }
function fillGroups() {
  const gs = $('group'); gs.textContent = '';
  const seen = new Set();
  for (const i of pool()) { const c = DATA.cards[i]; const v = c.r + '|' + c.g; if (seen.has(v)) continue; seen.add(v);
    gs.append(new Option((region === 'all' ? RNAME[c.r] + ' \u203a ' : '') + c.g, v)); }
}
function rebuild(keepShuffle) { order = pool(); pos = 0; if (keepShuffle) shuffle(false); fillGroups(); show(); paint(); }
function shuffle(doShow = true) {
  // shuffles within the current filter; group headings still show which unit each card belongs to
 for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } pos = 0; if (doShow) show(); }

$('where').addEventListener('toggle', () => { const im = $('cad'); if ($('where').open && im.dataset.src && !im.getAttribute('src')) im.src = im.dataset.src; });
$('reveal').addEventListener('click', reveal);
$('next').addEventListener('click', () => go(1));
$('prev').addEventListener('click', () => go(-1));
$('shuffle').addEventListener('click', () => shuffle());
$('restart').addEventListener('click', () => { kind = 'all'; region = 'all'; $('region').value = 'all'; rebuild(false); });
document.addEventListener('keydown', e => {
  if (e.target.closest('select, input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest('button, summary')) return; e.preventDefault(); shown ? go(1) : reveal(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'w' || e.key === 'W') $('where').open = !$('where').open;
});

// filters
const regSel = $('region');
regSel.append(new Option('All regions (' + DATA.cards.length + ')', 'all'));
for (const [rid, rname] of DATA.regions) { const k = DATA.cards.filter(c => c.r === rid).length; if (k) regSel.append(new Option(rname + ' (' + k + ')', rid)); }
regSel.addEventListener('change', () => { region = regSel.value; rebuild(false); });
$('group').addEventListener('change', () => {
  const [r, g] = $('group').value.split('|');
  const at = order.findIndex(i => DATA.cards[i].r === r && DATA.cards[i].g === g);
  if (at >= 0) { pos = at; show(); }
});
const KINDS = [['all', 'All cards'], ['vb', 'Visible Body'], ['tb', 'Textbook drawing']];
function paint() { $('kinds').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === kind)); }
for (const [k, label] of KINDS) {
  const b = el('button', null, label); b.type = 'button'; b.dataset.k = k;
  b.append(el('span', 'c', k === 'all' ? DATA.cards.length : DATA.cards.filter(c => c.t === k).length));
  b.addEventListener('click', () => { kind = k; rebuild(false); });
  $('kinds').append(b);
}
$('summary').textContent = DATA.cards.length + ' cards: ' + DATA.cards.filter(c => c.t === 'vb').length + ' Visible Body, ' + DATA.cards.filter(c => c.t === 'tb').length + ' textbook';

try {
  const s = JSON.parse(localStorage.getItem('labocc-fc2') || 'null');
  if (s && Array.isArray(s.order) && s.order.every(i => DATA.cards[i])) { kind = s.kind; region = s.region; order = s.order; pos = s.pos || 0; regSel.value = region; }
} catch (e) {}
if (!order.length) order = pool();
fillGroups(); paint(); show();
</script>

</body>
</html>
